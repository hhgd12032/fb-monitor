/* ============================================================ Report wrapper (月報 / 季報) ============================================================ */
function ReportView(props) {
  const [mode, setMode] = useState("month"); // month | quarter
  const modeSwitch = (
    <div style={styles.modeSwitch}>
      <button style={{ ...styles.modeBtn, ...(mode === "month" ? styles.modeBtnActive : {}) }} onClick={() => setMode("month")}><Icon name="chart" size={15} />月報</button>
      <button style={{ ...styles.modeBtn, ...(mode === "quarter" ? styles.modeBtnActive : {}) }} onClick={() => setMode("quarter")}><Icon name="calendar" size={15} />季報</button>
    </div>
  );
  return mode === "month"
    ? <MonthReportView {...props} modeSwitch={modeSwitch} />
    : <QuarterReportView {...props} modeSwitch={modeSwitch} />;
}

function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

const QUARTER_DEFS = [
  { q: 1, mm: ["01", "02", "03"] },
  { q: 2, mm: ["04", "05", "06"] },
  { q: 3, mm: ["07", "08", "09"] },
  { q: 4, mm: ["10", "11", "12"] },
];

const GROUP_COLORS = { A: "#3D6A63", B: "#8A5E3C", C: "#5E4A7A" };
const GROUP_BGS = { A: "#DDE5E2", B: "#EDE4D6", C: "#E2DDE8" };

function fmtNum(v, digits = 0) {
  if (v == null || isNaN(v)) return "—";
  return Number(v).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function MonthGroupBadges({ list }) {
  return (
    <div style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>
      {list.map(({ m, g }) => (
        <span key={m} title={`${monthLabel(m)}：${g ? g + " 組" : "未參賽"}`}
          style={{ fontSize: 10.5, padding: "1px 5px", borderRadius: 4, fontWeight: 600, fontFamily: "'Space Grotesk', sans-serif",
            background: g ? GROUP_BGS[g] : "#F0EDE6", color: g ? GROUP_COLORS[g] : "#B0A98F" }}>
          {parseInt(m.slice(5))}月{g || "–"}
        </span>
      ))}
    </div>
  );
}

// e.g. 234 + 300 + 600 = 1,134, with the month under each number
function MonthSum({ r, field }) {
  const total = field === "n" ? r.n : r.total;
  if (r.byMonth.length <= 1) return <span>{total.toLocaleString()}</span>;
  return (
    <div>
      <div style={{ fontWeight: 600 }}>{total.toLocaleString()}</div>
      <div style={{ fontSize: 10.5, color: "#A6A096", whiteSpace: "nowrap" }} title={r.byMonth.map((b) => `${monthLabel(b.m)}：${b[field].toLocaleString()}`).join("\n")}>
        {r.byMonth.map((b, i) => (
          <span key={b.m}>
            {i > 0 && " + "}
            <span style={{ color: "#7A7568" }}>{b[field].toLocaleString()}</span>
            <sub style={{ fontSize: 9, marginLeft: 1 }}>{parseInt(b.m.slice(5))}月</sub>
          </span>
        ))}
        {" = "}{total.toLocaleString()}
      </div>
    </div>
  );
}

function RankCell({ i }) {
  if (i === 0) return <span title="冠軍" style={{ color: "#B08968" }}><Icon name="crown" size={15} /></span>;
  return <span style={{ color: i < 3 ? "#B08968" : "#3A3A38", fontWeight: i < 3 ? 600 : 400 }}>{i + 1}</span>;
}

function ChampionCard({ title, row, valueText, sub, onClick }) {
  return (
    <div onClick={onClick} title="點擊跳到完整排名" style={{ ...styles.statCard, flexDirection: "column", alignItems: "flex-start", gap: 6, cursor: onClick ? "pointer" : "default" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, color: "#9C9684" }}>
        <Icon name="crown" size={15} /> {title}
      </div>
      <div style={{ fontFamily: "'Noto Serif TC', serif", fontSize: 18, fontWeight: 700, color: "#33312C" }}>
        {row ? row.page.name : "—"}
      </div>
      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, color: "#7B8F77", fontWeight: 600 }}>{row ? valueText : "尚無資料"}</div>
      {row && sub && <div style={{ fontSize: 11.5, color: "#A6A096" }}>{sub}</div>}
    </div>
  );
}

function QuarterReportView({ pages, posts, fanRecords, groupRecords, events, showToast, modeSwitch }) {
  // every month that has any data
  const allMonths = useMemo(() => {
    const set = new Set(posts.map((p) => p.month));
    Object.values(fanRecords).forEach((arr) => (arr || []).forEach((e) => set.add((e.date || "").slice(0, 7))));
    Object.keys(groupRecords).forEach((m) => set.add(m));
    set.delete("");
    return [...set].filter(Boolean).sort();
  }, [posts, fanRecords, groupRecords]);

  const latestDataMonth = allMonths[allMonths.length - 1] || nowMonth();
  const years = useMemo(() => {
    const ys = new Set(allMonths.map((m) => m.slice(0, 4)));
    ys.add(latestDataMonth.slice(0, 4));
    return [...ys].sort();
  }, [allMonths, latestDataMonth]);

  const [qMode, setQMode] = useState("fixed"); // fixed | custom
  const [year, setYear] = useState(latestDataMonth.slice(0, 4));
  const [quarter, setQuarter] = useState(Math.ceil(parseInt(latestDataMonth.slice(5, 7)) / 3));
  const [customMonths, setCustomMonths] = useState(() => allMonths.slice(-3));
  const [groupFilter, setGroupFilter] = useState(""); // "" | A | B | C
  const [participantsOnly, setParticipantsOnly] = useState(true);
  const [excludeLive, setExcludeLive] = useState(false);
  const [minPosts, setMinPosts] = useState(3);
  const [growthSort, setGrowthSort] = useState("diff"); // diff | pct
  const [excludedIds, setExcludedIds] = useState([]); // dealers unticked in the picker
  const [showPicker, setShowPicker] = useState(false);
  const [showFormula, setShowFormula] = useState(false);
  const TOP_N = 10;
  const [expanded, setExpanded] = useState({ growth: false, avg: false, rate: false });
  const toggleExpand = (k) => setExpanded((e) => ({ ...e, [k]: !e[k] }));
  const jumpTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });
  const ExpandBar = ({ k, total }) => total > TOP_N ? (
    <button onClick={() => toggleExpand(k)} style={styles.expandBar}>
      {expanded[k] ? `▲ 收合（只顯示前 ${TOP_N} 名）` : `▼ 展開全部（還有 ${total - TOP_N} 家，共 ${total} 家）`}
    </button>
  ) : null;

  const qMonths = useMemo(() => {
    if (qMode === "fixed") return QUARTER_DEFS[quarter - 1].mm.map((mm) => `${year}-${mm}`);
    return [...customMonths].sort();
  }, [qMode, year, quarter, customMonths]);

  const rangeLabel = qMode === "fixed"
    ? `${year} Q${quarter}（${parseInt(qMonths[0].slice(5))}–${parseInt(qMonths[2].slice(5))}月）`
    : qMonths.length ? qMonths.map((m) => `${parseInt(m.slice(5))}月`).join("、") : "未選月份";

  const toggleCustomMonth = (m) =>
    setCustomMonths((arr) => {
      if (arr.includes(m)) return arr.filter((x) => x !== m);
      if (arr.length >= 3) { showToast("自選最多 3 個月，請先取消其中一個"); return arr; }
      return [...arr, m];
    });

  // core per-dealer computation
  const rows = useMemo(() => {
    return pages
      .filter((page) => !excludedIds.includes(page.id))
      .map((page) => {
        const groupsByMonth = qMonths.map((m) => ({ m, g: groupRecords[m]?.[page.id] || "" }));
        const eligible = groupsByMonth
          .filter(({ g }) => (groupFilter ? g === groupFilter : participantsOnly ? !!g : true))
          .map(({ m }) => m);
        if (eligible.length === 0) return null;

        const pp = posts.filter((p) =>
          p.pageId === page.id && eligible.includes(p.month) && !(excludeLive && (p.format || p.type) === "live")
        );
        const fanEntries = (fanRecords[page.id] || [])
          .filter((e) => eligible.includes((e.date || "").slice(0, 7)))
          .sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.id || "").localeCompare(b.id || ""));
        if (pp.length === 0 && fanEntries.length === 0) return null;

        const first = fanEntries[0] || null;
        const last = fanEntries[fanEntries.length - 1] || null;
        const diff = fanEntries.length > 1 ? last.count - first.count : null;
        const pct = diff != null && first.count > 0 ? (diff / first.count) * 100 : null;

        const engs = pp.map(engagement);
        const total = engs.reduce((s, v) => s + v, 0);
        const n = pp.length;
        const avg = n ? total / n : null;
        const med = n ? median(engs) : null;
        const fanBase = last ? last.count : null;
        const rate = n && fanBase > 0 ? (med / fanBase) * 100 : null;
        const liveCount = posts.filter((p) => p.pageId === page.id && eligible.includes(p.month) && (p.format || p.type) === "live").length;

        // per-month breakdown (only months counted for this dealer)
        const byMonth = eligible.map((m) => {
          const mp = pp.filter((p) => p.month === m);
          const me = mp.map(engagement);
          return { m, n: mp.length, total: me.reduce((a, b) => a + b, 0), med: mp.length ? median(me) : null };
        });
        return { page, pp, prof: postProfile(pp), groupsByMonth, eligible, byMonth, n, total, avg, med, fanBase, first, last, diff, pct, rate, stars: pp.filter((p) => p.star).length, liveCount };
      })
      .filter(Boolean);
  }, [pages, posts, fanRecords, groupRecords, qMonths, groupFilter, participantsOnly, excludeLive, excludedIds]);

  const growthRows = useMemo(() => {
    const key = growthSort === "pct" ? "pct" : "diff";
    return rows.filter((r) => r.first).sort((a, b) => (b[key] ?? -Infinity) - (a[key] ?? -Infinity));
  }, [rows, growthSort]);
  const qualified = useMemo(() => rows.filter((r) => r.n >= minPosts), [rows, minPosts]);
  const notQualified = rows.filter((r) => r.n > 0 && r.n < minPosts);
  const avgRows = useMemo(() => [...qualified].sort((a, b) => b.avg - a.avg || b.med - a.med), [qualified]);
  const rateRows = useMemo(() => qualified.filter((r) => r.rate != null).sort((a, b) => b.rate - a.rate), [qualified]);

  const overall = useMemo(() => postProfile(rows.flatMap((r) => r.pp)), [rows]);
  const monthStats = useMemo(() => qMonths.map((m) => {
    const list = rows.flatMap((r) => r.byMonth.filter((b) => b.m === m));
    return { m, n: list.reduce((s, b) => s + b.n, 0), total: list.reduce((s, b) => s + b.total, 0) };
  }), [rows, qMonths]);
  const qEvents = useMemo(() => eventsInMonths(events, qMonths), [events, qMonths]);

  /* ---- AI prompt & report ---- */
  const [qPrompt, setQPrompt] = useState("");
  const [qCopied, setQCopied] = useState(false);
  const [qAiResult, setQAiResult] = useState("");
  const qMdRef = useRef(null);
  const scopeLabel = `${groupFilter ? `只看 ${groupFilter} 組月份` : participantsOnly ? "只計參賽月份" : "全部月份"}${excludeLive ? "・已排除直播" : ""}・互動王至少 ${minPosts} 篇`;
  const promptCtx = () => ({ rangeLabel, scopeLabel, minPosts, totals, overall, monthStats, qEvents, growthRows, avgRows, rateRows, growthSort });
  const genQPrompt = () => { setQPrompt(buildQuarterPrompt(promptCtx())); setQCopied(false); };
  const copyQPrompt = async () => {
    try { await navigator.clipboard.writeText(qPrompt); setQCopied(true); showToast("已複製到剪貼簿"); setTimeout(() => setQCopied(false), 2000); }
    catch (e) { showToast("複製失敗，請手動選取文字複製"); }
  };
  const loadQMd = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { setQAiResult(ev.target.result); showToast(`已載入「${file.name}」`); };
    reader.readAsText(file, "utf-8"); e.target.value = "";
  };
  const downloadQReport = () => {
    const html = buildQuarterReportHtml({ ...promptCtx(), aiResult: qAiResult });
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `Honda季報_${qMode === "fixed" ? `${year}Q${quarter}` : qMonths.join("_")}.html`; a.click();
    showToast("HTML 季報已下載");
  };

  const totals = useMemo(() => ({
    dealers: rows.length,
    posts: rows.reduce((s, r) => s + r.n, 0),
    eng: rows.reduce((s, r) => s + r.total, 0),
    growth: rows.reduce((s, r) => s + (r.diff || 0), 0),
  }), [rows]);

  const groupCounts = useMemo(() => {
    const c = { A: 0, B: 0, C: 0 };
    pages.forEach((p) => ["A", "B", "C"].forEach((g) => {
      if (qMonths.some((m) => groupRecords[m]?.[p.id] === g)) c[g]++;
    }));
    return c;
  }, [pages, groupRecords, qMonths]);

  const exportExcel = () => {
    try {
      const wb = XLSX.utils.book_new();
      const brk = (r, key) => r.byMonth.map((b) => `${parseInt(b.m.slice(5))}月${b[key] ?? "-"}`).join(" + ");
      const groupStr = (r) => r.groupsByMonth.map(({ m, g }) => `${parseInt(m.slice(5))}月${g || "-"}`).join(" ");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(growthRows.map((r, i) => ({
        排名: i + 1, 粉絲團: r.page.name, 各月組別: groupStr(r), 計入月數: r.eligible.length,
        起始日期: r.first?.date || "", 起始粉絲: r.first?.count ?? "", 結束日期: r.last?.date || "", 結束粉絲: r.last?.count ?? "",
        增減人數: r.diff ?? "僅一筆", 成長率: r.pct != null ? `${r.pct.toFixed(2)}%` : "",
      }))), "粉絲成長王");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(avgRows.map((r, i) => ({
        排名: i + 1, 粉絲團: r.page.name, 各月組別: groupStr(r), 篇數: r.n, 各月篇數: brk(r, "n"), 總互動: r.total, 各月總互動: brk(r, "total"),
        篇均互動: Number(r.avg.toFixed(1)), 中位數互動: r.med, 點子王篇數: r.stars,
      }))), "互動王_篇均互動數");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rateRows.map((r, i) => ({
        排名: i + 1, 粉絲團: r.page.name, 各月組別: groupStr(r), 篇數: r.n, 中位數互動: r.med, 各月中位數參考: brk(r, "med"),
        粉絲數: r.fanBase, 互動率: `${r.rate.toFixed(2)}%`,
      }))), "互動王_篇均互動率");
      const fname = qMode === "fixed" ? `${year}Q${quarter}` : qMonths.join("_");
      XLSX.writeFile(wb, `粉絲團季報_${fname}${groupFilter ? "_" + groupFilter + "組" : ""}.xlsx`);
      showToast("已匯出季報 Excel");
    } catch (e) {
      console.error(e);
      showToast("匯出失敗，請稍後再試");
    }
  };

  const showGroupCol = true;
  const thR = { ...styles.th, textAlign: "right" };
  const tdNum = { ...styles.td, textAlign: "right", fontFamily: "'Space Grotesk', sans-serif" };

  return (
    <div style={styles.viewWrap}>
      <div id="q-top" />
      <Header title="季報表" subtitle="跨月份統整：粉絲成長王 · 互動王">
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          {modeSwitch}
          <button style={styles.primaryBtn} onClick={exportExcel} disabled={rows.length === 0}>
            <Icon name="download" size={16} />
            匯出季報 Excel
          </button>
        </div>
      </Header>

      {/* ---- Range & filters ---- */}
      <div style={styles.card}>
        <div style={{ display: "flex", gap: 7, marginBottom: 14, flexWrap: "wrap" }}>
          <button style={{ ...styles.chipBtn, ...(qMode === "fixed" ? styles.chipBtnActive : {}) }} onClick={() => setQMode("fixed")}>固定季度</button>
          <button style={{ ...styles.chipBtn, ...(qMode === "custom" ? styles.chipBtnActive : {}) }} onClick={() => setQMode("custom")}>自選三個月</button>
        </div>

        {qMode === "fixed" ? (
          <div style={{ display: "flex", gap: 10, alignItems: "flex-end", flexWrap: "wrap" }}>
            <Field label="年份">
              <select style={{ ...styles.input, width: 110 }} value={year} onChange={(e) => setYear(e.target.value)}>
                {years.map((y) => <option key={y} value={y}>{y}</option>)}
              </select>
            </Field>
            <Field label="季度">
              <div style={{ display: "flex", gap: 6 }}>
                {QUARTER_DEFS.map(({ q, mm }) => {
                  const hasData = mm.some((x) => allMonths.includes(`${year}-${x}`));
                  return (
                    <button key={q}
                      style={{ ...styles.chipBtn, padding: "8px 14px", ...(quarter === q ? styles.chipBtnActive : {}), ...(hasData ? {} : { opacity: 0.45 }) }}
                      onClick={() => setQuarter(q)}
                      title={`${parseInt(mm[0])}–${parseInt(mm[2])}月${hasData ? "" : "（無資料）"}`}>
                      Q{q}
                    </button>
                  );
                })}
              </div>
            </Field>
          </div>
        ) : (
          <Field label={`點選任意月份組合（最多 3 個，已選 ${customMonths.length}/3）`}>
            <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
              {allMonths.map((m) => (
                <button key={m} style={{ ...styles.chipBtn, ...(customMonths.includes(m) ? styles.chipBtnActive : {}) }} onClick={() => toggleCustomMonth(m)}>
                  {monthLabel(m)}
                </button>
              ))}
            </div>
          </Field>
        )}

        <div style={{ borderTop: "1px solid #E6E1D6", margin: "16px 0 14px" }} />

        <div style={styles.filterLabel}>競賽組別（依每個月份各自的分組判斷）</div>
        <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginBottom: 12 }}>
          {[["", "全部"], ["A", `A 組（${groupCounts.A}）`], ["B", `B 組（${groupCounts.B}）`], ["C", `C 組（${groupCounts.C}）`]].map(([k, label]) => (
            <button key={k} style={{ ...styles.chipBtn, ...(groupFilter === k ? styles.chipBtnActive : {}) }} onClick={() => setGroupFilter(k)}>{label}</button>
          ))}
        </div>

        <div style={{ display: "flex", gap: 18, flexWrap: "wrap", alignItems: "center", fontSize: 13, color: "#5C5847" }}>
          <label style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer", opacity: groupFilter ? 0.5 : 1 }}>
            <input type="checkbox" checked={groupFilter ? true : participantsOnly} disabled={!!groupFilter}
              onChange={(e) => setParticipantsOnly(e.target.checked)} style={{ accentColor: "#8A9A8E" }} />
            只計入有參賽（有分組）的月份
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 7, cursor: "pointer" }}>
            <input type="checkbox" checked={excludeLive} onChange={(e) => setExcludeLive(e.target.checked)} style={{ accentColor: "#8A9A8E" }} />
            互動計算排除直播
          </label>
          <label style={{ display: "flex", alignItems: "center", gap: 7 }}>
            互動王最低篇數
            <input type="number" min={1} value={minPosts} onChange={(e) => setMinPosts(Math.max(1, Number(e.target.value) || 1))}
              style={{ ...styles.input, width: 64, padding: "5px 8px" }} />
            篇
          </label>
          <button style={{ ...styles.chipBtn, marginLeft: "auto" }} onClick={() => setShowPicker((v) => !v)}>
            經銷商篩選（{pages.length - excludedIds.length}/{pages.length}）{showPicker ? " ▲" : " ▼"}
          </button>
        </div>

        {showPicker && (
          <div style={{ marginTop: 12, padding: 12, background: "#F3F0EA", borderRadius: 10 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button style={styles.secondaryBtn} onClick={() => setExcludedIds([])}>全選</button>
              <button style={styles.secondaryBtn} onClick={() => setExcludedIds(pages.map((p) => p.id))}>全取消</button>
            </div>
            <div style={{ display: "flex", gap: 7, flexWrap: "wrap", maxHeight: 200, overflowY: "auto" }}>
              {pages.map((p) => {
                const on = !excludedIds.includes(p.id);
                return (
                  <button key={p.id}
                    style={{ ...styles.chipBtn, ...(on ? styles.chipBtnActive : {}), ...(p.hidden ? { fontStyle: "italic" } : {}) }}
                    onClick={() => setExcludedIds((ids) => (on ? [...ids, p.id] : ids.filter((x) => x !== p.id)))}>
                    {p.name}{p.hidden ? "（隱藏）" : ""}
                  </button>
                );
              })}
            </div>
          </div>
        )}
      </div>

      <div style={{ fontSize: 13, color: "#7A7568", marginTop: -8 }}>
        目前範圍：<b>{rangeLabel}</b>{groupFilter ? ` · 只看 ${groupFilter} 組月份` : participantsOnly ? " · 只計參賽月份" : " · 全部月份"}{excludeLive ? " · 已排除直播" : ""}
        <button style={{ ...styles.iconBtn, fontSize: 12.5, color: "#8A9A8E", marginLeft: 6 }} onClick={() => setShowFormula((v) => !v)}>
          {showFormula ? "收合算式說明 ▲" : "算式說明 ▼"}
        </button>
      </div>

      {showFormula && (
        <div style={{ ...styles.card, fontSize: 13, color: "#5C5847", lineHeight: 1.85 }}>
          <div><b>粉絲成長王</b>　= 季末最新粉絲數 − 季初最舊粉絲數 → 看誰成長最多。成長率 = 增減人數 ÷ 季初粉絲數。</div>
          <div><b>互動王（篇均互動數）</b>　= 總互動 ÷ 總篇數（互動 = 讚＋留言＋分享）→ 看絕對互動量，大小粉絲團通吃。</div>
          <div><b>互動王（篇均互動率）</b>　= 中位數互動 ÷ 粉絲數 × 100% → 排除直播異常值、校正粉絲規模，最公平。</div>
          <div style={{ paddingLeft: 12 }}>・<b>中位數互動</b>：把計入月份「所有貼文」的互動數攤開排序，取正中間那篇（偶數篇取中間兩篇平均）。表格下方小字的「各月參考」只是讓你看每月狀況，不參與計算。</div>
          <div style={{ paddingLeft: 12 }}>・<b>粉絲數</b>：季末最後一筆粉絲數。</div>
          <div style={{ color: "#9C9684", marginTop: 6 }}>※ 每家經銷商只計入「有參賽的月份」（或你選的組別所在月份），所以中途加入或某月沒參賽的經銷商不會被拉低。篇數未達門檻的不列入互動王排名，避免 1、2 篇好運爆文就奪冠。</div>
        </div>
      )}

      {/* ---- Summary ---- */}
      <div style={styles.statRow}>
        <StatCard icon="list" label="納入經銷商" value={totals.dealers.toLocaleString()} />
        <StatCard icon="spark" label="計入貼文" value={totals.posts.toLocaleString()} />
        <StatCard icon="heart" label="總互動" value={totals.eng.toLocaleString()} />
        <StatCard icon="trend" label="粉絲淨增" value={(totals.growth >= 0 ? "+" : "") + totals.growth.toLocaleString()} tone={totals.growth >= 0 ? "good" : "bad"} />
      </div>

      {rows.length === 0 ? (
        <div style={styles.card}>
          <EmptyState text={qMonths.length === 0 ? "請至少選一個月份。" : "這個範圍內沒有符合條件的資料。若是參賽篩選造成的，可以到「粉絲團清單」確認這幾個月份是否已設定 A/B/C 組，或取消勾選「只計入有參賽的月份」。"} />
        </div>
      ) : (
        <>
          <div style={styles.jumpBar}>
            <span style={{ fontSize: 12, color: "#9C9684", marginRight: 4 }}>跳到</span>
            <button style={styles.jumpBtn} onClick={() => jumpTo("q-growth")}><Icon name="users" size={14} />粉絲成長王</button>
            <button style={styles.jumpBtn} onClick={() => jumpTo("q-avg")}><Icon name="heart" size={14} />篇均互動數</button>
            <button style={styles.jumpBtn} onClick={() => jumpTo("q-rate")}><Icon name="spark" size={14} />篇均互動率</button>
            <button style={styles.jumpBtn} onClick={() => jumpTo("q-top3")}><Icon name="crown" size={14} />前三名分析</button>
            <button style={styles.jumpBtn} onClick={() => jumpTo("q-ai")}><Icon name="edit" size={14} />AI 季報</button>
          </div>
          <FloatNav topId="q-top" items={[
            { id: "q-insight", label: "重點圖表", icon: "chart" },
            { id: "q-growth", label: "粉絲成長王", icon: "users" },
            { id: "q-avg", label: "篇均互動數", icon: "heart" },
            { id: "q-rate", label: "篇均互動率", icon: "spark" },
            { id: "q-top3", label: "前三名分析", icon: "crown" },

/* ============================================================ Shared: colors, events, profiles, floating nav ============================================================ */
// Categorical palette for post formats — validated (lightness / chroma / CVD / contrast all pass on light surface)
const FORMAT_COLORS = { image: "#008C7A", video: "#B87420", reels: "#6A55A8", live: "#C2456A", other: "#4A86C5" };
const formatOf = (p) => {
  const f = p.format || p.type || "other";
  if (f === "static") return "image";
  if (f === "reel") return "reels";
  return FORMAT_COLORS[f] ? f : "other";
};
const MIN_FORMAT_N = 3;
const formatLabel = (f) => POST_FORMATS.find((t) => t.value === f)?.label || "其他";

const EVENT_TYPES = [
  { value: "season", label: "季節／節慶", color: "#B87420" },
  { value: "launch", label: "新車發表", color: "#C2456A" },
  { value: "campaign", label: "官方促銷活動", color: "#008C7A" },
  { value: "other", label: "其他", color: "#6A55A8" },
];
const eventType = (v) => EVENT_TYPES.find((t) => t.value === v) || EVENT_TYPES[3];
const eventEnd = (e) => (e.end && e.end >= e.start ? e.end : e.start);
const eventsInMonths = (events, months) =>
  (events || [])
    .filter((e) => months.some((m) => e.start <= `${m}-31` && eventEnd(e) >= `${m}-01`))
    .sort((a, b) => a.start.localeCompare(b.start));
const eventRangeLabel = (e) => {
  const s = e.start.slice(5).replace("-", "/");
  const end = eventEnd(e);
  return end !== e.start ? `${s}–${end.slice(5).replace("-", "/")}` : s;
};

// Per-dealer (or any post set) breakdown: formats, tags, sources, star posts, top post
function postProfile(pp) {
  const engs = pp.map(engagement);
  const total = engs.reduce((a, b) => a + b, 0);
  const n = pp.length;
  const avg = n ? total / n : 0;
  const formats = {};
  Object.keys(FORMAT_COLORS).forEach((f) => (formats[f] = { n: 0, total: 0 }));
  const tags = {};
  const sources = { original: 0, repost: 0, ai: 0 };
  pp.forEach((p) => {
    const f = formatOf(p);
    formats[f].n++; formats[f].total += engagement(p);
    (p.tags || []).forEach((t) => {
      tags[t] = tags[t] || { n: 0, total: 0 };
      tags[t].n++; tags[t].total += engagement(p);
    });
    const s = p.source || "original";
    sources[sources[s] != null ? s : "original"]++;
  });
  const starPosts = pp.filter((p) => p.star);
  const nonStar = pp.filter((p) => !p.star);
  const starTotal = starPosts.reduce((s, p) => s + engagement(p), 0);
  const nonStarTotal = nonStar.reduce((s, p) => s + engagement(p), 0);
  const sorted = [...pp].sort((a, b) => engagement(b) - engagement(a));
  const topPost = sorted[0] || null;
  const formatRank = Object.entries(formats).filter(([, v]) => v.n > 0)
    .map(([f, v]) => ({ f, n: v.n, total: v.total, avg: v.total / v.n })).sort((a, b) => b.avg - a.avg);
  const bestFormat = formatRank.find((x) => x.n >= MIN_FORMAT_N) || null; // ignore tiny samples for headlines
  const tagRank = Object.entries(tags).map(([t, v]) => ({ t, n: v.n, total: v.total, avg: v.total / v.n }))
    .sort((a, b) => b.n - a.n || b.avg - a.avg);
  return {
    n, total, avg, median: n ? median(engs) : 0, formats, formatRank, bestFormat, tagRank, sources,
    star: { n: starPosts.length, total: starTotal, avg: starPosts.length ? starTotal / starPosts.length : 0, posts: starPosts },
    nonStarAvg: nonStar.length ? nonStarTotal / nonStar.length : 0,
    topPost, topShare: total ? engagement(topPost) / total : 0,
  };
}

// Rule-based observations (data facts, not AI) about why a dealer performs
function profileInsights(prof, baseline) {
  const out = [];
  if (!prof.n) return out;
  const best = prof.bestFormat;
  if (best && prof.formatRank.filter((x) => x.n >= MIN_FORMAT_N).length > 1)
    out.push(`${formatLabel(best.f)}表現最好：均 ${fmtNum(best.avg, 0)} 互動／篇（${best.n} 篇）`);
  if (baseline && best && baseline.avg > 0 && best.avg / baseline.avg >= 1.5)
    out.push(`${formatLabel(best.f)}均互動是全體平均的 ${(best.avg / baseline.avg).toFixed(1)} 倍`);
  const live = prof.formats.live;
  if (live.n > 0 && prof.total > 0 && live.total / prof.total >= 0.3)
    out.push(`直播 ${live.n} 篇貢獻 ${Math.round((live.total / prof.total) * 100)}% 互動，篇均數字有被拉高`);
  if (prof.star.n > 0 && prof.nonStarAvg > 0) {
    const r = prof.star.avg / prof.nonStarAvg;
    out.push(r >= 1.15
      ? `點子王 ${prof.star.n} 篇均 ${fmtNum(prof.star.avg, 0)}，是一般貼文的 ${r.toFixed(1)} 倍`
      : r <= 0.85
        ? `點子王 ${prof.star.n} 篇均 ${fmtNum(prof.star.avg, 0)}，低於一般貼文均 ${fmtNum(prof.nonStarAvg, 0)}（創意分高但互動未必高）`
        : `點子王 ${prof.star.n} 篇均 ${fmtNum(prof.star.avg, 0)}，與一般貼文相近`);
  }
  if (prof.topShare >= 0.35 && prof.n >= 4)
    out.push(`互動集中：最高一篇就佔 ${Math.round(prof.topShare * 100)}%`);
  if (prof.n >= 4 && prof.median >= prof.avg * 0.75)
    out.push(`中位數接近平均，每篇表現穩定`);
  const ownShare = prof.sources.original / prof.n;
  if (ownShare >= 0.8 && prof.n >= 4) out.push(`自製比例 ${Math.round(ownShare * 100)}%`);
  else if (prof.sources.repost / prof.n >= 0.5) out.push(`轉發佔 ${Math.round((prof.sources.repost / prof.n) * 100)}%`);
  return out.slice(0, 4);
}

/* ---- Small infographic building blocks (HTML, hover tooltips via title) ---- */
function HBarList({ items, max, unitLabel = "", valueFmt = (v) => fmtNum(v, 1) }) {
  const m = max || Math.max(...items.map((i) => i.value), 1);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
      {items.map((it) => (
        <div key={it.label} title={it.tip || `${it.label}：${valueFmt(it.value)}${unitLabel}`}
          style={{ display: "grid", gridTemplateColumns: "84px 1fr auto", gap: 10, alignItems: "center", fontSize: 12.5 }}>
          <span style={{ color: "#5C5847", display: "flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }}>
            {it.color && <span style={{ width: 9, height: 9, borderRadius: 2, background: it.color, flexShrink: 0 }} />}
            {it.label}
          </span>
          <div style={{ height: 14, background: "#F0EDE6", borderRadius: 4, overflow: "hidden" }}>
            <div style={{ width: `${Math.max((it.value / m) * 100, it.value > 0 ? 2 : 0)}%`, height: "100%", background: it.color || "#008C7A", borderRadius: "0 4px 4px 0" }} />
          </div>
          <span style={{ fontFamily: "'Space Grotesk', sans-serif", color: "#3A3A38", minWidth: 120, textAlign: "right", whiteSpace: "nowrap" }}>
            <b>{valueFmt(it.value)}</b>{unitLabel}
            {it.sub && <span style={{ color: "#A6A096", fontSize: 11, marginLeft: 6 }}>{it.sub}</span>}
          </span>
        </div>
      ))}
    </div>
  );
}

function FormatStack({ formats, height = 12, showLabels = false }) {
  const total = Object.values(formats).reduce((s, v) => s + v.n, 0);
  if (!total) return <div style={{ fontSize: 12, color: "#A6A096" }}>無貼文</div>;
  return (

/* ---- Markdown → HTML (escaped) for exported reports ---- */
function mdLiteToHtml(md) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  const out = []; let list = null;
  const flush = () => { if (list) { out.push(`</${list}>`); list = null; } };
  md.split("\n").forEach((raw) => {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flush(); return; }
    if ((m = line.match(/^#{3,6}\s+(.+)/))) { flush(); out.push(`<h4>${inline(m[1])}</h4>`); return; }
    if ((m = line.match(/^\s*[-*•]\s+(.+)/))) { if (list !== "ul") { flush(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); return; }
    if ((m = line.match(/^\s*\d+[.)、]\s+(.+)/))) { if (list !== "ol") { flush(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); return; }
    flush(); out.push(`<p>${inline(line)}</p>`);
  });
  flush();
  return out.join("\n");
}

function splitMdSections(md) {
  const sections = []; let cur = { title: "", body: [] };
  md.split("\n").forEach((line) => {
    const h = line.match(/^#{1,2}\s+(.+)/);
    if (h) { if (cur.title || cur.body.join("").trim()) sections.push(cur); cur = { title: h[1].trim(), body: [] }; }
    else cur.body.push(line);
  });
  if (cur.title || cur.body.join("").trim()) sections.push(cur);
  return sections.map((s) => ({ title: s.title, body: s.body.join("\n").trim() }));
}

  L.push("");
  L.push("請以繁體中文撰寫，語氣專業精簡，多用條列，每段不超過 200 字。分析要引用下方數字，不要編造資料中沒有的事實。");
  L.push("");
  L.push("---");
  L.push("");
  L.push("【季度整體】");
  L.push(`  納入 ${totals.dealers} 家｜貼文 ${totals.posts} 篇｜總互動 ${totals.eng.toLocaleString()}｜篇均 ${fmtNum(overall.avg, 1)}｜中位數 ${fmtNum(overall.median, 1)}｜粉絲淨增 ${totals.growth >= 0 ? "+" : ""}${totals.growth}`);
  L.push(`  每月：${monthStats.map((b) => `${parseInt(b.m.slice(5))}月 ${b.n}篇／互動${b.total}`).join("、")}`);
  L.push("");
  L.push("【各形式效益（全體）】");
  overall.formatRank.forEach((x) => L.push(`  ${formatLabel(x.f)}：${x.n} 篇，總互動 ${x.total}，篇均 ${fmtNum(x.avg, 1)}`));
  L.push("【各內容標籤效益（全體）】");
  overall.tagRank.forEach((t) => L.push(`  ${t.t}：${t.n} 篇，篇均 ${fmtNum(t.avg, 1)}`));
  L.push(`【點子王 vs 一般貼文】點子王 ${overall.star.n} 篇，均 ${fmtNum(overall.star.avg, 1)}；一般貼文均 ${fmtNum(overall.nonStarAvg, 1)}`);
  L.push("");
  if (qEvents.length) {
    L.push("【期間官方活動】");
    qEvents.forEach((e) => L.push(`  ${e.start}${eventEnd(e) !== e.start ? "～" + eventEnd(e) : ""}　${eventType(e.type).label}：${e.title}${e.note ? `（${e.note}）` : ""}`));
    L.push("");
  }
  L.push(`【粉絲成長王 前三名】（依${growthSort === "pct" ? "成長率" : "增減人數"}）`);
  growthRows.slice(0, 3).forEach((r, i) => dealerBlock(r, i, "growth"));
  L.push("");
  L.push("【互動王（篇均互動數）前三名】");
  avgRows.slice(0, 3).forEach((r, i) => dealerBlock(r, i, "avg"));
  L.push("");
  L.push("【互動王（篇均互動率）前三名】");
  rateRows.slice(0, 3).forEach((r, i) => dealerBlock(r, i, "rate"));
  L.push("");
  L.push("【完整排名摘要（供比較中後段）】");
  L.push("  粉絲成長：" + growthRows.slice(0, 15).map((r, i) => `${i + 1}.${r.page.name}${r.diff != null ? (r.diff >= 0 ? "+" : "") + r.diff : "—"}`).join("、"));
  L.push("  篇均互動數：" + avgRows.slice(0, 15).map((r, i) => `${i + 1}.${r.page.name}${fmtNum(r.avg, 1)}`).join("、"));
  L.push("  篇均互動率：" + rateRows.slice(0, 15).map((r, i) => `${i + 1}.${r.page.name}${r.rate.toFixed(2)}%`).join("、"));
  return L.join("\n");
}

/* ---------------- Quarter HTML report (infographic) ---------------- */
function buildQuarterReportHtml(ctx) {
  const { rangeLabel, scopeLabel, totals, overall, monthStats, qEvents, growthRows, avgRows, rateRows, aiResult, growthSort } = ctx;
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const sections = splitMdSections(aiResult || "");
  const used = new Set();
  const take = (...keys) => {
    const idx = sections.findIndex((s, i) => !used.has(i) && keys.some((k) => s.title.includes(k)));
    if (idx < 0) return "";
    used.add(idx);
    return mdLiteToHtml(sections[idx].body);
  };
  const aiRate = take("互動率");
  const aiAvg = take("篇均互動數", "互動數");
  const aiGrowth = take("粉絲成長");
  const aiOverview = take("總覽", "摘要", "重點");
  const aiFormat = take("類型", "形式", "內容");
  const aiEvents = take("活動");
  const aiNext = take("建議", "下季", "行動");
  const rest = sections.filter((s, i) => !used.has(i) && (s.title || s.body));

  const fmt1 = (v) => fmtNum(v, 1);
  const bars = (items) => {
    const max = Math.max(...items.map((i) => i.value), 1);
    return `<div class="bars">${items.map((i) => `
      <div class="bar-row" title="${esc(i.tip || "")}"><span class="bl"><i style="background:${i.color}"></i>${esc(i.label)}</span>
      <span class="bt"><span class="bf" style="width:${Math.max((i.value / max) * 100, 2)}%;background:${i.color}"></span></span>
      <span class="bv"><b>${fmt1(i.value)}</b> <small>${esc(i.sub || "")}</small></span></div>`).join("")}</div>`;
  };
  const stack = (formats) => {
    const tot = Object.values(formats).reduce((s, v) => s + v.n, 0) || 1;
    return `<div class="stack">${Object.entries(formats).filter(([, v]) => v.n).map(([f, v]) =>
      `<span style="flex:${v.n};background:${FORMAT_COLORS[f]}" title="${formatLabel(f)} ${v.n} 篇，均 ${fmt1(v.total / v.n)}"></span>`).join("")}</div>
      <div class="stack-l">${Object.entries(formats).filter(([, v]) => v.n).map(([f, v]) => `<span><i style="background:${FORMAT_COLORS[f]}"></i>${formatLabel(f)} ${v.n}（${Math.round((v.n / tot) * 100)}%）</span>`).join("")}</div>`;
  };
  const groupsStr = (r) => r.groupsByMonth.map(({ m, g }) => `<span class="gb ${g ? "g" + g : ""}">${parseInt(m.slice(5))}月${g || "–"}</span>`).join("");
  const metric = (cat, r) => catMetric(cat, r, growthSort);
  const podium = (cat, list) => {
    const order = [1, 0, 2].filter((i) => list[i]);
    const h = { 0: 120, 1: 88, 2: 66 };
    return `<div class="podium">${order.map((i) => `
      <div class="pod">
        <div class="pod-name">${esc(list[i].page.name)}</div>
        <div class="pod-val">${esc(metric(cat, list[i]))}</div>
        <div class="pod-bar r${i}" style="height:${h[i]}px"><span>${i + 1}</span></div>
      </div>`).join("")}</div>`;
  };
  const detailCard = (cat, r, i) => {
    const p = r.prof;
    const ins = profileInsights(p, overall);
    const mmax = Math.max(...r.byMonth.map((b) => b.total), 1);
    return `<div class="dcard r${i}">
      <div class="dc-h"><span class="rk r${i}">${i + 1}</span><div><div class="dc-n">${esc(r.page.name)}</div><div>${groupsStr(r)}</div></div></div>
      <div class="dc-m">${esc(metric(cat, r))}<small>${esc(catMetricSub(cat, r))}</small></div>
      <div class="lab">每月總互動</div>
      <div class="mbars">${r.byMonth.map((b) => `<div><em>${b.total.toLocaleString()}</em><span style="height:${Math.max((b.total / mmax) * 40, 2)}px"></span><small>${parseInt(b.m.slice(5))}月</small></div>`).join("")}</div>
      <div class="lab">貼文形式（${p.n} 篇）</div>${stack(p.formats)}
      <div class="kv"><div><span class="lab">⭐ 點子王</span><b>${p.star.n} 篇</b><small>${p.star.n ? `互動 ${p.star.total.toLocaleString()}・均 ${fmtNum(p.star.avg, 0)}` : "—"}</small></div>
      <div><span class="lab">最強形式（≥${MIN_FORMAT_N}篇）</span><b>${p.bestFormat ? formatLabel(p.bestFormat.f) : "—"}</b><small>${p.bestFormat ? `均 ${fmtNum(p.bestFormat.avg, 0)}／篇・${p.bestFormat.n}篇` : "樣本不足"}</small></div></div>
      ${ins.length ? `<ul class="ins">${ins.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
    </div>`;
  };
  const catBlock = (cat, title, list, ai, note) => `
  <section class="section">
    <div class="sh"><h2>${title}</h2><small>${note}</small></div>
    ${list.length ? `<div class="cat-top">${podium(cat, list)}</div>
    <div class="dgrid">${list.map((r, i) => detailCard(cat, r, i)).join("")}</div>` : `<p class="muted">此類別沒有符合條件的經銷商</p>`}
    ${ai ? `<div class="ai">${ai}</div>` : ""}
  </section>`;

  const formatItems = overall.formatRank.map((x) => ({ label: formatLabel(x.f), value: x.avg, color: FORMAT_COLORS[x.f], sub: x.n < MIN_FORMAT_N ? `${x.n} 篇・樣本少` : `${x.n} 篇` }));
  const tagItems = overall.tagRank.filter((t) => t.n >= 3).sort((a, b) => b.avg - a.avg).map((t) => ({ label: t.t, value: t.avg, color: "#5C6B73", sub: `${t.n} 篇` }));
  const mMax = Math.max(...monthStats.map((b) => b.total), 1);
  const starRatio = overall.nonStarAvg > 0 && overall.star.n ? (overall.star.avg / overall.nonStarAvg).toFixed(1) : null;

  return `<!DOCTYPE html>

function buildReportHtml({ pages, posts, fanRecords, groupRecords, month, aiResult }) {
  const monthGroups = groupRecords[month] || {};
  const monthPosts = posts.filter((p) => p.month === month);
  const pageMap = {};
  pages.forEach((p) => { pageMap[p.id] = p; });

  const getGroup = (pid) => monthGroups[pid] || "";
  const eng = (p) => (p.likes || 0) + (p.comments || 0) + (p.shares || 0);

  const groupColors = { A: "#3D6A63", B: "#7A5230", C: "#4E3D6E" };
  const groupBgs   = { A: "#EBF0EE", B: "#F5EDE3", C: "#EDE9F2" };

  // Per-group stats
  const groups = { A: [], B: [], C: [] };
  pages.forEach((page) => {
    const grp = monthGroups[page.id];
    if (!grp || !groups[grp]) return;
    const pp = monthPosts.filter((p) => p.pageId === page.id);
    const fanEntries = ((fanRecords[page.id] || [])
      .filter((e) => (e.date || "").startsWith(month))
      .sort((a, b) => (a.date || "").localeCompare(b.date || "")));
    const fanFirst = fanEntries[0]?.count;
    const fanLast  = fanEntries[fanEntries.length - 1]?.count;
    const fanDiff  = fanEntries.length > 1 ? fanLast - fanFirst : null;
    const totalEng = pp.reduce((s, p) => s + eng(p), 0);
    const starCount = pp.filter((p) => p.star).length;
    const sources = { original: 0, repost: 0, ai: 0 };
    pp.forEach((p) => { const s = p.source || "original"; if (sources[s] != null) sources[s]++; else sources.original++; });
    groups[grp].push({ page, pp, totalEng, avgEng: pp.length ? (totalEng / pp.length).toFixed(1) : 0, fanFirst, fanLast, fanDiff, starCount, sources });
  });
  ["A","B","C"].forEach((g) => groups[g].sort((a, b) => (b.fanDiff || 0) - (a.fanDiff || 0)));

  const starPosts = monthPosts.filter((p) => p.star);
  const totalStats = {
    pages: Object.values(groups).flat().length,
    posts: monthPosts.length,
    eng: monthPosts.reduce((s, p) => s + eng(p), 0),
    stars: starPosts.length,
  };

  // Parse AI result sections (simple split by ##)
  const parseAI = (md) => {
    if (!md.trim()) return {};
    const sections = {};
    const lines = md.split("\n");
    let current = "intro"; let buf = [];
    lines.forEach((line) => {
      const h = line.match(/^#{1,3}\s+(.+)/);
      if (h) { sections[current] = buf.join("\n").trim(); current = h[1]; buf = []; }
      else buf.push(line);
    });
    sections[current] = buf.join("\n").trim();
    return sections;
  };
  const aiSections = parseAI(aiResult);
  const aiText = (key) => {
    const match = Object.entries(aiSections).find(([k]) => k.includes(key));
    return match ? match[1] : "";
  };
  const mdToHtml = (md) => md
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/\n{2,}/g, "</p><p>")
    .replace(/\n- /g, "<br>• ")
    .replace(/^- /g, "• ");

  const groupTable = (grp) => {
    const members = groups[grp];
    if (!members.length) return "";
    const rows = members.map((m) => `
      <tr>
        <td>${m.page.name}</td>
        <td class="r">${m.pp.length}</td>
        <td class="r">${m.totalEng.toLocaleString()}</td>
        <td class="r" style="color:${Number(m.avgEng) >= 50 ? "#2E6B50" : "#555"}">${m.avgEng}</td>
        <td class="r" style="color:${m.fanDiff == null ? "#AAA" : m.fanDiff > 0 ? "#2E6B50" : m.fanDiff < 0 ? "#B03030" : "#555"}">
          ${m.fanDiff == null ? (m.fanLast ?? "—") : (m.fanDiff > 0 ? "+" : "") + m.fanDiff}
        </td>
        <td class="r">${m.starCount > 0 ? "⭐ " + m.starCount : "—"}</td>
      </tr>`).join("");
    return `<table class="tbl">
      <thead><tr><th>${grp} 組</th><th class="r">篇數</th><th class="r">互動</th><th class="r">均互動</th><th class="r">粉絲增減</th><th class="r">點子王</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  };

  const starCards = starPosts.map((p) => {
    const grp = getGroup(p.pageId);
    const name = pageMap[p.pageId]?.name || "";
    return `<div class="star-card">
      <div class="who"><span class="grp-badge" style="background:${groupBgs[grp]};color:${groupColors[grp]}">${grp} 組</span>${name} · ${p.date}</div>
      <div class="metrics"><span>${p.likes || 0} <small>讚</small></span><span>${p.comments || 0} <small>留言</small></span><span>${p.shares || 0} <small>分享</small></span><strong>${eng(p)} <small>互動</small></strong></div>
      ${(p.tags || []).map((t) => `<span class="tag-chip">${t}</span>`).join("")}
      ${p.url ? `<a class="link-btn" href="${p.url}" target="_blank">→ 查看貼文</a>` : ""}
    </div>`;
  }).join("");

  const ml = (m) => { const [y, mo] = m.split("-"); return `${y}年${parseInt(mo)}月`; };

  return `<!DOCTYPE html>

/* ---------------- Reusable line chart with PNG export ---------------- */
const CHART_PALETTE = ["#8A9A8E", "#B08968", "#5C6B73", "#C08081", "#A18A68", "#7B8F77", "#9A8AA6", "#6E8A9A"];

function downloadSvgAsPng(svgEl, filename, title) {
  const serializer = new XMLSerializer();
  const svgString = serializer.serializeToString(svgEl);
  const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  const scale = 2; // export at 2x for sharper image

  const svgW = svgEl.width?.baseVal?.value || svgEl.getBoundingClientRect().width;
  const svgH = svgEl.height?.baseVal?.value || svgEl.getBoundingClientRect().height;

  // Reserve space at the top for the title if provided
  const titleH = title ? 44 : 0;
  const titleFontSize = 14;

  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = svgW * scale;
    canvas.height = (svgH + titleH) * scale;
    const ctx = canvas.getContext("2d");

    // Background
    ctx.fillStyle = "#FBF9F4";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.scale(scale, scale);

    // Draw title
    if (title) {
      ctx.fillStyle = "#3A3A38";
      ctx.font = `600 ${titleFontSize}px 'Noto Sans TC', 'PingFang TC', sans-serif`;
      ctx.fillText(title, 18, 28);
      // Thin separator line
      ctx.strokeStyle = "#E6E1D6";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, titleH - 6);
      ctx.lineTo(svgW, titleH - 6);
      ctx.stroke();
    }

    // Draw chart SVG below title
    ctx.drawImage(img, 0, titleH);
    URL.revokeObjectURL(url);

    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }, "image/png");
  };
  img.src = url;
}

function formatChartNum(v) {
  if (v == null) return "";
  if (v >= 100000) return (v / 10000).toFixed(1) + "萬";
  return v.toLocaleString();

function LineChartCard({ title, months, series, onDownloadName, unit }) {
  const svgRef = useRef(null);
  const maxVal = useMemo(() => {
    let max = 0;
    series.forEach((s) => s.points.forEach((v) => { if (typeof v === "number" && v > max) max = v; }));
    return max || 1;
  }, [series]);

  const leftMargin = 64;
  const width = Math.max(months.length * 100 + leftMargin, 480);
  const height = 300;
  const chartTop = 24;
  const chartBottom = 230;
  const chartH = chartBottom - chartTop;

  const yTicks = [0, 0.25, 0.5, 0.75, 1];

  return (
    <div style={styles.card}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: "#7A7568", fontWeight: 500 }}>{title}{unit ? `（單位：${unit}）` : ""}</div>
        <button
          style={styles.secondaryBtn}
          onClick={() => svgRef.current && downloadSvgAsPng(svgRef.current, onDownloadName, `${title}${unit ? `（單位：${unit}）` : ""}`)}
          disabled={series.length === 0}
        >
          <Icon name="download" size={15} />
          下載圖表
        </button>
      </div>
      {series.length === 0 ? (
        <EmptyState text="請先在上方選擇至少一家粉絲團。" />
      ) : (
        <div style={{ overflowX: "auto" }}>
          <svg ref={svgRef} width={width} height={height} style={{ display: "block", background: "#FBF9F4" }}>
            {yTicks.map((t, i) => {
              const y = chartBottom - t * chartH;
              const val = Math.round(maxVal * t);
              return (
                <g key={i}>
                  <line x1={leftMargin} x2={width} y1={y} y2={y} stroke="#E6E1D6" strokeWidth={1} />
                  <text x={leftMargin - 10} y={y + 4} textAnchor="end" fontSize={11} fill="#9C9684" fontFamily="'Space Grotesk', sans-serif">
                    {formatChartNum(val)}
                  </text>
                </g>
              );
            })}
            {series.map((s) => {
              const points = months.map((m, i) => {
                const v = s.points[i];
                const x = leftMargin + 50 + i * 100;
                const y = typeof v === "number" ? chartBottom - (v / maxVal) * chartH : null;
                return { x, y, v };
              });
              const validPoints = points.filter((p) => p.y != null);
              const path = validPoints.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
              return (
                <g key={s.id}>
                  <path d={path} fill="none" stroke={s.color} strokeWidth={2} />
                  {validPoints.map((p, i) => (
                    <g key={i}>
                      <circle cx={p.x} cy={p.y} r={3.5} fill={s.color} />
                      <text x={p.x} y={p.y - 9} textAnchor="middle" fontSize={10.5} fill={s.color} fontWeight={600} fontFamily="'Space Grotesk', sans-serif">
                        {formatChartNum(p.v)}
                      </text>
                    </g>
                  ))}
                </g>
              );
            })}
            {months.map((m, i) => (
              <text key={m} x={leftMargin + 50 + i * 100} y={chartBottom + 24} textAnchor="middle" fontSize={11} fill="#7A7568" fontFamily="'Space Grotesk', sans-serif">
                {m}
              </text>
            ))}
          </svg>
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 12 }}>
            {series.map((s) => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
                <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, display: "inline-block" }} />
                {s.label}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- Horizontal bar chart (ranking) with PNG export ---------------- */
function BarChartCard({ title, items, onDownloadName, unit, allowNegative }) {
  const svgRef = useRef(null);
  const absMax = Math.max(...items.map((it) => Math.abs(it.value)), 1);

  const leftMargin = 220;
  const rightMargin = allowNegative ? 140 : 100;
  const rowHeight = allowNegative ? 42 : 34;
  const width = 820;
  const height = items.length * rowHeight + 30;
  const barAreaWidth = width - leftMargin - rightMargin;
  // For charts with negative values, zero line sits at the centre of the bar area
  const zeroX = allowNegative ? leftMargin + barAreaWidth / 2 : leftMargin;

  return (
    <div style={styles.card}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: "#7A7568", fontWeight: 500 }}>{title}{unit ? `（單位：${unit}）` : ""}</div>
        <button
          style={styles.secondaryBtn}
          onClick={() => svgRef.current && downloadSvgAsPng(svgRef.current, onDownloadName, `${title}${unit ? `（單位：${unit}）` : ""}`)}
          disabled={items.length === 0}
        >
          <Icon name="download" size={15} />
          下載圖表
        </button>
      </div>
      {items.length === 0 ? (
        <EmptyState text="目前選定範圍內還沒有資料。" />
      ) : (
        <div style={{ overflowX: "auto" }}>
          <svg ref={svgRef} width={width} height={height} style={{ display: "block", background: "#FBF9F4" }}>
            {allowNegative && (
              <line x1={zeroX} x2={zeroX} y1={0} y2={height} stroke="#DDD6C6" strokeWidth={1} strokeDasharray="4 3" />
            )}
            {items.map((it, i) => {
              const y = 12 + i * rowHeight;
              const isNeg = it.value < 0;
              const barW = (Math.abs(it.value) / absMax) * (allowNegative ? barAreaWidth / 2 : barAreaWidth);
              const barX = allowNegative ? (isNeg ? zeroX - barW : zeroX) : leftMargin;
              const color = allowNegative
                ? (isNeg ? "#C08081" : it.value === 0 ? "#D8D2C4" : i === 0 ? "#B08968" : "#8A9A8E")
                : (i === 0 ? "#B08968" : "#8A9A8E");
              const labelX = allowNegative
                ? (isNeg ? zeroX - barW - 6 : zeroX + barW + 6)
                : leftMargin + barW + 8;
              const labelAnchor = allowNegative && isNeg ? "end" : "start";
              const valueStr = allowNegative && it.value > 0 ? `+${formatChartNum(it.value)}` : formatChartNum(it.value);
              return (
                <g key={it.id}>
                  <text x={leftMargin - 12} y={y + rowHeight / 2 - (it.subLabel ? 6 : 0)} textAnchor="end" fontSize={12} fill="#3A3A38">
                    {it.label.length > 16 ? it.label.slice(0, 16) + "…" : it.label}
                  </text>
                  {it.subLabel && (
                    <text x={leftMargin - 12} y={y + rowHeight / 2 + 10} textAnchor="end" fontSize={10} fill="#A6A096">
                      {it.subLabel}
                    </text>
                  )}
                  <rect x={barX} y={y + 6} width={Math.max(barW, 2)} height={rowHeight - 16} rx={4} fill={color} />
                  <text x={labelX} y={y + rowHeight / 2 + 4} textAnchor={labelAnchor} fontSize={12} fill={isNeg ? "#C08081" : "#5C5847"} fontWeight={600} fontFamily="'Space Grotesk', sans-serif">
                    {valueStr}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      )}
    </div>
  );
}

function TrendView({ pages, fanRecords, posts, groupRecords, events }) {
  const allMonths = useMemo(() => {
    const set = new Set(posts.map((p) => p.month));
    Object.values(fanRecords).forEach((entries) => {
      (entries || []).forEach((e) => set.add((e.date || "").slice(0, 7)));
    });
    set.delete("");
    return [...set].sort();
  }, [fanRecords, posts]);

  const [rangeStart, setRangeStart] = useState("");
  const [rangeEnd, setRangeEnd] = useState("");

  useEffect(() => {
    if (allMonths.length > 0) {
      if (!rangeStart) setRangeStart(allMonths[0]);
      if (!rangeEnd) setRangeEnd(allMonths[allMonths.length - 1]);
    }
  }, [allMonths]);

  const months = useMemo(() => {
    if (!rangeStart || !rangeEnd) return allMonths;
    return allMonths.filter((m) => m >= rangeStart && m <= rangeEnd);
  }, [allMonths, rangeStart, rangeEnd]);

  const [selectedIds, setSelectedIds] = useState(() => pages.slice(0, 5).map((p) => p.id));
  const [postMetric, setPostMetric] = useState("views");
  const [pickerQuery, setPickerQuery] = useState("");
  const [activeGroupFilter, setActiveGroupFilter] = useState(""); // "" | "A" | "B" | "C"

  // User explicitly picks which month's group assignments to use for the quick-filter
  // (independent of the chart date range — you may want to compare trends but filter by this month's groups)
  const [groupRefMonth, setGroupRefMonth] = useState(nowMonth);

  // Months that have any group assignments set — used to populate the group-ref-month picker
  const monthsWithGroupData = useMemo(() => {
    const months = Object.keys(groupRecords).filter((m) => {
      const mg = groupRecords[m] || {};
      return Object.values(mg).some((g) => g);
    });
    return months.sort();
  }, [groupRecords]);

  // IDs of pages belonging to a given group in the reference month
  const pageIdsInGroup = useCallback((group) => {
    if (!group || !groupRefMonth) return pages.map((p) => p.id);
    const monthGroups = groupRecords[groupRefMonth] || {};
    return pages.filter((p) => monthGroups[p.id] === group).map((p) => p.id);
  }, [pages, groupRecords, groupRefMonth]);

  // Whether any group assignments exist for the reference month
  const hasGroupData = useMemo(() => {
    if (!groupRefMonth) return false;
    const mg = groupRecords[groupRefMonth] || {};
    return Object.values(mg).some((g) => g);
  }, [groupRecords, groupRefMonth]);

  // Group counts for the reference month
  const groupCounts = useMemo(() => {
    const mg = groupRecords[groupRefMonth] || {};
    const counts = { A: 0, B: 0, C: 0 };
    Object.values(mg).forEach((g) => { if (counts[g] !== undefined) counts[g]++; });
    return counts;
  }, [groupRecords, groupRefMonth]);

  const applyGroupFilter = (group) => {
    setActiveGroupFilter(group);
    if (!group) return; // keep current selection when clearing filter
    setSelectedIds(pageIdsInGroup(group));
  };

  useEffect(() => {
    setSelectedIds((ids) => ids.filter((id) => pages.some((p) => p.id === id)));
  }, [pages]);

  const toggle = (id) => {
    setSelectedIds((ids) => (ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id]));
  };

  const filteredPageOptions = useMemo(() => {
    const q = pickerQuery.trim();
    if (!q) return pages;
    return pages.filter((p) => p.name.includes(q) || (p.category || "").includes(q) || (p.region || "").includes(q));
  }, [pages, pickerQuery]);

  const fanValueFor = useCallback((pageId, m) => {
    const entry = latestInMonth(fanRecords, pageId, m);
    return entry ? entry.count : null;
  }, [fanRecords]);

  const fanSeries = useMemo(() => {
    return selectedIds.map((id, i) => {
      const page = pages.find((p) => p.id === id);
      return {
        id,
        label: page?.name || "（已移除）",
        color: CHART_PALETTE[i % CHART_PALETTE.length],
        points: months.map((m) => fanValueFor(id, m)),
      };
    });
  }, [selectedIds, pages, months, fanValueFor]);

  // sum of the selected metric, per page per month, within the selected date range
  const postSeries = useMemo(() => {
    return selectedIds.map((id, i) => {
      const page = pages.find((p) => p.id === id);
      return {
        id,
        label: page?.name || "（已移除）",
        color: CHART_PALETTE[i % CHART_PALETTE.length],
        points: months.map((m) => {
          const relevant = posts.filter((p) => p.pageId === id && p.month === m);
          if (relevant.length === 0) return null;
          if (postMetric === "postCount") return relevant.length;
          if (postMetric === "engagement") return relevant.reduce((sum, p) => sum + engagement(p), 0);
          return relevant.reduce((sum, p) => sum + (Number(p[postMetric]) || 0), 0);
        }),
      };
    });
  }, [selectedIds, pages, months, posts, postMetric]);

  // When the selected range covers exactly one month, show a per-dealer bar chart instead of a line chart
  // (a trend line across a single point isn't meaningful — a ranking bar chart is more useful).
  const singleMonth = months.length === 1;

  const fanBarItems = useMemo(() => {
    if (!singleMonth) return [];
    return fanSeries
      .filter((s) => typeof s.points[0] === "number")
      .map((s) => ({ id: s.id, label: s.label, value: s.points[0] }))
      .sort((a, b) => b.value - a.value);
  }, [fanSeries, singleMonth]);

  const postBarItems = useMemo(() => {
    if (!singleMonth) return [];
    return postSeries
      .filter((s) => typeof s.points[0] === "number")
      .map((s) => ({ id: s.id, label: s.label, value: s.points[0] }))
      .sort((a, b) => b.value - a.value);
  }, [postSeries, singleMonth]);

  //粉絲成長數圖表：選定區間內，每家粉絲團「最新一筆 - 最舊一筆」的淨增長
  // 適用於單月（7/1-7/31）或跨月（6/1-7/31）兩種情況
  const fanGrowthItems = useMemo(() => {
    if (months.length === 0 || !rangeStart || !rangeEnd) return [];
    const rangeStartDate = `${rangeStart}-01`;
    // rangeEnd last day: just compare by YYYY-MM prefix
    return selectedIds.map((id) => {
      const page = pages.find((p) => p.id === id);
      // All entries within the selected month range
      const allEntries = (fanRecords[id] || [])
        .filter((e) => {
          const m = (e.date || "").slice(0, 7);
          return m >= rangeStart && m <= rangeEnd;
        })
        .sort((a, b) => (a.date || "").localeCompare(b.date || "") || ((a.createdAt || 0) - (b.createdAt || 0)));
      if (allEntries.length < 1) return null;
      const oldest = allEntries[0].count;
      const newest = allEntries[allEntries.length - 1].count;
      const growth = newest - oldest;
      return {
        id,
        label: page?.name || "（已移除）",
        value: growth,
        oldest,
        newest,
      };
    })
      .filter((x) => x !== null)
      .sort((a, b) => b.value - a.value);
  }, [selectedIds, pages, fanRecords, months, rangeStart, rangeEnd]);

  // Top 10 most-engaged posts for the range's end month (mirrors 月報表's monthly TOP10), across all pages
  const topEngagedMonth = rangeEnd || (allMonths.length ? allMonths[allMonths.length - 1] : "");
  const top10Engaged = useMemo(() => {
    const pageMap = {};
    pages.forEach((p) => (pageMap[p.id] = p));
    return posts
      .filter((p) => p.month === topEngagedMonth)
      .map((p) => ({
        id: p.id,
        label: `${pageMap[p.pageId]?.name || "（已移除）"} · ${p.date?.slice(5) || ""}`,
        value: engagement(p),
      }))
      .sort((a, b) => b.value - a.value)
      .slice(0, 10);
  }, [posts, pages, topEngagedMonth]);

  return (
    <div style={styles.viewWrap}>
      <Header title="趨勢總覽" subtitle="跨月份比較粉絲人數與貼文數據變化" />

      {pages.length === 0 ? (
        <div style={styles.card}><EmptyState text="尚無粉絲團，請先新增。" /></div>
      ) : allMonths.length === 0 ? (
        <div style={styles.card}><EmptyState text="尚無任何月份的資料，先到「本月輸入」記錄看看。" /></div>
      ) : (
        <>
          <div style={styles.card}>
            <div className="fbm-form-grid" style={{ ...styles.formGrid, gridTemplateColumns: "1fr 1fr 2fr" }}>
              <Field label="起始月份">
                <select style={styles.input} value={rangeStart} onChange={(e) => setRangeStart(e.target.value)}>
                  {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
                </select>
              </Field>
              <Field label="結束月份">
                <select style={styles.input} value={rangeEnd} onChange={(e) => setRangeEnd(e.target.value)}>
                  {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
                </select>
              </Field>
              <div style={{ display: "flex", alignItems: "flex-end" }}>
                <div style={{ fontSize: 12.5, color: "#9C9684" }}>
                  目前顯示範圍：{months.length > 0 ? `${monthLabel(months[0])} ～ ${monthLabel(months[months.length - 1])}（共 ${months.length} 個月）` : "無資料"}
                </div>
              </div>
            </div>
          </div>

          <div style={styles.card}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 10 }}>
              <div style={{ fontSize: 13, color: "#7A7568" }}>
                選擇要比較的粉絲團（可複選，已選 {selectedIds.length} / {pages.length} 家）
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={styles.secondaryBtn} onClick={() => setSelectedIds(filteredPageOptions.map((p) => p.id))}>全選</button>
                <button style={styles.secondaryBtn} onClick={() => setSelectedIds([])}>全取消</button>
              </div>
            </div>

            <div style={{ marginBottom: 14, padding: "12px 14px", background: "#F3F0EA", borderRadius: 10 }}>
              <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: hasGroupData ? 10 : 0 }}>
                <div style={{ ...styles.filterLabel, marginBottom: 0 }}>依競賽組別快速選取</div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ fontSize: 12, color: "#9C9684" }}>參考月份：</span>
                  {monthsWithGroupData.length > 0 ? (
                    <select
                      style={{ ...styles.input, padding: "4px 8px", fontSize: 12.5, width: "auto" }}
                      value={groupRefMonth}
                      onChange={(e) => { setGroupRefMonth(e.target.value); setActiveGroupFilter(""); }}
                    >
                      {monthsWithGroupData.map((m) => (
                        <option key={m} value={m}>{monthLabel(m)}</option>
                      ))}
                      {!monthsWithGroupData.includes(groupRefMonth) && (
                        <option value={groupRefMonth}>{monthLabel(groupRefMonth)}（尚未設定）</option>
                      )}
                    </select>
                  ) : (
                    <span style={{ fontSize: 12, color: "#A6A096" }}>尚無分組資料</span>
                  )}
                </div>
              </div>

              {hasGroupData ? (
                <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
                  {["A", "B", "C"].map((g) => {
                    const count = groupCounts[g];
                    return (
                      <button
                        key={g}
                        style={{
                          ...styles.chipBtn,
                          ...(activeGroupFilter === g ? { background: "#5C6B73", color: "#fff", borderColor: "transparent" } : {}),
                          ...(count === 0 ? { opacity: 0.4, cursor: "default" } : {}),
                        }}
                        onClick={() => count > 0 && applyGroupFilter(activeGroupFilter === g ? "" : g)}
                        title={count === 0 ? `${g}組在 ${monthLabel(groupRefMonth)} 無成員` : `選取${g}組（${count}家）`}
                      >
                        {g} 組（{count}）
                      </button>
                    );
                  })}
                  {activeGroupFilter && (
                    <button
                      style={{ ...styles.chipBtn, color: "#C08081", borderColor: "#C08081" }}
                      onClick={() => setActiveGroupFilter("")}
                    >
                      清除篩選
                    </button>
                  )}
                </div>
              ) : (
                <div style={{ fontSize: 12, color: "#A6A096", lineHeight: 1.6 }}>
                  所選月份尚未設定競賽分組——請到「粉絲團清單」→「競賽分組設定」，選好月份後在每家旁邊設定 A/B/C 組。
                </div>
              )}
            </div>

            <input
              style={{ ...styles.input, marginBottom: 10 }}
              placeholder="搜尋粉絲團名稱、法人或地區，篩選下方清單…"
              value={pickerQuery}
              onChange={(e) => setPickerQuery(e.target.value)}
            />
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", maxHeight: 220, overflowY: "auto" }}>
              {filteredPageOptions.length === 0 ? (
                <div style={{ fontSize: 12.5, color: "#A6A096" }}>沒有符合搜尋條件的粉絲團</div>
              ) : (
                filteredPageOptions.map((p) => {
                  const active = selectedIds.includes(p.id);
                  const idx = selectedIds.indexOf(p.id);
                  const group = groupRecords[groupRefMonth]?.[p.id];
                  return (
                    <button
                      key={p.id}
                      onClick={() => { toggle(p.id); setActiveGroupFilter(""); }}
                      style={{
                        ...styles.chipBtn,
                        ...(active ? { background: CHART_PALETTE[idx % CHART_PALETTE.length], color: "#fff", borderColor: "transparent" } : {}),
                      }}
                    >
                      {p.name}{group ? ` · ${group}` : ""}
                    </button>
                  );
                })
              )}
            </div>
          </div>

          {singleMonth ? (
            <BarChartCard
              title={`粉絲人數（${months[0] ? monthLabel(months[0]) : "—"}，依粉絲團排名）`}
              items={fanBarItems}
              onDownloadName={`粉絲人數_${months[0]}.png`}
              unit="人"
            />
          ) : (
            <LineChartCard
              title="粉絲人數趨勢（每月取最新一筆量測值）"
              months={months}
              series={fanSeries}
              onDownloadName={`粉絲人數趨勢_${rangeStart}_${rangeEnd}.png`}
              unit="人"
            />
          )}

          <BarChartCard
            title={`粉絲成長數排名（${rangeStart === rangeEnd ? monthLabel(rangeStart) : `${monthLabel(rangeStart)} ～ ${monthLabel(rangeEnd)}`}，區間最新 − 最舊）`}
            items={fanGrowthItems.map((it) => ({
              ...it,
              subLabel: it.oldest != null && it.newest != null
                ? `${it.oldest.toLocaleString()} → ${it.newest.toLocaleString()} 人`
                : "",
            }))}
            onDownloadName={`粉絲成長數_${rangeStart}_${rangeEnd}.png`}
            unit="人"
            allowNegative
          />

          <div style={styles.card}>
            <div style={styles.filterLabel}>貼文數據指標</div>
            <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
              {POST_METRICS.map((m) => (
                <button
                  key={m.value}
                  style={{ ...styles.chipBtn, ...(postMetric === m.value ? styles.chipBtnActive : {}) }}
                  onClick={() => setPostMetric(m.value)}
                >
                  {m.label}
                </button>
              ))}
            </div>
          </div>

          {singleMonth ? (
            <BarChartCard
              title={`貼文${POST_METRICS.find((m) => m.value === postMetric)?.label}（${months[0] ? monthLabel(months[0]) : "—"}，依粉絲團排名）`}
              items={postBarItems}
              onDownloadName={`貼文${POST_METRICS.find((m) => m.value === postMetric)?.label}_${months[0]}.png`}
              unit={POST_METRICS.find((m) => m.value === postMetric)?.unit}
            />
          ) : (
            <LineChartCard
              title={`貼文${POST_METRICS.find((m) => m.value === postMetric)?.label}趨勢（每月總和，所選粉絲團）`}
              months={months}
              series={postSeries}
              onDownloadName={`貼文${POST_METRICS.find((m) => m.value === postMetric)?.label}趨勢_${rangeStart}_${rangeEnd}.png`}
              unit={POST_METRICS.find((m) => m.value === postMetric)?.unit}
            />
          )}

          <BarChartCard
            title={`本月最高互動貼文 TOP 10（${topEngagedMonth ? monthLabel(topEngagedMonth) : "—"}，所有粉絲團，讚+留言+分享）`}
            items={top10Engaged}
            onDownloadName={`最高互動貼文TOP10_${topEngagedMonth}.png`}
            unit="互動數"
          />

          <SourceTypeChartSection pages={pages} posts={posts} allMonths={allMonths} />
          <ContentDistChartSection pages={pages} posts={posts} allMonths={allMonths} />
          <PostDetailChartSection pages={pages} posts={posts} allMonths={allMonths} events={events} />
        </>
      )}
    </div>
  );
}

/* ---------------- Content distribution stacked bar chart (per page, per month) ---------------- */
const SOURCE_COLORS = {
  "自製": "#7B8F77",
  "轉發": "#B08968",
  "AI":   "#9A8AA6",
};

function SourceTypeChartSection({ pages, posts, allMonths }) {
  const [distMonth, setDistMonth] = useState(allMonths[allMonths.length - 1] || "");
  const svgRef = useRef(null);

  useEffect(() => {
    if (!distMonth && allMonths.length) setDistMonth(allMonths[allMonths.length - 1]);
  }, [allMonths, distMonth]);

  const distData = useMemo(() => {
    const monthPosts = posts.filter((p) => p.month === distMonth);
    return pages.map((page) => {
      const pagePosts = monthPosts.filter((p) => p.pageId === page.id);
      if (pagePosts.length === 0) return null;
      const counts = { "自製": 0, "轉發": 0, "AI": 0 };
      pagePosts.forEach((p) => {
        const src = p.source || "original";
        if (src === "original") counts["自製"]++;
        else if (src === "repost") counts["轉發"]++;
        else if (src === "ai") counts["AI"]++;
        else counts["自製"]++;
      });
      return { page, total: pagePosts.length, counts };
    }).filter(Boolean).sort((a, b) => b.total - a.total);
  }, [pages, posts, distMonth]);

  const sources = ["自製", "轉發", "AI"];
  const leftMargin = 210;
  const rightMargin = 60;
  const rowH = 36;
  const width = 820;
  const barAreaW = width - leftMargin - rightMargin;
  const maxTotal = Math.max(...distData.map((r) => r.total), 1);
  const svgH = distData.length * rowH + 40;
  const title = `貼文類型分佈（${distMonth ? monthLabel(distMonth) : "—"}，自製／轉發／AI）`;

  return (
    <>
      <SectionTitle icon="users" title="貼文類型分佈（自製／轉發／AI）" />
      <div style={styles.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 13, color: "#7A7568" }}>月份：</span>
            <select style={{ ...styles.input, width: "auto" }} value={distMonth} onChange={(e) => setDistMonth(e.target.value)}>
              {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
            </select>
          </div>
          <button style={styles.secondaryBtn} onClick={() => svgRef.current && downloadSvgAsPng(svgRef.current, `貼文類型分佈_${distMonth}.png`, title)} disabled={distData.length === 0}>
            <Icon name="download" size={15} /> 下載圖表
          </button>
        </div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
          {sources.map((s) => (
            <div key={s} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: "#5C5847" }}>
              <span style={{ width: 12, height: 12, borderRadius: 3, background: SOURCE_COLORS[s], display: "inline-block", flexShrink: 0 }} />
              {s}
            </div>
          ))}
        </div>
        {distData.length === 0 ? (
          <EmptyState text="這個月份尚無貼文紀錄。" />
        ) : (
          <div style={{ overflowX: "auto" }}>
            <svg ref={svgRef} width={width} height={svgH} style={{ display: "block", background: "#FBF9F4" }}>
              {[0, 0.25, 0.5, 0.75, 1].map((pct) => {
                const x = leftMargin + pct * barAreaW;
                const val = Math.round(pct * maxTotal);
                return (
                  <g key={pct}>
                    <line x1={x} x2={x} y1={0} y2={svgH - 20} stroke="#E6E1D6" strokeWidth={1} />
                    <text x={x} y={svgH - 6} textAnchor="middle" fontSize={10} fill="#A6A096">{val}</text>
                  </g>
                );
              })}
              {distData.map((r, i) => {
                const y = 10 + i * rowH;
                let xCursor = leftMargin;
                const segments = sources.map((s) => ({ s, count: r.counts[s] || 0, w: ((r.counts[s] || 0) / maxTotal) * barAreaW })).filter((seg) => seg.count > 0);
                return (
                  <g key={r.page.id}>
                    <text x={leftMargin - 10} y={y + rowH / 2 + 4} textAnchor="end" fontSize={12} fill="#3A3A38">
                      {r.page.name.length > 16 ? r.page.name.slice(0, 16) + "…" : r.page.name}
                    </text>
                    {segments.map((seg) => {
                      const rx = xCursor;
                      xCursor += seg.w;
                      return (
                        <g key={seg.s}>
                          <rect x={rx} y={y + 6} width={Math.max(seg.w, 1)} height={rowH - 14} fill={SOURCE_COLORS[seg.s]} />
                          {seg.w > 22 && (
                            <text x={rx + seg.w / 2} y={y + rowH / 2 + 4} textAnchor="middle" fontSize={10} fill="#fff" fontWeight={600}>{seg.count}</text>
                          )}
                        </g>
                      );
                    })}
                    <text x={xCursor + 6} y={y + rowH / 2 + 4} fontSize={11} fill="#7A7568" fontFamily="'Space Grotesk', sans-serif">{r.total}篇</text>
                  </g>
                );
              })}
            </svg>
          </div>
        )}
      </div>
    </>
  );
}

        </div>

        {/* Legend */}
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
          {allTags.map((tag) => (
            <div key={tag} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: "#5C5847" }}>
