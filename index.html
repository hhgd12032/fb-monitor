/* ---------------- Single-page single-month post detail chart (date-level) ---------------- */
function PostDetailChartSection({ pages, posts, allMonths, events }) {
  const [detailPageId, setDetailPageId] = useState(pages[0]?.id || "");
  const [showEvents, setShowEvents] = useState(true);
  const [hiddenEventIds, setHiddenEventIds] = useState([]);
  const [detailMonth, setDetailMonth] = useState(allMonths[allMonths.length - 1] || "");
  const [detailMetric, setDetailMetric] = useState("engagement");
  const svgRef = useRef(null);

  useEffect(() => {
    if (!detailPageId && pages.length) setDetailPageId(pages[0].id);
  }, [pages, detailPageId]);

  useEffect(() => {
    if (!detailMonth && allMonths.length) setDetailMonth(allMonths[allMonths.length - 1]);
  }, [allMonths, detailMonth]);

  const detailPosts = useMemo(() => {
    return posts
      .filter((p) => p.pageId === detailPageId && p.month === detailMonth)
      .sort((a, b) => (a.date || "").localeCompare(b.date || "") || ((a.createdAt || 0) - (b.createdAt || 0)));
  }, [posts, detailPageId, detailMonth]);

  const detailPage = pages.find((p) => p.id === detailPageId);
  const metricInfo = POST_METRICS.find((m) => m.value === detailMetric) || POST_METRICS[1];

  const monthEvents = useMemo(() => eventsInMonths(events, detailMonth ? [detailMonth] : []), [events, detailMonth]);
  const visibleEvents = showEvents ? monthEvents.filter((e) => !hiddenEventIds.includes(e.id)) : [];
  const eventFor = (p) => visibleEvents.find((e) => p.date >= e.start && p.date <= eventEnd(e));

  const leftMargin = 64;
  const pointGap = 110;
  const width = Math.max(detailPosts.length * pointGap + leftMargin + 60, 480);
  const eventBand = visibleEvents.length ? 22 * Math.min(visibleEvents.length, 3) + 8 : 0;
  const height = 320 + eventBand;
  const chartTop = 24 + eventBand;
  const chartBottom = 240 + eventBand;
  const chartH = chartBottom - chartTop;

  const values = detailPosts.map((p) => {
    if (detailMetric === "postCount") return 1;
    if (detailMetric === "engagement") return engagement(p);
    return Number(p[detailMetric]) || 0;
  });
  const maxVal = Math.max(...values, 1);
  const yTicks = [0, 0.25, 0.5, 0.75, 1];

  // Map each visible event onto the per-post x axis (posts are evenly spaced, sorted by date)
  const xs = detailPosts.map((_, i) => leftMargin + 55 + i * pointGap);
  const eventShapes = visibleEvents.map((e, k) => {
    const idx = detailPosts.map((p, i) => (p.date >= e.start && p.date <= eventEnd(e) ? i : -1)).filter((i) => i >= 0);
    const t = eventType(e.type);
    const labelY = 16 + (k % 3) * 22;
    if (idx.length) {
      const x1 = xs[idx[0]] - pointGap / 2 + 6, x2 = xs[idx[idx.length - 1]] + pointGap / 2 - 6;
      return { e, t, band: true, x1, x2, labelY, count: idx.length };
    }
    let ins = detailPosts.findIndex((p) => p.date > eventEnd(e));
    if (ins < 0) ins = detailPosts.length;
    const x = ins === 0 ? leftMargin + 14 : ins === detailPosts.length ? (xs[ins - 1] || leftMargin) + pointGap / 2 : (xs[ins - 1] + xs[ins]) / 2;
    return { e, t, band: false, x1: x, x2: x, labelY, count: 0 };
  });

  // In-event vs outside comparison for the selected metric
  const cmp = (() => {
    if (!visibleEvents.length || !detailPosts.length) return null;
    const inV = [], outV = [];
    detailPosts.forEach((p, i) => (eventFor(p) ? inV : outV).push(values[i]));
    const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
    return { inN: inV.length, outN: outV.length, inAvg: avg(inV), outAvg: avg(outV) };
  })();

  return (
    <>
      <SectionTitle icon="spark" title="單月貼文明細（依日期排列，每篇貼文獨立顯示）" />
      <div style={styles.card}>
        <div className="fbm-form-grid" style={{ ...styles.formGrid, gridTemplateColumns: "1fr 1fr 2fr" }}>
          <Field label="粉絲團">
            <select style={styles.input} value={detailPageId} onChange={(e) => setDetailPageId(e.target.value)}>
              {pages.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label="月份">
            <select style={styles.input} value={detailMonth} onChange={(e) => setDetailMonth(e.target.value)}>
              {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
            </select>
          </Field>
          <Field label="指標">
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {POST_METRICS.filter((m) => m.value !== "postCount").map((m) => (
                <button
                  key={m.value}
                  style={{ ...styles.chipBtn, ...(detailMetric === m.value ? styles.chipBtnActive : {}), padding: "5px 11px", fontSize: 12 }}
                  onClick={() => setDetailMetric(m.value)}
                >
                  {m.label}
                </button>
              ))}
            </div>
          </Field>
        </div>
        <div style={{ borderTop: "1px solid #E6E1D6", marginTop: 14, paddingTop: 12, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <label style={{ display: "inline-flex", alignItems: "center", gap: 7, fontSize: 13, color: "#5C5847", cursor: "pointer", marginRight: 4 }}>
            <input type="checkbox" checked={showEvents} onChange={(e) => setShowEvents(e.target.checked)} style={{ accentColor: "#8A9A8E" }} />
            <Icon name="calendar" size={15} />顯示官方活動
          </label>
          {monthEvents.length === 0 ? (
            <span style={{ fontSize: 12.5, color: "#A6A096" }}>這個月沒有官方活動紀錄（可在「本月輸入 → 官方活動」新增）</span>
          ) : showEvents ? (
            <>
              {monthEvents.map((e) => (
                <EventChip key={e.id} e={e} muted={hiddenEventIds.includes(e.id)}
                  onClick={() => setHiddenEventIds((ids) => (ids.includes(e.id) ? ids.filter((x) => x !== e.id) : [...ids, e.id]))} />
              ))}
              <span style={{ fontSize: 11.5, color: "#A6A096" }}>點活動可單獨隱藏／顯示</span>
            </>
          ) : <span style={{ fontSize: 12.5, color: "#A6A096" }}>已隱藏 {monthEvents.length} 項活動</span>}
        </div>
      </div>

      <div style={styles.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontSize: 13, color: "#7A7568", fontWeight: 500 }}>
            {detailPage?.name || "—"} · {detailMonth ? monthLabel(detailMonth) : "—"} · {metricInfo.label}
            （單位：{metricInfo.unit}，共 {detailPosts.length} 篇貼文）
          </div>
          <button
            style={styles.secondaryBtn}
            onClick={() => svgRef.current && downloadSvgAsPng(
              svgRef.current,
              `${detailPage?.name || "粉絲團"}_${detailMonth}_${metricInfo.label}明細.png`,
              `${detailPage?.name || "—"} · ${detailMonth ? monthLabel(detailMonth) : "—"} · ${metricInfo.label}（${metricInfo.unit}）`
            )}
            disabled={detailPosts.length === 0}
          >
            <Icon name="download" size={15} />
            下載圖表
          </button>
        </div>

        {detailPosts.length === 0 ? (
          <EmptyState text="這個粉絲團在所選月份還沒有貼文紀錄。" />
        ) : (
          <div style={{ overflowX: "auto" }}>
            <svg ref={svgRef} width={width} height={height} style={{ display: "block", background: "#FBF9F4" }}>
              {eventShapes.map(({ e, t, band, x1, x2, labelY }) => (
                <g key={e.id}>
                  <title>{`${e.title}｜${t.label}｜${eventRangeLabel(e)}${e.note ? "｜" + e.note : ""}`}</title>
                  {band
                    ? <rect x={x1} y={chartTop - 6} width={Math.max(x2 - x1, 4)} height={chartBottom - chartTop + 6} fill={t.color} opacity={0.1} rx={4} />
                    : <line x1={x1} x2={x1} y1={chartTop - 6} y2={chartBottom} stroke={t.color} strokeWidth={1.5} strokeDasharray="4 4" />}
                  <line x1={x1} x2={x1} y1={labelY + 6} y2={chartTop - 6} stroke={t.color} strokeWidth={1} opacity={0.6} />
                  {(() => {
                    const name = e.title.length > 14 ? e.title.slice(0, 14) + "…" : e.title;
                    const range = eventRangeLabel(e);
                    const w = name.length * 11.5 + range.length * 6.6 + 18;
                    const lx = Math.max(Math.min(x1, width - w - 4), 4);
                    return (
                      <>
                        <rect x={lx} y={labelY - 8} width={w} height={18} rx={4} fill={t.color} />
                        <text x={lx + 6} y={labelY + 5} fontSize={11} fill="#fff" fontWeight={500}>{name} {range}</text>
                      </>
                    );
                  })()}
                </g>
              ))}
              {yTicks.map((t, i) => {
                const y = chartBottom - t * chartH;
                const val = Math.round(maxVal * t);
                return (
                  <g key={i}>
                    <line x1={leftMargin} x2={width} y1={y} y2={y} stroke="#E6E1D6" strokeWidth={1} />
                    <text x={leftMargin - 10} y={y + 4} textAnchor="end" fontSize={11} fill="#9C9684" fontFamily="'Space Grotesk', sans-serif">
                      {formatChartNum(val)}
                    </text>
                  </g>
                );
              })}
              {(() => {
                const points = detailPosts.map((p, i) => {
                  const v = values[i];
                  const x = leftMargin + 55 + i * pointGap;
                  const y = chartBottom - (v / maxVal) * chartH;
                  return { x, y, v, post: p };
                });
                const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
                return (
                  <g>
                    <path d={path} fill="none" stroke="#8A9A8E" strokeWidth={2} />
                    {points.map((p, i) => (
                      <g key={i}>
                        {eventFor(p.post) && <circle cx={p.x} cy={p.y} r={8} fill="none" stroke={eventType(eventFor(p.post).type).color} strokeWidth={2} />}
                        <circle cx={p.x} cy={p.y} r={4.5} fill="#8A9A8E" />
                        <text x={p.x} y={p.y - 12} textAnchor="middle" fontSize={11} fill="#5C6B73" fontWeight={600} fontFamily="'Space Grotesk', sans-serif">
                          {formatChartNum(p.v)}
                        </text>
                        <text x={p.x} y={chartBottom + 22} textAnchor="middle" fontSize={11} fill="#7A7568" fontFamily="'Space Grotesk', sans-serif">
                          {p.post.date?.slice(5)}
                        </text>
                        <text x={p.x} y={chartBottom + 38} textAnchor="middle" fontSize={10} fill="#A6A096">
                          {formatLabel(formatOf(p.post))}
                        </text>
                      </g>
                    ))}
                  </g>
                );
              })()}
            </svg>
            <div style={styles.hint}>X軸為貼文發布日期（月-日），每個點代表一篇獨立貼文；同一天若有多篇貼文，會依序並排顯示。</div>
            {cmp && (
              <div style={{ display: "flex", gap: 12, marginTop: 14, flexWrap: "wrap" }}>
                {[["活動期間貼文", cmp.inN, cmp.inAvg, "#B87420"], ["非活動期間貼文", cmp.outN, cmp.outAvg, "#8A9A8E"]].map(([l, n, v, c]) => (
                  <div key={l} style={{ flex: "1 1 200px", background: "#F7F4EE", borderRadius: 12, padding: "12px 16px", borderLeft: `4px solid ${c}` }}>
                    <div style={{ fontSize: 12, color: "#9C9684" }}>{l}（{n} 篇）· 平均{metricInfo.label}</div>
                    <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 24, fontWeight: 600, color: "#33312C" }}>{v == null ? "—" : fmtNum(v, 1)}</div>
                  </div>
                ))}
                {cmp.inAvg != null && cmp.outAvg > 0 && (
                  <div style={{ flex: "1 1 200px", alignSelf: "center", fontSize: 13, color: "#5C5847", lineHeight: 1.6 }}>
                    活動期間平均是非活動期間的 <b style={{ fontFamily: "'Space Grotesk', sans-serif" }}>{(cmp.inAvg / cmp.outAvg).toFixed(1)} 倍</b>
                    <div style={{ fontSize: 11.5, color: "#A6A096" }}>有色圈的點＝落在活動期間的貼文；篇數少時僅供參考</div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </>
  );
}

/* ============================================================ Shared UI bits ============================================================ */
function Header({ title, subtitle, children }) {
  return (

/* ============================================================ Settings & Backup ============================================================ */
function SettingsView({ pages, fanRecords, posts, groupRecords, events, savePages, saveFanRecords, savePosts, saveGroupRecords, saveEvents, showToast }) {
  const [pendingRestore, setPendingRestore] = useState(null);
  const [restoreError, setRestoreError] = useState("");
  const restoreInputRef = useRef(null);

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify({
      app: "fbmonitor", version: 1, exportedAt: new Date().toISOString(),
      pages, fanRecords, posts, groupRecords, events,
    }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `粉絲團監測站_完整備份_${nowMonth()}_${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("已匯出完整備份");
  };

  const handleRestoreFile = async (file) => {
    setRestoreError("");
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.pages) || typeof data.fanRecords !== "object" || !Array.isArray(data.posts)) {
        setRestoreError("這個檔案的格式不像是本系統的備份檔，請確認檔案是否正確。");
        return;
      }
      setPendingRestore(data);
    } catch (e) {
      setRestoreError("讀取失敗，請確認檔案是有效的 JSON 備份檔。");
    }
  };

  const confirmRestore = () => {
    if (!pendingRestore) return;
    savePages(pendingRestore.pages || []);
    saveFanRecords(pendingRestore.fanRecords || {});
    savePosts(pendingRestore.posts || []);
    saveGroupRecords(pendingRestore.groupRecords || {});
    // older backups have no events field — keep current events instead of wiping them
    if (Array.isArray(pendingRestore.events)) saveEvents(pendingRestore.events);
    showToast("已從備份還原所有資料");
    setPendingRestore(null);
  };

  const stats = useMemo(() => ({
    pages: pages.length,
    posts: posts.length,
    fanEntries: Object.values(fanRecords).reduce((s, arr) => s + (arr || []).length, 0),
    groupMonths: Object.keys(groupRecords).filter((m) => Object.values(groupRecords[m] || {}).some((g) => g)).length,
  }), [pages, posts, fanRecords, groupRecords]);

  return (
    <div style={styles.viewWrap}>
      <Header title="設定與備份" subtitle="管理整個系統的資料備份與還原" />

      {pendingRestore && (
        <ConfirmDialog
          title="確認還原備份"
          message={`這份備份包含 ${(pendingRestore.pages || []).length} 家粉絲團、${(pendingRestore.posts || []).length} 筆貼文紀錄。還原會整批覆蓋目前所有資料，無法復原，請確認。`}
          confirmLabel="確認覆蓋並還原"
          onConfirm={confirmRestore}
          onCancel={() => setPendingRestore(null)}
        />
      )}

      <SectionTitle icon="chart" title="目前資料量" />
      <div style={styles.statRow}>
        <StatCard icon="list" label="追蹤粉絲團" value={stats.pages.toLocaleString()} />
        <StatCard icon="spark" label="貼文紀錄筆數" value={stats.posts.toLocaleString()} />
        <StatCard icon="users" label="粉絲數量測紀錄" value={stats.fanEntries.toLocaleString()} />
        <StatCard icon="trend" label="已設定分組月份" value={`${stats.groupMonths} 個月`} />
        <StatCard icon="calendar" label="官方活動紀錄" value={`${(events || []).length} 筆`} />
      </div>

      <SectionTitle icon="save" title="完整資料備份" />
      <div style={styles.card}>
        <p style={{ fontSize: 13.5, color: "#7A7568", lineHeight: 1.7, marginTop: 0 }}>
          「匯出完整備份」會把所有粉絲團清單、貼文紀錄、粉絲數量測、競賽分組設定、官方活動打包成一個 JSON 檔案下載。這份備份可以在任何裝置上用「從備份還原」功能完整還原，也適合在 Firebase 出現問題時作為緊急備援。
        </p>
        <p style={{ fontSize: 13, color: "#A6A096", lineHeight: 1.6, marginBottom: 20 }}>
          建議每個月月底輸入完資料後匯出一次，存到 Google Drive 或其他地方保存。
        </p>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <button style={styles.primaryBtn} onClick={exportBackup}>
            <Icon name="download" size={16} />
            匯出完整備份（JSON）
          </button>
          <button style={styles.secondaryBtn} onClick={() => restoreInputRef.current?.click()}>
            <Icon name="trend" size={16} />
            從備份還原
          </button>
          <button style={styles.secondaryBtn} onClick={() => {
            // Re-assign createdAt in ascending order based on current createdAt sort
            // This permanently fixes the order for all existing posts
            const now = Date.now();
            const sorted = [...posts].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
            const fixed = sorted.map((p, i) => ({ ...p, createdAt: p.createdAt && p.createdAt > 1000000 ? p.createdAt : i + 1 }));
            savePosts(fixed);
            showToast("已修復貼文順序，請重新整理頁面");
          }}>
            <Icon name="spark" size={16} />
            修復貼文輸入順序（一次性）
          </button>
          <input ref={restoreInputRef} type="file" accept=".json" style={{ display: "none" }}
            onChange={(e) => e.target.files?.[0] && handleRestoreFile(e.target.files[0])} />
        </div>
        {restoreError && <div style={{ ...styles.errorBox, marginTop: 14 }}>{restoreError}</div>}
      </div>

      <SectionTitle icon="link" title="系統資訊" />
      <div style={styles.card}>
        <table style={{ ...styles.table, fontSize: 13.5 }}>
          <tbody>
            {[
              ["資料儲存位置", "Firebase Firestore（雲端）"],
              ["同步方式", "所有人開啟同一個網址即可共用同一份資料"],
              ["瀏覽器相容性", "建議使用 Chrome、Edge、Safari 最新版"],
              ["手機使用", "支援，點選左上角漢堡按鈕開啟選單"],
            ].map(([label, value]) => (
              <tr key={label} style={styles.tr}>
                <td style={{ ...styles.td, color: "#9C9684", width: 160 }}>{label}</td>
                <td style={styles.td}>{value}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

          </button>
        </div>
      </div>
    </div>
  );
}

<script>
  // Manually transform with the CLASSIC JSX runtime (React.createElement calls),
  // because Babel's default "automatic" runtime emits an `import` statement that
  // plain <script> tags (no module system) cannot execute, which silently breaks
  // the whole page (shows as blank with a "Cannot use import statement" console error).
  (function () {
    var source = document.getElementById("app-source").textContent;
    var output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }], "env"],
    }).code;
    var script = document.createElement("script");
    script.text = output;
    document.body.appendChild(script);
  })();
</script>
