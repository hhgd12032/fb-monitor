const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ============================================================
   粉絲團監測站 — 資料模型
   - pages: [{id, name, category, url}]
   - fanRecords: { [pageId]: [{id, date, count}] }   // 每月可多筆，各自綁日期
   - posts: [{id, pageId, url, likes, comments, shares, type, date, month}]
   ============================================================ */

const STORAGE_KEYS = {
  PAGES: "fbmonitor:pages",
  FAN_RECORDS: "fbmonitor:fanrecords",
  POSTS: "fbmonitor:posts",
};

const POST_TYPES = [
  { value: "static", label: "靜態貼文", icon: "image" },
  { value: "video", label: "影片", icon: "video" },
  { value: "reel", label: "Reels", icon: "reel" },
  { value: "other", label: "其他", icon: "dot" },
];

function nowMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function monthLabel(m) {
  const [y, mo] = m.split("-");
  return `${y}年${parseInt(mo)}月`;
}

function shiftMonth(m, delta) {
  const [y, mo] = m.split("-").map(Number);
  const d = new Date(y, mo - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function engagement(p) {
  return (p.likes || 0) + (p.comments || 0) + (p.shares || 0);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// entries belonging to a given "YYYY-MM" month, sorted by date ascending
function entriesInMonth(records, pageId, month) {
  return (records[pageId] || [])
    .filter((r) => (r.date || "").slice(0, 7) === month)
    .sort((a, b) => (a.date || "").localeCompare(b.date || ""));
}

// latest entry for a page within a month (used for month-over-month growth)
function latestInMonth(records, pageId, month) {
  const entries = entriesInMonth(records, pageId, month);
  return entries.length ? entries[entries.length - 1] : null;
}

    case "edit":
      return <svg {...props}><path d="M16.5 3.5a2 2 0 0 1 2.8 2.8L7 18.6 3 20l1.4-4L16.5 3.5z" /></svg>;

    case "search":

    case "crown":
      return <svg {...props}><path d="M3 17l2-8 4 4 3-6 3 6 4-4 2 8z" /><line x1="3" y1="20" x2="21" y2="20" /></svg>;

      return null;

};

/* ---------------- Firebase persistence helpers ---------------- */
async function fbGet(docId) {
  if (window.__fbGet) return window.__fbGet(docId);
  return null;
}
async function fbSet(docId, data) {
  if (window.__fbSet) return window.__fbSet(docId, data);
}

function waitForFb() {
  return new Promise((resolve) => {
    if (window.__fbReady) { resolve(); return; }
    window.addEventListener("fb-ready", resolve, { once: true });
  });
}

function median(arr) {
  if (!arr.length) return 0;
  const sorted = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];
}

function calcQuarterData(pages, posts, fanRecords, months) {
  return pages.map((page) => {
    const monthsData = months.map((m) => {
      const mPosts = posts.filter((p) => p.pageId === page.id && p.month === m && p.type !== "live");
      const engArr = mPosts.map((p) => engagement(p));
      const med = median(engArr);
      const latestFan = latestInMonth(fanRecords, page.id, m);
      return { month: m, medianEng: med, postCount: mPosts.length, fans: latestFan ? latestFan.count : 0 };
    });
    const validMonths = monthsData.filter((d) => d.postCount > 0);
    const avgMedianEng = validMonths.length ? validMonths.reduce((s, d) => s + d.medianEng, 0) / validMonths.length : 0;
    const totalPosts = validMonths.reduce((s, d) => s + d.postCount, 0);
    const latestFans = monthsData.reduce((best, d) => d.fans > 0 ? d.fans : best, 0);
    const firstFans = months.reduce((f, m) => {
      const prevM = shiftMonth(m, -1);
      const prev = latestInMonth(fanRecords, page.id, prevM);
      if (f === null && prev) return prev.count;
      return f;
    }, null);
    const fanGrowth = latestFans > 0 && firstFans !== null ? latestFans - firstFans : null;
    const avgEngRate = latestFans > 0 ? (avgMedianEng / latestFans) * 100 : 0;
    return { page, avgMedianEng, avgEngRate, totalPosts, fanGrowth, latestFans, validMonths: validMonths.length };
  }).filter((d) => d.validMonths > 0);
}

function QuarterSelector({ quarterMode, setQuarterMode, fixedQ, setFixedQ, fixedYear, setFixedYear, customMonths, setCustomMonths }) {
  const currentYear = new Date().getFullYear();
  const years = [currentYear - 1, currentYear, currentYear + 1];
  const quarters = [
    { q: 1, label: "Q1 (1-3月)", months: (y) => [`${y}-01`, `${y}-02`, `${y}-03`] },
    { q: 2, label: "Q2 (4-6月)", months: (y) => [`${y}-04`, `${y}-05`, `${y}-06`] },
    { q: 3, label: "Q3 (7-9月)", months: (y) => [`${y}-07`, `${y}-08`, `${y}-09`] },
    { q: 4, label: "Q4 (10-12月)", months: (y) => [`${y}-10`, `${y}-11`, `${y}-12`] },
  ];
  const allMonths = [];
  for (let y = currentYear - 1; y <= currentYear + 1; y++)
    for (let m = 1; m <= 12; m++) allMonths.push(`${y}-${String(m).padStart(2, "0")}`);

  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", marginBottom: 16 }}>
      <div style={{ display: "flex", gap: 6 }}>
        <button onClick={() => setQuarterMode("fixed")} style={{ padding: "5px 14px", borderRadius: 6, border: "none", background: quarterMode === "fixed" ? "#4A7C59" : "#E8E4DC", color: quarterMode === "fixed" ? "#fff" : "#5C5043", cursor: "pointer", fontFamily: "inherit" }}>固定季度</button>
        <button onClick={() => setQuarterMode("custom")} style={{ padding: "5px 14px", borderRadius: 6, border: "none", background: quarterMode === "custom" ? "#4A7C59" : "#E8E4DC", color: quarterMode === "custom" ? "#fff" : "#5C5043", cursor: "pointer", fontFamily: "inherit" }}>自選月份</button>
      </div>
      {quarterMode === "fixed" && (
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <select value={fixedYear} onChange={(e) => setFixedYear(Number(e.target.value))} style={{ padding: "5px 8px", borderRadius: 6, border: "1px solid #D8D2C4", background: "#fff", fontFamily: "inherit" }}>
            {years.map((y) => <option key={y} value={y}>{y}年</option>)}
          </select>
          {quarters.map(({ q, label }) => (
            <button key={q} onClick={() => setFixedQ(q)} style={{ padding: "5px 12px", borderRadius: 6, border: "none", background: fixedQ === q ? "#B08968" : "#E8E4DC", color: fixedQ === q ? "#fff" : "#5C5043", cursor: "pointer", fontFamily: "inherit" }}>{label}</button>
          ))}
        </div>
      )}
      {quarterMode === "custom" && (
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {[0, 1, 2].map((i) => (
            <select key={i} value={customMonths[i] || ""} onChange={(e) => { const next = [...customMonths]; next[i] = e.target.value; setCustomMonths(next); }} style={{ padding: "5px 8px", borderRadius: 6, border: "1px solid #D8D2C4", background: "#fff", fontFamily: "inherit" }}>
              <option value="">選擇月份</option>
              {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
            </select>
          ))}
        </div>
      )}
    </div>
  );
}

function QuarterReportView({ pages, posts, fanRecords }) {
  const currentYear = new Date().getFullYear();
  const [quarterMode, setQuarterMode] = useState("fixed");
  const [fixedQ, setFixedQ] = useState(Math.ceil((new Date().getMonth() + 1) / 3));
  const [fixedYear, setFixedYear] = useState(currentYear);
  const [customMonths, setCustomMonths] = useState(["", "", ""]);

  const activeMonths = useMemo(() => {
    if (quarterMode === "fixed") {
      const qMap = { 1: ["01","02","03"], 2: ["04","05","06"], 3: ["07","08","09"], 4: ["10","11","12"] };
      return qMap[fixedQ].map((m) => `${fixedYear}-${m}`);
    }
    return customMonths.filter(Boolean);
  }, [quarterMode, fixedQ, fixedYear, customMonths]);

  const quarterData = useMemo(() => calcQuarterData(pages, posts, fanRecords, activeMonths), [pages, posts, fanRecords, activeMonths]);

  const byEng = [...quarterData].sort((a, b) => b.avgMedianEng - a.avgMedianEng);
  const byRate = [...quarterData].sort((a, b) => b.avgEngRate - a.avgEngRate);
  const byGrowth = [...quarterData].filter((d) => d.fanGrowth !== null).sort((a, b) => b.fanGrowth - a.fanGrowth);

  if (activeMonths.length === 0) return <div style={{ color: "#8A9A8E", padding: 24 }}>請先選擇月份</div>;

  const periodLabel = quarterMode === "fixed" ? `${fixedYear} Q${fixedQ}` : activeMonths.map(monthLabel).join("、");
  const medal = ["🥇","🥈","🥉"];

  const RankCard = ({ title, data, valueKey, valueLabel, formatFn }) => (
    <div style={{ background: "#fff", borderRadius: 12, padding: 20, flex: 1, minWidth: 260 }}>
      <div style={{ fontFamily: "'Noto Serif TC'", fontSize: 16, fontWeight: 700, color: "#5C5043", marginBottom: 14 }}>{title}</div>
      {data.slice(0, 5).map((d, i) => (
        <div key={d.page.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: i < 4 ? "1px solid #F3F0EA" : "none" }}>
          <span style={{ fontSize: 18, width: 28 }}>{medal[i] || `${i + 1}`}</span>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 500, color: "#2C2C2C" }}>{d.page.name}</div>
            <div style={{ fontSize: 11, color: "#8A9A8E" }}>{d.validMonths}個月有效資料・{d.totalPosts}篇</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: "#4A7C59" }}>{formatFn(d[valueKey])}</div>
            <div style={{ fontSize: 10, color: "#8A9A8E" }}>{valueLabel}</div>
          </div>
        </div>
      ))}
      {data.length === 0 && <div style={{ color: "#8A9A8E", fontSize: 13 }}>尚無資料</div>}
    </div>
  );

  return (
    <div>
      <div style={{ marginBottom: 20 }}>
        <QuarterSelector quarterMode={quarterMode} setQuarterMode={setQuarterMode} fixedQ={fixedQ} setFixedQ={setFixedQ} fixedYear={fixedYear} setFixedYear={setFixedYear} customMonths={customMonths} setCustomMonths={setCustomMonths} />
        <div style={{ fontSize: 13, color: "#8A9A8E" }}>統計期間：{periodLabel}・{quarterData.length} 個粉絲團有資料</div>
      </div>
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 20 }}>
        <RankCard title="🏆 互動王（篇均互動數）" data={byEng} valueKey="avgMedianEng" valueLabel="篇均中位數互動" formatFn={(v) => Math.round(v).toLocaleString()} />
        <RankCard title="🏆 互動王（篇均互動率）" data={byRate} valueKey="avgEngRate" valueLabel="篇均互動率" formatFn={(v) => v.toFixed(2) + "%"} />
        <RankCard title="🌱 粉絲成長王" data={byGrowth} valueKey="fanGrowth" valueLabel="季度粉絲淨成長" formatFn={(v) => (v >= 0 ? "+" : "") + v.toLocaleString()} />
      </div>
    </div>
  );
}

function App() {
  const [pages, setPages] = useState([]);
  const [fanRecords, setFanRecords] = useState({});
  const [posts, setPosts] = useState([]);
  const [allLoaded, setAllLoaded] = useState(false);

  const [view, setView] = useState("input"); // input | report | trend | pages
  const [month, setMonth] = useState(nowMonth());
  const [toast, setToast] = useState(null);

  // Load from Firebase on mount
  useEffect(() => {
    async function loadData() {
      await waitForFb();
      const [pagesData, fanData, postsData] = await Promise.all([
        fbGet("pages"),
        fbGet("fanRecords"),
        fbGet("posts"),
      ]);
      // Firestore stores Firestore-safe objects only (no bare arrays).
      // Old versions stored: doc "pages" = { pages: [...] }, doc "fanRecords" = { fanRecords: {...} }, doc "posts" = { posts: [...] }
      // New version stores: doc "pages" = { data: [...] } etc.
      // Support all variants.
      function unwrapPages(d) {
        if (!d) return null;
        if (Array.isArray(d.data)) return d.data;       // new format
        if (Array.isArray(d.pages)) return d.pages;     // old format
        return null;
      }
      function unwrapFanRecords(d) {
        if (!d) return null;
        if (d.data && typeof d.data === "object" && !Array.isArray(d.data)) return d.data;
        if (d.fanRecords && typeof d.fanRecords === "object") return d.fanRecords;
        return null;
      }
      function unwrapPosts(d) {
        if (!d) return null;
        if (Array.isArray(d.data)) return d.data;
        if (Array.isArray(d.posts)) return d.posts;
        return null;
      }
      const p = unwrapPages(pagesData);
      const f = unwrapFanRecords(fanData);
      const po = unwrapPosts(postsData);
      if (p) setPages(p);
      if (f) setFanRecords(f);
      if (po) setPosts(po);
      setAllLoaded(true);
    }
    loadData().catch(console.error);
  }, []);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }, []);

  const savePages = useCallback((next) => {
    setPages(next);
    fbSet("pages", { pages: next, data: next });
  }, []);

  const saveFanRecords = useCallback((next) => {
    setFanRecords(next);
    fbSet("fanRecords", { fanRecords: next, data: next });
  }, []);

  const savePosts = useCallback((next) => {
    setPosts(next);
    fbSet("posts", { posts: next, data: next });
  }, []);

  const pageMap = useMemo(() => {
    const m = {};
    pages.forEach((p) => (m[p.id] = p));
    return m;
  }, [pages]);

  if (!allLoaded) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: "#F3F0EA", fontFamily: "'Noto Sans TC', sans-serif", color: "#8A9A8E", gap: 12 }}>
        <div style={{ fontSize: 32 }}>🔄</div>
        <div>連線 Firebase，讀取資料中…</div>
      </div>
    );
  }

  return (
    <div style={styles.shell}>
      <style>{fontImports}</style>
      <Sidebar view={view} setView={setView} pageCount={pages.length} />
      <main style={styles.main}>
        {false && null}
        {view === "pages" && (
          <PagesView
            pages={pages}
            savePages={savePages}
            showToast={showToast}
            fanRecords={fanRecords}
            saveFanRecords={saveFanRecords}
            posts={posts}
            savePosts={savePosts}
          />
        )}
        {view === "input" && (
          <InputView
            pages={pages}
            posts={posts}
            savePosts={savePosts}
            fanRecords={fanRecords}
            saveFanRecords={saveFanRecords}

/* ---------------- Excel import: header fuzzy matching ---------------- */
const HEADER_HINTS = {
  name: ["經銷商", "名稱", "粉絲團", "粉絲頁", "page", "name", "品牌"],
  url: ["網址", "連結", "url", "link", "facebook"],
  category: ["集團", "法人", "公司", "分類", "category", "group"],
  region: ["地區", "區域", "region", "area"],
};

// strip non-breaking spaces and other invisible whitespace that often sneaks in from copy-pasted spreadsheets
function cleanCell(v) {
  return String(v ?? "").replace(/[\u00A0\u200B\uFEFF]/g, "").trim();
}

function matchColumn(headerRow, kind, usedIdx = []) {
  const hints = HEADER_HINTS[kind];
  for (let i = 0; i < headerRow.length; i++) {
    if (usedIdx.includes(i)) continue;
    const h = cleanCell(headerRow[i]).toLowerCase();
    if (!h) continue;
    if (hints.some((hint) => h.includes(hint.toLowerCase()))) return i;
  }
  return -1;
}

function isLikelyUrl(s) {
  return /^https?:\/\//i.test(cleanCell(s));
}

// a row counts as a usable header row if at least 2 of its cells match any known hint
function looksLikeHeaderRow(row) {
  const allHints = [...HEADER_HINTS.name, ...HEADER_HINTS.url, ...HEADER_HINTS.category, ...HEADER_HINTS.region];
  let hits = 0;
  for (const cell of row) {
    const h = cleanCell(cell).toLowerCase();
    if (h && allHints.some((hint) => h.includes(hint.toLowerCase()))) hits++;
  }
  return hits >= 2;
}

async function parseImportFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const allRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  if (allRows.length === 0) return { rows: [], warnings: ["檔案是空的"] };

  // skip any leading fully-blank rows, then look for the real header row within the next few rows
  let headerRowIdx = -1;
  for (let i = 0; i < Math.min(allRows.length, 10); i++) {
    const row = allRows[i];
    const isBlank = row.every((c) => cleanCell(c) === "");
    if (isBlank) continue;
    if (looksLikeHeaderRow(row)) {
      headerRowIdx = i;
      break;
    }
    // first non-blank row that doesn't look like a header — assume it IS the header anyway (best effort)
    headerRowIdx = i;
    break;
  }
  if (headerRowIdx === -1) headerRowIdx = 0;

  const header = allRows[headerRowIdx];
  let nameIdx = matchColumn(header, "name");
  let urlIdx = matchColumn(header, "url", [nameIdx]);
  let catIdx = matchColumn(header, "category", [nameIdx, urlIdx]);
  let regionIdx = matchColumn(header, "region", [nameIdx, urlIdx, catIdx]);

  const warnings = [];
  const dataRows = allRows.slice(headerRowIdx + 1).filter((r) => r.some((c) => cleanCell(c) !== ""));

  // Fallback: if name/url columns weren't found by header text, guess by content of first data row
  if ((nameIdx === -1 || urlIdx === -1) && dataRows.length > 0) {
    const sample = dataRows[0];
    if (urlIdx === -1) {
      const guess = sample.findIndex((c) => isLikelyUrl(c));
      if (guess !== -1) urlIdx = guess;
    }
    if (nameIdx === -1) {
      const guess = sample.findIndex((c, i) => i !== urlIdx && i !== catIdx && i !== regionIdx && cleanCell(c) !== "");
      if (guess !== -1) nameIdx = guess;
    }
  }

  if (nameIdx === -1) warnings.push("找不到「名稱」欄位，請確認標題列是否包含類似「名稱」「經銷商」「粉絲團」的字樣");
  if (urlIdx === -1) warnings.push("找不到「網址」欄位，請確認標題列是否包含類似「網址」「連結」的字樣");
  if (headerRowIdx > 0) warnings.push(`偵測到標題列前有 ${headerRowIdx} 行空白或說明文字，已自動跳過`);

  const parsed = dataRows.map((r, i) => ({
    rowNum: headerRowIdx + i + 2, // +2: 1-indexed sheet rows, plus the header row itself
    name: nameIdx !== -1 ? cleanCell(r[nameIdx]) : "",
    url: urlIdx !== -1 ? cleanCell(r[urlIdx]) : "",
    category: catIdx !== -1 ? cleanCell(r[catIdx]) : "",
    region: regionIdx !== -1 ? cleanCell(r[regionIdx]) : "",
  }));

  return { rows: parsed, warnings, detected: { headerRowIdx, nameIdx, urlIdx, catIdx, regionIdx, header } };
}

function ImportModal({ onClose, onConfirm, existingPages }) {
  const [stage, setStage] = useState("pick"); // pick | preview | done
  const [fileName, setFileName] = useState("");
  const [parsedRows, setParsedRows] = useState([]);

  const [error, setError] = useState("");

  const fileInputRef = useRef(null);

  const existingNames = useMemo(() => new Set(existingPages.map((p) => p.name)), [existingPages]);

  const handleFile = async (file) => {
    setBusy(true);
    setError("");
    try {
      const { rows, warnings } = await parseImportFile(file);
      setFileName(file.name);
      setParsedRows(rows);
      setWarnings(warnings);
      setStage("preview");
    } catch (e) {
      console.error(e);
      setError("讀取檔案失敗，請確認是否為 .xlsx 或 .csv 格式");

      setBusy(false);
    }

  const validRows = parsedRows.filter((r) => r.name);

            <button style={styles.primaryBtn} onClick={onClose}>完成</button>

      </div>
    </div>
  );
}

function PagesView({ pages, savePages, showToast, fanRecords, saveFanRecords, posts, savePosts }) {
  const [name, setName] = useState("");
  const [category, setCategory] = useState("");
  const [region, setRegion] = useState("");
  const [url, setUrl] = useState("");
  const [query, setQuery] = useState("");
  const [filterCategory, setFilterCategory] = useState("");
  const [filterRegion, setFilterRegion] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editUrl, setEditUrl] = useState("");
  const [editCategory, setEditCategory] = useState("");
  const [editRegion, setEditRegion] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [pendingRestore, setPendingRestore] = useState(null); // parsed backup object awaiting confirmation
  const [restoreError, setRestoreError] = useState("");
  const restoreInputRef = useRef(null);
  const inputRef = useRef(null);

  const addPage = () => {
    const trimmed = name.trim();
    if (!trimmed) return;
    if (pages.some((p) => p.name === trimmed)) {
      showToast("已有同名粉絲團");
      return;
    }
    const next = [...pages, { id: uid(), name: trimmed, category: category.trim(), region: region.trim(), url: url.trim() }];
    savePages(next);
    setName("");
    setCategory("");
    setRegion("");
    setUrl("");
    showToast(`已新增「${trimmed}」`);
    inputRef.current?.focus();
  };

  const removePage = (id) => {
    const p = pages.find((x) => x.id === id);
    savePages(pages.filter((x) => x.id !== id));
    showToast(`已移除「${p?.name}」（歷史貼文與粉絲數紀錄仍會保留）`);
  };

  const startEdit = (p) => {
    setEditingId(p.id);
    setEditName(p.name);
    setEditUrl(p.url || "");
    setEditCategory(p.category || "");
    setEditRegion(p.region || "");
  };

  const commitEdit = () => {
    const trimmed = editName.trim();
    if (!trimmed) return;
    savePages(pages.map((p) => (p.id === editingId ? { ...p, name: trimmed, url: editUrl.trim(), category: editCategory.trim(), region: editRegion.trim() } : p)));
    setEditingId(null);
  };

  const handleImportConfirm = (newRows) => {
    const additions = newRows.map((r) => ({ id: uid(), name: r.name, url: r.url, category: r.category, region: r.region }));
    savePages([...pages, ...additions]);
    showToast(`已匯入 ${additions.length} 家粉絲團`);
  };

  const categories = useMemo(() => [...new Set(pages.map((p) => p.category).filter(Boolean))].sort(), [pages]);
  const regions = useMemo(() => [...new Set(pages.map((p) => p.region).filter(Boolean))].sort(), [pages]);

  const filtered = pages.filter((p) => {
    const matchesQuery = p.name.includes(query) || (p.category || "").includes(query) || (p.region || "").includes(query);
    const matchesCategory = !filterCategory || p.category === filterCategory;
    const matchesRegion = !filterRegion || p.region === filterRegion;
    return matchesQuery && matchesCategory && matchesRegion;
  });
  const currentMonth = nowMonth();

  /* ---------------- Full data backup (export / restore) ---------------- */
  const exportBackup = () => {
    const backup = {
      app: "fbmonitor",
      version: 1,
      exportedAt: new Date().toISOString(),
      pages,
      fanRecords,
      posts,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `粉絲團監測站_完整備份_${nowMonth()}_${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("已匯出完整備份");
  };

  const handleRestoreFile = async (file) => {
    setRestoreError("");
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || typeof data !== "object" || !Array.isArray(data.pages) || typeof data.fanRecords !== "object" || !Array.isArray(data.posts)) {
        setRestoreError("這個檔案的格式不像是本系統的備份檔，請確認檔案是否正確。");
        return;
      }
      setPendingRestore(data);
    } catch (e) {
      setRestoreError("讀取失敗，請確認檔案是有效的 JSON 備份檔。");
    }
  };

  const confirmRestore = () => {
    if (!pendingRestore) return;
    savePages(pendingRestore.pages || []);
    saveFanRecords(pendingRestore.fanRecords || {});
    savePosts(pendingRestore.posts || []);
    showToast("已從備份還原所有資料");
    setPendingRestore(null);
  };

  return (
    <div style={styles.viewWrap}>
      <Header
        title="粉絲團清單"
        subtitle={`目前追蹤 ${pages.length} 家粉絲團，可隨時新增或移除`}
      >
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button style={styles.secondaryBtn} onClick={() => setShowImport(true)}>
            <Icon name="download" size={16} />
            匯入 Excel
          </button>
          <button style={styles.secondaryBtn} onClick={exportBackup}>
            <Icon name="save" size={16} />
            匯出完整備份
          </button>
          <button style={styles.secondaryBtn} onClick={() => restoreInputRef.current?.click()}>
            <Icon name="trend" size={16} />
            從備份還原
          </button>
          <input
            ref={restoreInputRef}
            type="file"
            accept=".json"
            style={{ display: "none" }}
            onChange={(e) => e.target.files?.[0] && handleRestoreFile(e.target.files[0])}
          />
        </div>
      </Header>

      {restoreError && <div style={styles.errorBox}>{restoreError}</div>}

      {pendingRestore && (
        <div style={styles.modalOverlay} onClick={(e) => e.target === e.currentTarget && setPendingRestore(null)}>
          <div style={{ ...styles.modalCard, maxWidth: 520 }}>
            <div style={styles.modalHeader}>
              <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                <Icon name="trend" size={17} />
                <span style={{ fontFamily: "'Noto Serif TC', serif", fontWeight: 700, fontSize: 17 }}>確認還原備份</span>
              </div>
              <button style={styles.iconBtn} onClick={() => setPendingRestore(null)}><Icon name="x" size={18} /></button>
            </div>
            <div style={styles.modalBody}>
              <p style={{ fontSize: 13.5, color: "#7A7568", lineHeight: 1.7, marginTop: 0 }}>
                這份備份包含 <b>{(pendingRestore.pages || []).length}</b> 家粉絲團、
                <b>{(pendingRestore.posts || []).length}</b> 筆貼文紀錄。
              </p>
              <div style={styles.warnBox}>
                ⚠ 還原會「整批覆蓋」目前畫面上的所有資料（粉絲團清單、粉絲數紀錄、貼文紀錄），現有資料將會被取代，無法復原。請確認這是你要的備份檔案。
              </div>
            </div>
            <div style={styles.modalFooter}>
              <button style={styles.secondaryBtn} onClick={() => setPendingRestore(null)}>取消</button>
              <button style={{ ...styles.primaryBtn, background: "#C08081" }} onClick={confirmRestore}>
                確認覆蓋並還原
              </button>
            </div>
          </div>
        </div>
      )}

      {showImport && (

            />

                    key={r}
                    style={{ ...styles.chipBtn, ...(filterRegion === r ? styles.chipBtnActive : {}) }}

      <div style={{ ...styles.card, padding: 0, overflow: "hidden" }}>

            style={{ ...styles.input, border: "none", padding: "4px 0", flex: 1 }}

        {filtered.length === 0 ? (
          <EmptyState text={pages.length === 0 ? "還沒有任何粉絲團，先在上方新增第一家，或用右上角「匯入 Excel」一次匯入。" : "找不到符合的粉絲團。"} />

          <table style={styles.table}>
            <thead>
              <tr>
                <th style={styles.th}>粉絲團</th>

                <th style={{ ...styles.th, width: 90 }}>地區</th>
                <th style={{ ...styles.th, textAlign: "right", width: 130, whiteSpace: "nowrap" }}>最新粉絲數</th>
                <th style={{ ...styles.th, width: 90 }}></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((p) => {
                const latest = latestInMonth(fanRecords, p.id, currentMonth);
                return (
                  <tr key={p.id} style={styles.tr}>
                    <td style={styles.td}>
                      {editingId === p.id ? (
                        <div style={{ display: "flex", flexDirection: "column", gap: 6, minWidth: 220 }}>
                          <input
                            autoFocus
                            style={styles.input}
                            value={editName}
                            placeholder="粉絲團名稱"
                            onChange={(e) => setEditName(e.target.value)}
                            onKeyDown={(e) => e.key === "Enter" && commitEdit()}
                          />
                          <input
                            style={{ ...styles.input, fontSize: 12.5 }}
                            value={editUrl}
                            placeholder="粉絲團網址"
                            onChange={(e) => setEditUrl(e.target.value)}
                            onKeyDown={(e) => e.key === "Enter" && commitEdit()}
                          />
                          <div style={{ display: "flex", gap: 6 }}>
                            <input
                              style={{ ...styles.input, fontSize: 12.5 }}
                              value={editCategory}
                              placeholder="法人/集團"
                              onChange={(e) => setEditCategory(e.target.value)}
                              onKeyDown={(e) => e.key === "Enter" && commitEdit()}
                            />
                            <input
                              style={{ ...styles.input, fontSize: 12.5 }}
                              value={editRegion}
                              placeholder="地區"
                              onChange={(e) => setEditRegion(e.target.value)}
                              onKeyDown={(e) => e.key === "Enter" && commitEdit()}
                              onBlur={commitEdit}
                            />
                          </div>
                        </div>
                      ) : (
                        <div>
                          <div style={{ fontWeight: 500 }}>{p.name}</div>
                          {p.url && (
                            <a href={p.url} target="_blank" rel="noreferrer" style={{ ...styles.link, marginTop: 2 }}>
                              <Icon name="link" size={12} /> {p.url.replace(/^https?:\/\//, "").slice(0, 36)}
                            </a>
                          )}
                        </div>
                      )}
                    </td>
                    <td style={styles.td}>
                      {editingId !== p.id && <span style={styles.tag}>{p.category || "—"}</span>}
                    </td>
                    <td style={styles.td}>
                      {editingId !== p.id && <span style={styles.tag}>{p.region || "—"}</span>}
                    </td>
                    <td style={{ ...styles.td, textAlign: "right", fontFamily: "'Space Grotesk', sans-serif" }}>
                      {latest ? latest.count.toLocaleString() : "—"}
                    </td>
                    <td style={{ ...styles.td, textAlign: "right" }}>
                      {editingId === p.id ? (
                        <button style={{ ...styles.iconBtn, color: "#7B8F77" }} onClick={commitEdit} title="儲存">
                          <Icon name="save" size={15} />
                        </button>
                      ) : (
                        <button style={styles.iconBtn} onClick={() => startEdit(p)} title="編輯">
                          <Icon name="edit" size={15} />
                        </button>
                      )}
                      <button style={{ ...styles.iconBtn, color: "#C08081" }} onClick={() => removePage(p.id)} title="移除">
                        <Icon name="trash" size={15} />
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ============================================================ Input view ============================================================ */
function InputView({ pages, posts, savePosts, fanRecords, saveFanRecords, month, setMonth, showToast }) {
  const [tab, setTab] = useState("posts"); // posts | fans
  const [selectedPageId, setSelectedPageId] = useState(pages[0]?.id || "");
  const [draft, setDraft] = useState({ url: "", views: "", likes: "", comments: "", shares: "", type: "static", date: "" });
  const urlRef = useRef(null);

  // editing an existing post
  const [editingPostId, setEditingPostId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);

  // fan-count tab draft
  const [fanPageId, setFanPageId] = useState(pages[0]?.id || "");
  const [fanDate, setFanDate] = useState(todayStr());
  const [fanCount, setFanCount] = useState("");
  const fanInputRef = useRef(null);

  useEffect(() => {
    if (!selectedPageId && pages.length) setSelectedPageId(pages[0].id);
    if (!fanPageId && pages.length) setFanPageId(pages[0].id);
  }, [pages, selectedPageId, fanPageId]);

  useEffect(() => {
    if (!draft.date) setDraft((d) => ({ ...d, date: `${month}-01` }));
  }, [month]);

  const monthPosts = useMemo(
    () => posts.filter((p) => p.month === month && p.pageId === selectedPageId).sort((a, b) => (b.date || "").localeCompare(a.date || "")),
    [posts, month, selectedPageId]
  );

  const resetDraft = () => setDraft({ url: "", views: "", likes: "", comments: "", shares: "", type: draft.type, date: draft.date });

  const addPost = () => {
    if (!selectedPageId) {
      showToast("請先選擇粉絲團");
      return;
    }
    const views = Number(draft.views) || 0;
    const likes = Number(draft.likes) || 0;
    const comments = Number(draft.comments) || 0;
    const shares = Number(draft.shares) || 0;
    if (!draft.url.trim() && views === 0 && likes === 0 && comments === 0 && shares === 0) {
      showToast("請至少輸入貼文連結或互動數字");
      return;
    }
    const entry = {
      id: uid(),
      pageId: selectedPageId,
      url: draft.url.trim(),
      views,
      likes,
      comments,
      shares,
      type: draft.type,
      date: draft.date || `${month}-01`,
      month,
    };
    savePosts([...posts, entry]);
    resetDraft();
    urlRef.current?.focus();
  };

  const removePost = (id) => savePosts(posts.filter((p) => p.id !== id));

  const startEditPost = (p) => {
    setEditingPostId(p.id);
    setEditDraft({
      url: p.url || "",
      views: p.views || "",
      likes: p.likes || "",
      comments: p.comments || "",
      shares: p.shares || "",
      type: p.type,
      date: p.date,
    });
  };

  const cancelEditPost = () => {
    setEditingPostId(null);
    setEditDraft(null);
  };

  const commitEditPost = () => {
    if (!editingPostId || !editDraft) return;
    const updated = {
      url: editDraft.url.trim(),
      views: Number(editDraft.views) || 0,
      likes: Number(editDraft.likes) || 0,
      comments: Number(editDraft.comments) || 0,
      shares: Number(editDraft.shares) || 0,
      type: editDraft.type,
      date: editDraft.date,
    };
    savePosts(posts.map((p) => (p.id === editingPostId ? { ...p, ...updated, month: updated.date.slice(0, 7) } : p)));
    showToast("已更新貼文數據");
    setEditingPostId(null);
    setEditDraft(null);
  };

  const fanEntriesThisMonth = useMemo(
    () => entriesInMonth(fanRecords, fanPageId, month),
    [fanRecords, fanPageId, month]
  );

  const addFanEntry = () => {
    if (!fanPageId) {
      showToast("請先選擇粉絲團");
      return;
    }
    if (fanCount === "" || isNaN(Number(fanCount))) {
      showToast("請輸入粉絲人數");
      return;
    }
    const entry = { id: uid(), date: fanDate || todayStr(), count: Number(fanCount) };
    const existing = fanRecords[fanPageId] || [];
    const next = { ...fanRecords, [fanPageId]: [...existing, entry] };
    saveFanRecords(next);
    setFanCount("");
    fanInputRef.current?.focus();
  };

  const removeFanEntry = (pageId, entryId) => {
    const next = { ...fanRecords, [pageId]: (fanRecords[pageId] || []).filter((e) => e.id !== entryId) };
    saveFanRecords(next);
  };

  const selectedPage = pages.find((p) => p.id === selectedPageId);
  const fanPage = pages.find((p) => p.id === fanPageId);

  return (
    <div style={styles.viewWrap}>
      <Header title="本月輸入" subtitle="記錄各粉絲團的貼文互動數與粉絲人數">
        <MonthSwitcher month={month} setMonth={setMonth} />
      </Header>

      <div style={styles.tabRow}>
        <button style={{ ...styles.tabBtn, ...(tab === "posts" ? styles.tabBtnActive : {}) }} onClick={() => setTab("posts")}>
          貼文互動數
        </button>
        <button style={{ ...styles.tabBtn, ...(tab === "fans" ? styles.tabBtnActive : {}) }} onClick={() => setTab("fans")}>
          粉絲人數
        </button>
      </div>

      {pages.length === 0 ? (
        <div style={styles.card}>
          <EmptyState text="請先到「粉絲團清單」新增粉絲團，才能開始輸入資料。" />
        </div>
      ) : tab === "posts" ? (
        <>
          <div style={styles.card}>
            <div className="fbm-form-grid" style={styles.formGrid}>
              <Field label="粉絲團" style={{ gridColumn: "span 2" }}>
                <select style={styles.input} value={selectedPageId} onChange={(e) => setSelectedPageId(e.target.value)}>
                  {pages.map((p) => (
                    <option key={p.id} value={p.id}>{p.name}</option>
                  ))}
                </select>
              </Field>
              <Field label="日期">
                <input type="date" style={styles.input} value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} />
              </Field>
              <Field label="類型">
                <select style={styles.input} value={draft.type} onChange={(e) => setDraft({ ...draft, type: e.target.value })}>
                  {POST_TYPES.map((t) => (
                    <option key={t.value} value={t.value}>{t.label}</option>
                  ))}
                </select>
              </Field>
              <Field label="貼文連結" style={{ gridColumn: "span 2" }}>
                <input
                  ref={urlRef}
                  style={styles.input}
                  placeholder="貼上貼文網址（選填）"
                  value={draft.url}
                  onChange={(e) => setDraft({ ...draft, url: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && addPost()}
                />
              </Field>
              <Field label="觀看數（影片用）">
                <input
                  type="number"
                  style={styles.input}
                  value={draft.views}
                  onChange={(e) => setDraft({ ...draft, views: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && addPost()}
                />
              </Field>
              <Field label="讚數">
                <input
                  type="number"
                  style={styles.input}
                  value={draft.likes}
                  onChange={(e) => setDraft({ ...draft, likes: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && addPost()}
                />
              </Field>
              <Field label="留言數">
                <input
                  type="number"
                  style={styles.input}
                  value={draft.comments}
                  onChange={(e) => setDraft({ ...draft, comments: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && addPost()}
                />
              </Field>
              <Field label="分享數">
                <input
                  type="number"
                  style={styles.input}
                  value={draft.shares}
                  onChange={(e) => setDraft({ ...draft, shares: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && addPost()}
                />
              </Field>
              <div style={{ display: "flex", alignItems: "flex-end" }}>
                <button style={{ ...styles.primaryBtn, width: "100%" }} onClick={addPost}>
                  <Icon name="plus" size={16} />
                  新增並繼續
                </button>
              </div>
            </div>
            <div style={styles.hint}>按 Enter 可快速新增下一筆，粉絲團與類型設定會延續，方便連續輸入同一家的多篇貼文。觀看數只有影片/Reels類型才會有，靜態貼文可留空。</div>
          </div>

          <div style={{ ...styles.card, padding: 0, overflow: "hidden" }}>
            <div style={styles.cardHeadRow}>
              <span>{selectedPage?.name || "—"} · {monthLabel(month)} 已輸入 {monthPosts.length} 篇</span>
            </div>
            {monthPosts.length === 0 ? (
              <EmptyState text="這個粉絲團本月還沒有輸入任何貼文。" />
            ) : (
              <table style={styles.table}>
                <thead>
                  <tr>
                    <th style={styles.th}>日期</th>

                    <th style={styles.th}>連結</th>
                    <th style={{ ...styles.th, textAlign: "right" }}>觀看數</th>

                    <th style={{ ...styles.th, textAlign: "right" }}>互動總計</th>
                    <th style={{ ...styles.th, width: 70 }}></th>
                  </tr>
                </thead>
                <tbody>
                  {monthPosts.map((p) => {

                          <td style={styles.td}>

                          <td style={styles.td}>
                            <select style={{ ...styles.input, fontSize: 12.5 }} value={editDraft.type} onChange={(e) => setEditDraft({ ...editDraft, type: e.target.value })}>

                          <td style={styles.td}>

                          <td style={{ ...styles.td, textAlign: "right" }}>

                          <td style={{ ...styles.td, textAlign: "right", color: "#A6A096", fontSize: 12.5 }}>—</td>
                          <td style={{ ...styles.td, textAlign: "right", whiteSpace: "nowrap" }}>

                    return (

function ReportView({ pages, posts, fanRecords, month, setMonth, showToast }) {
  const [reportTab, setReportTab] = useState("monthly");
  const monthPosts = useMemo(() => posts.filter((p) => p.month === month), [posts, month]);
  const pageMap = useMemo(() => {
    const m = {};
    pages.forEach((p) => (m[p.id] = p));
    return m;
  }, [pages]);

  const topLiked = useMemo(
    () => [...monthPosts].sort((a, b) => b.likes - a.likes).slice(0, 10),
    [monthPosts]
  );
  const topEngaged = useMemo(
    () => [...monthPosts].sort((a, b) => engagement(b) - engagement(a)).slice(0, 10),
    [monthPosts]
  );

  const fanGrowth = useMemo(() => {
    const prevMonth = shiftMonth(month, -1);
    return pages
      .map((p) => {
        const curEntry = latestInMonth(fanRecords, p.id, month);
        const prevEntry = latestInMonth(fanRecords, p.id, prevMonth);
        const cur = curEntry?.count;
        const prev = prevEntry?.count;
        const diff = typeof cur === "number" && typeof prev === "number" ? cur - prev : null;
        const pct = diff != null && prev > 0 ? (diff / prev) * 100 : null;
        return { page: p, cur, curDate: curEntry?.date, prev, diff, pct };
      })
      .filter((r) => r.cur != null)
      .sort((a, b) => (b.diff ?? -Infinity) - (a.diff ?? -Infinity));
  }, [pages, fanRecords, month]);

  const totals = useMemo(() => {
    const totalFans = fanGrowth.reduce((s, r) => s + (r.cur || 0), 0);
    const totalGrowth = fanGrowth.reduce((s, r) => s + (r.diff || 0), 0);
    return { totalFans, totalGrowth, postCount: monthPosts.length };
  }, [fanGrowth, monthPosts]);

  const exportExcel = useCallback(async () => {
    showToast("匯出中…");
    try {
      const wb = XLSX.utils.book_new();

      const growthSheet = fanGrowth.map((r) => ({
        粉絲團: r.page.name,
        粉絲團網址: r.page.url || "",
        法人集團: r.page.category || "",
        地區: r.page.region || "",
        本月粉絲數: r.cur ?? "",
        量測日期: r.curDate ?? "",
        上月粉絲數: r.prev ?? "",
        增減人數: r.diff ?? "",
        增減百分比: r.pct != null ? `${r.pct.toFixed(2)}%` : "",
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(growthSheet), "粉絲成長排名");

      const toRow = (p, i) => ({
        排名: i + 1,
        粉絲團: pageMap[p.pageId]?.name || "",
        粉絲團網址: pageMap[p.pageId]?.url || "",
        法人集團: pageMap[p.pageId]?.category || "",
        地區: pageMap[p.pageId]?.region || "",
        日期: p.date,
        類型: POST_TYPES.find((t) => t.value === p.type)?.label || p.type,
        觀看數: p.views || "",
        讚數: p.likes,
        留言數: p.comments,
        分享數: p.shares,
        互動總計: engagement(p),
        貼文連結: p.url,
      });

      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(topLiked.map(toRow)), "最高讚貼文");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(topEngaged.map(toRow)), "最高互動貼文");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(monthPosts.map((p, i) => toRow(p, i))), "全部貼文紀錄");

      XLSX.writeFile(wb, `粉絲團月報表_${month}.xlsx`);
      showToast("已匯出 Excel");

      showToast("匯出失敗，請稍後再試");

  return (
    <div style={styles.viewWrap}>
      <Header title="月報表" subtitle="當月各項監測指標總覽">
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>

            <button style={styles.primaryBtn} onClick={exportExcel}>
              <Icon name="download" size={16} />

          )}
        </div>
      </Header>

      {/* Tab switcher */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <button onClick={() => setReportTab("monthly")} style={{ padding: "7px 18px", borderRadius: 8, border: "none", background: reportTab === "monthly" ? "#4A7C59" : "#E8E4DC", color: reportTab === "monthly" ? "#fff" : "#5C5043", cursor: "pointer", fontFamily: "inherit", fontWeight: 500, fontSize: 14 }}>📊 月報</button>

                <th style={{ ...styles.th, textAlign: "right" }}>增減</th>
                <th style={{ ...styles.th, textAlign: "right" }}>增減率</th>
              </tr>
            </thead>
            <tbody>
              {fanGrowth.map((r, i) => (
                <tr key={r.page.id} style={styles.tr}>
                  <td style={styles.td}>{i === 0 ? <Icon name="crown" size={15} className="" /> : i + 1}</td>

                    <PageNameCell page={r.page} />
                  </td>
                  <td style={{ ...styles.td, textAlign: "right", fontFamily: "'Space Grotesk', sans-serif" }}>{r.cur?.toLocaleString()}</td>
                  <td style={{ ...styles.td, textAlign: "right", color: "#A6A096", fontSize: 12.5 }}>{r.curDate}</td>

      <SectionTitle icon="heart" title="本月最高讚貼文 TOP 10" />
      <PostRankTable posts={topLiked} pageMap={pageMap} metric="likes" metricLabel="讚數" />

/* ---------------- Reusable line chart with PNG export ---------------- */
const CHART_PALETTE = ["#8A9A8E", "#B08968", "#5C6B73", "#C08081", "#A18A68", "#7B8F77", "#9A8AA6", "#6E8A9A"];

function downloadSvgAsPng(svgEl, filename) {
  const serializer = new XMLSerializer();
  const svgString = serializer.serializeToString(svgEl);
  const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  const bbox = svgEl.getBoundingClientRect();
  const scale = 2; // export at 2x for sharper image
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = (svgEl.width?.baseVal?.value || bbox.width) * scale;
    canvas.height = (svgEl.height?.baseVal?.value || bbox.height) * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FBF9F4";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }, "image/png");
  };
  img.src = url;
}

function LineChartCard({ title, months, series, onDownloadName }) {
  const svgRef = useRef(null);
  const maxVal = useMemo(() => {
    let max = 0;
    series.forEach((s) => s.points.forEach((v) => { if (typeof v === "number" && v > max) max = v; }));
    return max || 1;
  }, [series]);

  const width = Math.max(months.length * 90, 480);
  const height = 280;

  return (
    <div style={styles.card}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: "#7A7568", fontWeight: 500 }}>{title}</div>
        <button
          style={styles.secondaryBtn}
          onClick={() => svgRef.current && downloadSvgAsPng(svgRef.current, onDownloadName)}
          disabled={series.length === 0}
        >
          <Icon name="download" size={15} />
          下載圖表
        </button>
      </div>
      {series.length === 0 ? (
        <EmptyState text="請先在上方選擇至少一家粉絲團。" />
      ) : (
        <div style={{ overflowX: "auto" }}>
          <svg ref={svgRef} width={width} height={height} style={{ display: "block", background: "#FBF9F4" }}>
            {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
              <line key={i} x1={0} x2={width} y1={20 + t * 200} y2={20 + t * 200} stroke="#E6E1D6" strokeWidth={1} />
            ))}
            {series.map((s, ci) => {
              const points = months.map((m, i) => {
                const v = s.points[i];
                const x = 50 + i * 90;
                const y = typeof v === "number" ? 220 - (v / maxVal) * 200 : null;
                return { x, y, v };
              });
              const validPoints = points.filter((p) => p.y != null);
              const path = validPoints.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
              return (
                <g key={s.id}>
                  <path d={path} fill="none" stroke={s.color} strokeWidth={2} />
                  {validPoints.map((p, i) => (
                    <circle key={i} cx={p.x} cy={p.y} r={3.5} fill={s.color} />
                  ))}
                </g>
              );
            })}
            {months.map((m, i) => (
              <text key={m} x={50 + i * 90} y={260} textAnchor="middle" fontSize={11} fill="#7A7568" fontFamily="'Space Grotesk', sans-serif">
                {m}
              </text>
            ))}
          </svg>
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 12 }}>
            {series.map((s) => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
                <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, display: "inline-block" }} />
                {s.label}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const POST_METRICS = [
  { value: "views", label: "觀看數" },
  { value: "likes", label: "讚數" },
  { value: "comments", label: "留言數" },
  { value: "shares", label: "分享數" },
];

function TrendView({ pages, fanRecords, posts }) {
  const allMonths = useMemo(() => {
    const set = new Set(posts.map((p) => p.month));
    Object.values(fanRecords).forEach((entries) => {
      (entries || []).forEach((e) => set.add((e.date || "").slice(0, 7)));
    });
    set.delete("");
    return [...set].sort();
  }, [fanRecords, posts]);

  const [rangeStart, setRangeStart] = useState("");
  const [rangeEnd, setRangeEnd] = useState("");

  useEffect(() => {
    if (allMonths.length > 0) {
      if (!rangeStart) setRangeStart(allMonths[0]);
      if (!rangeEnd) setRangeEnd(allMonths[allMonths.length - 1]);
    }
  }, [allMonths]);

  const months = useMemo(() => {
    if (!rangeStart || !rangeEnd) return allMonths;
    return allMonths.filter((m) => m >= rangeStart && m <= rangeEnd);
  }, [allMonths, rangeStart, rangeEnd]);

  const [selectedIds, setSelectedIds] = useState(() => pages.slice(0, 5).map((p) => p.id));
  const [postMetric, setPostMetric] = useState("views");

  useEffect(() => {
    setSelectedIds((ids) => ids.filter((id) => pages.some((p) => p.id === id)));
  }, [pages]);

  const toggle = (id) => {
    setSelectedIds((ids) => (ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id]));
  };

  const fanValueFor = useCallback((pageId, m) => {
    const entry = latestInMonth(fanRecords, pageId, m);
    return entry ? entry.count : null;
  }, [fanRecords]);

  const fanSeries = useMemo(() => {
    return selectedIds.map((id, i) => {
      const page = pages.find((p) => p.id === id);
      return {
        id,
        label: page?.name || "（已移除）",
        color: CHART_PALETTE[i % CHART_PALETTE.length],
        points: months.map((m) => fanValueFor(id, m)),
      };
    });
  }, [selectedIds, pages, months, fanValueFor]);

  // sum of the selected metric, per page per month, within the selected date range
  const postSeries = useMemo(() => {
    return selectedIds.map((id, i) => {
      const page = pages.find((p) => p.id === id);
      return {
        id,
        label: page?.name || "（已移除）",
        color: CHART_PALETTE[i % CHART_PALETTE.length],
        points: months.map((m) => {
          const relevant = posts.filter((p) => p.pageId === id && p.month === m);
          if (relevant.length === 0) return null;
          return relevant.reduce((sum, p) => sum + (Number(p[postMetric]) || 0), 0);
        }),
      };
    });
  }, [selectedIds, pages, months, posts, postMetric]);

  return (
    <div style={styles.viewWrap}>
      <Header title="趨勢總覽" subtitle="跨月份比較粉絲人數與貼文數據變化" />

      {pages.length === 0 ? (
        <div style={styles.card}><EmptyState text="尚無粉絲團，請先新增。" /></div>
      ) : allMonths.length === 0 ? (
        <div style={styles.card}><EmptyState text="尚無任何月份的資料，先到「本月輸入」記錄看看。" /></div>
      ) : (
        <>
          <div style={styles.card}>
            <div className="fbm-form-grid" style={{ ...styles.formGrid, gridTemplateColumns: "1fr 1fr 2fr" }}>
              <Field label="起始月份">
                <select style={styles.input} value={rangeStart} onChange={(e) => setRangeStart(e.target.value)}>
                  {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
                </select>
              </Field>
              <Field label="結束月份">
                <select style={styles.input} value={rangeEnd} onChange={(e) => setRangeEnd(e.target.value)}>
                  {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
                </select>
              </Field>
              <div style={{ display: "flex", alignItems: "flex-end" }}>
                <div style={{ fontSize: 12.5, color: "#9C9684" }}>
                  目前顯示範圍：{months.length > 0 ? `${monthLabel(months[0])} ～ ${monthLabel(months[months.length - 1])}（共 ${months.length} 個月）` : "無資料"}
                </div>
              </div>
            </div>
          </div>

          <div style={styles.card}>
            <div style={{ fontSize: 13, color: "#7A7568", marginBottom: 10 }}>選擇要比較的粉絲團（可複選，建議 5 家以內較清晰）</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {pages.map((p) => {
                const active = selectedIds.includes(p.id);
                const idx = selectedIds.indexOf(p.id);
                return (
                  <button
                    key={p.id}
                    onClick={() => toggle(p.id)}
                    style={{
                      ...styles.chipBtn,
                      ...(active ? { background: CHART_PALETTE[idx % CHART_PALETTE.length], color: "#fff", borderColor: "transparent" } : {}),
                    }}
                  >
                    {p.name}
                  </button>
                );
              })}
            </div>
          </div>

          <LineChartCard
            title="粉絲人數趨勢（每月取最新一筆量測值）"
            months={months}
            series={fanSeries}
            onDownloadName={`粉絲人數趨勢_${rangeStart}_${rangeEnd}.png`}
          />

          <div style={styles.card}>
            <div style={styles.filterLabel}>貼文數據指標</div>
            <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
              {POST_METRICS.map((m) => (
                <button
                  key={m.value}

                  onClick={() => setPostMetric(m.value)}
                >
                  {m.label}
                </button>
              ))}
            </div>
          </div>

          <LineChartCard
            title={`貼文${POST_METRICS.find((m) => m.value === postMetric)?.label}趨勢（每月總和）`}
            months={months}
            series={postSeries}
            onDownloadName={`貼文${POST_METRICS.find((m) => m.value === postMetric)?.label}趨勢_${rangeStart}_${rangeEnd}.png`}
          />
        </>
      )}
    </div>
  );
}

function StatCard({ icon, label, value, tone }) {
  const color = tone === "good" ? "#7B8F77" : tone === "bad" ? "#C08081" : "#3A3A38";
  return (
    <div style={styles.statCard}>
      <div style={styles.statIcon}><Icon name={icon} size={18} /></div>
      <div>
        <div style={styles.statLabel}>{label}</div>
        <div style={{ ...styles.statValue, color }}>{value}</div>
      </div>
    </div>
  );
}

function MonthSwitcher({ month, setMonth }) {
  return (
    <div style={styles.monthSwitcher}>
      <button style={styles.iconBtn} onClick={() => setMonth(shiftMonth(month, -1))}>
        <Icon name="chevronLeft" size={16} />
      </button>
      <span style={styles.monthLabel}>{monthLabel(month)}</span>
      <button style={styles.iconBtn} onClick={() => setMonth(shiftMonth(month, 1))}>
        <Icon name="chevronRight" size={16} />
      </button>
    </div>
  );
}

function EmptyState({ text }) {
