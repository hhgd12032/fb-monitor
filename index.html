function nowMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function monthLabel(m) {
  const [y, mo] = m.split("-");
  return `${y}年${parseInt(mo)}月`;
}

function shiftMonth(m, delta) {
  const [y, mo] = m.split("-").map(Number);
  const d = new Date(y, mo - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function uid() {
  // Timestamp prefix ensures lexicographic order = insertion order
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function engagement(p) {
  return (p.likes || 0) + (p.comments || 0) + (p.shares || 0);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// entries belonging to a given "YYYY-MM" month, sorted by date ascending
function entriesInMonth(records, pageId, month) {
  return (records[pageId] || [])
    .filter((r) => (r.date || "").slice(0, 7) === month)
    .sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.id || "").localeCompare(b.id || ""));
}

// latest entry for a page within a month (used for month-over-month growth)
function latestInMonth(records, pageId, month) {
  const entries = entriesInMonth(records, pageId, month);
  return entries.length ? entries[entries.length - 1] : null;
}

/* ---------------- Firebase / Firestore persistence ----------------
   All data lives in a single Firestore document per data type under
   collection "fb_monitor". This means any user who opens the same
   GitHub Pages URL sees and edits the same shared dataset. */

const FB_COLLECTION = "fb_monitor";

// Read one document from Firestore and return its "data" field, or fallback
async function fbGet(docId, fallback) {
  try {
    const db = window.__fbdb;
    const ref = window.__fbdoc(db, FB_COLLECTION, docId);
    const snap = await window.__fbgetDoc(ref);
    if (snap.exists()) {
      let val = snap.data().value ?? fallback;
      // Backfill seq for posts that don't have one, preserving the array order from Firestore
      if (docId === "posts" && Array.isArray(val)) {
        let needsWrite = false;
        val = val.map((p, i) => {
          if (p.seq == null) { needsWrite = true; return { ...p, seq: i }; }
          return p;
        });
        if (needsWrite) {
          // Write back with seq filled in (fire-and-forget)
          window.__fbsetDoc(window.__fbdoc(db, "fb_monitor", docId), { value: val }).catch(() => {});
        }
      }
      return val;
    }
    return fallback;
  } catch (e) {
    console.error("Firestore read error", docId, e);
    return fallback;
  }
}

// Write a value to a Firestore document's "data" field
async function fbSet(docId, value) {
  try {
    const db = window.__fbdb;
    const ref = window.__fbdoc(db, FB_COLLECTION, docId);
    await window.__fbsetDoc(ref, { value });
  } catch (e) {
    console.error("Firestore write error", docId, e);
  }
}

// Hook: loads initial value from Firestore, exposes a persist() function that writes back
function useStoredState(key, fallback) {
  const [state, setState] = useState(fallback);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    let cancelled = false;
    const load = async () => {
      // Wait for Firebase to be ready (it initialises via a <script type="module">)
      if (!window.__fbReady) {
        await new Promise((resolve) => window.addEventListener("fbReady", resolve, { once: true }));
      }
      const value = await fbGet(key, fallback);
      if (!cancelled) {
        setState(value);
        setLoaded(true);
      }
    };
    load();
    return () => { cancelled = true; };
  }, [key]);

  const persist = useCallback(async (value) => {
    await fbSet(key, value);
  }, [key]);

  return [state, setState, persist, loaded];
}

/* ---------------- Excel import: header fuzzy matching ---------------- */
const HEADER_HINTS = {
  name: ["經銷商", "名稱", "粉絲團", "粉絲頁", "page", "name", "品牌"],
  url: ["網址", "連結", "url", "link", "facebook"],
  category: ["集團", "法人", "公司", "分類", "category", "group"],
  region: ["地區", "區域", "region", "area"],
};

// strip non-breaking spaces and other invisible whitespace that often sneaks in from copy-pasted spreadsheets
function cleanCell(v) {
  return String(v ?? "").replace(/[\u00A0\u200B\uFEFF]/g, "").trim();
}

function matchColumn(headerRow, kind, usedIdx = []) {
  const hints = HEADER_HINTS[kind];
  for (let i = 0; i < headerRow.length; i++) {
    if (usedIdx.includes(i)) continue;
    const h = cleanCell(headerRow[i]).toLowerCase();
    if (!h) continue;
    if (hints.some((hint) => h.includes(hint.toLowerCase()))) return i;
  }
  return -1;
}

function isLikelyUrl(s) {
  return /^https?:\/\//i.test(cleanCell(s));
}

// a row counts as a usable header row if at least 2 of its cells match any known hint
function looksLikeHeaderRow(row) {
  const allHints = [...HEADER_HINTS.name, ...HEADER_HINTS.url, ...HEADER_HINTS.category, ...HEADER_HINTS.region];
  let hits = 0;
  for (const cell of row) {
    const h = cleanCell(cell).toLowerCase();
    if (h && allHints.some((hint) => h.includes(hint.toLowerCase()))) hits++;
  }
  return hits >= 2;
}

async function parseImportFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const allRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  if (allRows.length === 0) return { rows: [], warnings: ["檔案是空的"] };

  // skip any leading fully-blank rows, then look for the real header row within the next few rows
  let headerRowIdx = -1;
  for (let i = 0; i < Math.min(allRows.length, 10); i++) {
    const row = allRows[i];
    const isBlank = row.every((c) => cleanCell(c) === "");
    if (isBlank) continue;
    if (looksLikeHeaderRow(row)) {
      headerRowIdx = i;
      break;
    }
    // first non-blank row that doesn't look like a header — assume it IS the header anyway (best effort)
    headerRowIdx = i;
    break;
  }
  if (headerRowIdx === -1) headerRowIdx = 0;

  const header = allRows[headerRowIdx];
  let nameIdx = matchColumn(header, "name");
  let urlIdx = matchColumn(header, "url", [nameIdx]);
  let catIdx = matchColumn(header, "category", [nameIdx, urlIdx]);
  let regionIdx = matchColumn(header, "region", [nameIdx, urlIdx, catIdx]);

  const warnings = [];
  const dataRows = allRows.slice(headerRowIdx + 1).filter((r) => r.some((c) => cleanCell(c) !== ""));

  // Fallback: if name/url columns weren't found by header text, guess by content of first data row
  if ((nameIdx === -1 || urlIdx === -1) && dataRows.length > 0) {
    const sample = dataRows[0];
    if (urlIdx === -1) {
      const guess = sample.findIndex((c) => isLikelyUrl(c));
      if (guess !== -1) urlIdx = guess;
    }
    if (nameIdx === -1) {
      const guess = sample.findIndex((c, i) => i !== urlIdx && i !== catIdx && i !== regionIdx && cleanCell(c) !== "");
      if (guess !== -1) nameIdx = guess;
    }
  }

  if (nameIdx === -1) warnings.push("找不到「名稱」欄位，請確認標題列是否包含類似「名稱」「經銷商」「粉絲團」的字樣");
  if (urlIdx === -1) warnings.push("找不到「網址」欄位，請確認標題列是否包含類似「網址」「連結」的字樣");
  if (headerRowIdx > 0) warnings.push(`偵測到標題列前有 ${headerRowIdx} 行空白或說明文字，已自動跳過`);

  const parsed = dataRows.map((r, i) => ({
    rowNum: headerRowIdx + i + 2, // +2: 1-indexed sheet rows, plus the header row itself
    name: nameIdx !== -1 ? cleanCell(r[nameIdx]) : "",
    url: urlIdx !== -1 ? cleanCell(r[urlIdx]) : "",
    category: catIdx !== -1 ? cleanCell(r[catIdx]) : "",
    region: regionIdx !== -1 ? cleanCell(r[regionIdx]) : "",
  }));

  return { rows: parsed, warnings, detected: { headerRowIdx, nameIdx, urlIdx, catIdx, regionIdx, header } };
}

function ImportModal({ onClose, onConfirm, existingPages }) {
  const [stage, setStage] = useState("pick"); // pick | preview | done
  const [fileName, setFileName] = useState("");
  const [parsedRows, setParsedRows] = useState([]);
  const [warnings, setWarnings] = useState([]);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const fileInputRef = useRef(null);

  const existingNames = useMemo(() => new Set(existingPages.map((p) => p.name)), [existingPages]);

  const handleFile = async (file) => {
    setBusy(true);
    setError("");
    try {
      const { rows, warnings } = await parseImportFile(file);
      setFileName(file.name);
      setParsedRows(rows);
      setWarnings(warnings);
      setStage("preview");
    } catch (e) {
      console.error(e);
      setError("讀取檔案失敗，請確認是否為 .xlsx 或 .csv 格式");
    } finally {
      setBusy(false);
    }
  };

  const validRows = parsedRows.filter((r) => r.name);
  const duplicateRows = validRows.filter((r) => existingNames.has(r.name));
  const newRows = validRows.filter((r) => !existingNames.has(r.name));
  const blankNameCount = parsedRows.length - validRows.length;

  return (
    <div style={styles.modalOverlay} onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div style={styles.modalCard}>
        <div style={styles.modalHeader}>
          <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
            <Icon name="download" size={17} />
            <span style={{ fontFamily: "'Noto Serif TC', serif", fontWeight: 700, fontSize: 17 }}>匯入粉絲團清單</span>
          </div>
          <button style={styles.iconBtn} onClick={onClose}><Icon name="x" size={18} /></button>
        </div>

        <div style={styles.modalBody}>
          {stage === "pick" && (
            <>
              <p style={{ fontSize: 13.5, color: "#7A7568", marginTop: 0, lineHeight: 1.7 }}>
                上傳 Excel（.xlsx）或 CSV 檔案，第一行需是標題列（例如「名稱」「網址」「集團」），系統會自動辨識欄位對應。
              </p>
              <div
                style={styles.dropZone}
                onClick={() => fileInputRef.current?.click()}
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => {
                  e.preventDefault();
                  const f = e.dataTransfer.files?.[0];
                  if (f) handleFile(f);
                }}
              >
                <Icon name="download" size={26} className="" />
                <div style={{ marginTop: 10, fontSize: 13.5 }}>{busy ? "讀取中…" : "點擊選擇檔案，或拖曳檔案到這裡"}</div>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept=".xlsx,.xls,.csv"
                  style={{ display: "none" }}
                  onChange={(e) => e.target.files?.[0] && handleFile(e.target.files[0])}
                />
              </div>
              {error && <div style={styles.errorBox}>{error}</div>}
            </>
          )}

          {stage === "preview" && (
            <>
              <div style={{ fontSize: 13, color: "#7A7568", marginBottom: 12 }}>
                檔案「{fileName}」共讀到 <b>{parsedRows.length}</b> 筆資料。
              </div>

              {warnings.length > 0 && (
                <div style={styles.warnBox}>
                  {warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}
                </div>
              )}

              <div style={styles.importStatRow}>
                <div style={styles.importStat}><span style={{ color: "#7B8F77", fontWeight: 600 }}>{newRows.length}</span> 筆將新增</div>
                <div style={styles.importStat}><span style={{ color: "#C08081", fontWeight: 600 }}>{duplicateRows.length}</span> 筆名稱重複（將跳過）</div>
                {blankNameCount > 0 && (
                  <div style={styles.importStat}><span style={{ color: "#A6A096", fontWeight: 600 }}>{blankNameCount}</span> 筆無名稱（將跳過）</div>
                )}
              </div>

              <div style={styles.importPreviewTableWrap}>
                <table style={styles.table}>
                  <thead>
                    <tr>
                      <th style={styles.th}>列</th>
                      <th style={styles.th}>名稱</th>
                      <th style={styles.th}>網址</th>
                      <th style={styles.th}>法人/集團</th>
                      <th style={styles.th}>地區</th>
                      <th style={styles.th}>狀態</th>
                    </tr>
                  </thead>
                  <tbody>
                    {parsedRows.map((r, i) => {
                      const isDup = r.name && existingNames.has(r.name);
                      const isBlank = !r.name;
                      return (
                        <tr key={i} style={styles.tr}>
                          <td style={{ ...styles.td, color: "#A6A096" }}>{r.rowNum}</td>
                          <td style={styles.td}>{r.name || <span style={{ color: "#C08081" }}>（空白）</span>}</td>
                          <td style={{ ...styles.td, fontSize: 12.5, color: "#7A7568" }}>{r.url || "—"}</td>
                          <td style={styles.td}>{r.category || "—"}</td>
                          <td style={styles.td}>{r.region || "—"}</td>
                          <td style={styles.td}>
                            {isBlank ? <span style={styles.tagBad}>無名稱</span> : isDup ? <span style={styles.tagWarn}>重複</span> : <span style={styles.tagGood}>新增</span>}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </>
          )}

          {stage === "done" && (
            <div style={{ textAlign: "center", padding: "30px 0" }}>
              <Icon name="spark" size={28} className="" />
              <div style={{ marginTop: 10, fontSize: 14.5 }}>已成功匯入 {newRows.length} 家粉絲團</div>
            </div>
          )}
        </div>

        <div style={styles.modalFooter}>
          {stage === "preview" && (
            <>
              <button style={styles.secondaryBtn} onClick={() => setStage("pick")}>重新選擇檔案</button>
              <button
                style={styles.primaryBtn}
                disabled={newRows.length === 0}
                onClick={() => {
                  onConfirm(newRows);
                  setStage("done");
                }}
              >
                <Icon name="plus" size={16} />
                確認匯入 {newRows.length} 家
              </button>
            </>
          )}
          {stage === "done" && (
            <button style={styles.primaryBtn} onClick={onClose}>完成</button>
          )}
        </div>
      </div>
    </div>
  );
}

function PagesView({ pages, savePages, showToast, fanRecords, saveFanRecords, posts, savePosts, groupRecords, saveGroupRecords }) {
  const [name, setName] = useState("");
  const [category, setCategory] = useState("");
  const [region, setRegion] = useState("");
  const [url, setUrl] = useState("");
  const [query, setQuery] = useState("");
  const [filterCategory, setFilterCategory] = useState("");
  const [filterRegion, setFilterRegion] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editUrl, setEditUrl] = useState("");
  const [editCategory, setEditCategory] = useState("");
  const [editRegion, setEditRegion] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [pendingDeleteId, setPendingDeleteId] = useState(null);
  const [groupMonth, setGroupMonth] = useState(nowMonth());
  const [filterGroup, setFilterGroup] = useState("");
  const [dragOverId, setDragOverId] = useState(null);
  const dragIdRef = useRef(null);
  const inputRef = useRef(null);

  // Toggle hidden status of a page
  const toggleHidden = (id) => {
    const p = pages.find((x) => x.id === id);
    savePages(pages.map((x) => x.id === id ? { ...x, hidden: !x.hidden } : x));
    showToast(p?.hidden ? `已取消隱藏「${p?.name}」` : `已隱藏「${p?.name}」`);
  };

  // Move a page up or down in the list
  const movePage = (id, dir) => {
    const idx = pages.findIndex((p) => p.id === id);
    if (idx < 0) return;
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= pages.length) return;
    const next = [...pages];
    [next[idx], next[newIdx]] = [next[newIdx], next[idx]];
    savePages(next);
  };

  // Drag handlers
  const onDragStart = (e, id) => {
    dragIdRef.current = id;
    e.dataTransfer.effectAllowed = "move";
  };
  const onDragOver = (e, id) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    setDragOverId(id);
  };
  const onDrop = (e, targetId) => {
    e.preventDefault();
    const srcId = dragIdRef.current;
    if (!srcId || srcId === targetId) { setDragOverId(null); return; }
    const srcIdx = pages.findIndex((p) => p.id === srcId);
    const tgtIdx = pages.findIndex((p) => p.id === targetId);
    const next = [...pages];
    const [moved] = next.splice(srcIdx, 1);
    next.splice(tgtIdx, 0, moved);
    savePages(next);
    setDragOverId(null);
    dragIdRef.current = null;
  };
  const onDragEnd = () => { setDragOverId(null); dragIdRef.current = null; };

  const setGroupForPage = (pageId, group) => {
    const monthGroups = { ...(groupRecords[groupMonth] || {}), [pageId]: group };
    saveGroupRecords({ ...groupRecords, [groupMonth]: monthGroups });
  };

  const addPage = () => {
    const trimmed = name.trim();
    if (!trimmed) return;
    if (pages.some((p) => p.name === trimmed)) {
      showToast("已有同名粉絲團");
      return;
    }
    const next = [...pages, { id: uid(), name: trimmed, category: category.trim(), region: region.trim(), url: url.trim() }];
    savePages(next);
    setName("");
    setCategory("");
    setRegion("");
    setUrl("");
    showToast(`已新增「${trimmed}」`);
    inputRef.current?.focus();
  };

  const requestDeletePage = (id) => setPendingDeleteId(id);

  const confirmDeletePage = () => {
    const p = pages.find((x) => x.id === pendingDeleteId);
    savePages(pages.filter((x) => x.id !== pendingDeleteId));
    showToast(`已移除「${p?.name}」（歷史貼文與粉絲數紀錄仍會保留）`);
    setPendingDeleteId(null);
  };

  const startEdit = (p) => {
    setEditingId(p.id);
    setEditName(p.name);
    setEditUrl(p.url || "");
    setEditCategory(p.category || "");
    setEditRegion(p.region || "");
  };

  const commitEdit = () => {
    const trimmed = editName.trim();
    if (!trimmed) return;
    savePages(pages.map((p) => (p.id === editingId ? { ...p, name: trimmed, url: editUrl.trim(), category: editCategory.trim(), region: editRegion.trim() } : p)));
    setEditingId(null);
  };

  const handleImportConfirm = (newRows) => {
    const additions = newRows.map((r) => ({ id: uid(), name: r.name, url: r.url, category: r.category, region: r.region }));
    savePages([...pages, ...additions]);
    showToast(`已匯入 ${additions.length} 家粉絲團`);
  };

  const categories = useMemo(() => [...new Set(pages.map((p) => p.category).filter(Boolean))].sort(), [pages]);
  const regions = useMemo(() => [...new Set(pages.map((p) => p.region).filter(Boolean))].sort(), [pages]);

  const hiddenCount = useMemo(() => pages.filter((p) => p.hidden).length, [pages]);

  const groupCounts = useMemo(() => {
    const mg = groupRecords[groupMonth] || {};
    const counts = { A: 0, B: 0, C: 0, none: 0 };
    pages.forEach((p) => {
      const g = mg[p.id] || "";
      if (g === "A" || g === "B" || g === "C") counts[g]++;
      else counts.none++;
    });
    return counts;
  }, [groupRecords, groupMonth, pages]);

  const filtered = pages.filter((p) => {
    const matchesQuery = p.name.includes(query) || (p.category || "").includes(query) || (p.region || "").includes(query);
    const matchesCategory = !filterCategory || p.category === filterCategory;
    const matchesRegion = !filterRegion || p.region === filterRegion;
    const currentGroup = groupRecords[groupMonth]?.[p.id] || "";
    const matchesGroup = !filterGroup ? true : filterGroup === "none" ? !currentGroup : currentGroup === filterGroup;
    return matchesQuery && matchesCategory && matchesRegion && matchesGroup;
  });
  const currentMonth = nowMonth();

  return (
    <div style={styles.viewWrap}>
      <Header
        title="粉絲團清單"
        subtitle={`目前追蹤 ${pages.length} 家粉絲團${hiddenCount > 0 ? `，其中 ${hiddenCount} 家已隱藏（不顯示於輸入/報表/趨勢）` : ""}`}
      >
        <button style={styles.secondaryBtn} onClick={() => setShowImport(true)}>
          <Icon name="download" size={16} />
          匯入 Excel
        </button>
      </Header>

      {pendingDeleteId && (
        <ConfirmDialog
          title="確認移除粉絲團"
          message={`確定要移除「${pages.find((p) => p.id === pendingDeleteId)?.name || ""}」嗎？這個粉絲團的歷史貼文與粉絲數紀錄會保留，但會從清單中消失，且這個動作無法復原。`}
          onConfirm={confirmDeletePage}
          onCancel={() => setPendingDeleteId(null)}
        />
      )}

      {showImport && (
        <ImportModal
          existingPages={pages}
          onClose={() => setShowImport(false)}
          onConfirm={handleImportConfirm}
        />
      )}

      <div style={styles.card}>
        <div className="fbm-form-grid" style={styles.formGrid}>
          <Field label="粉絲團名稱" style={{ gridColumn: "span 2" }}>
            <input
              ref={inputRef}
              style={styles.input}
              value={name}
              placeholder="例如：某某品牌官方粉絲團"
              onChange={(e) => setName(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addPage()}
            />
          </Field>
          <Field label="粉絲團網址" style={{ gridColumn: "span 2" }}>
            <input
              style={styles.input}
              value={url}
              placeholder="https://www.facebook.com/..."
              onChange={(e) => setUrl(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addPage()}
            />
          </Field>
          <Field label="法人/集團（選填）">
            <input
              style={styles.input}
              value={category}
              placeholder="例如：A"
              onChange={(e) => setCategory(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && addPage()}
            />
          </Field>
          <Field label="地區（選填）">
            <input

          </Field>
          <div style={{ display: "flex", alignItems: "flex-end" }}>

                          <input style={{ ...styles.input, fontSize: 12.5 }} value={editUrl} placeholder="粉絲團網址" onChange={(e) => setEditUrl(e.target.value)} />
                          <input style={{ ...styles.input, fontSize: 12.5 }} value={editCategory} placeholder="法人/集團（選填）" onChange={(e) => setEditCategory(e.target.value)} />
                          <input style={{ ...styles.input, fontSize: 12.5 }} value={editRegion} placeholder="地區（選填）" onChange={(e) => setEditRegion(e.target.value)} />
                        </div>
                      ) : (
                        <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                          {isHidden && <span style={{ fontSize: 10, background: "#DDD6C6", color: "#7A7568", padding: "1px 6px", borderRadius: 4, fontWeight: 600, flexShrink: 0 }}>隱藏中</span>}
                          <span style={{ fontWeight: 500 }}>{p.name}</span>
                          {p.url && (
                            <a href={p.url} target="_blank" rel="noreferrer" title={p.url}
                              style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 26, height: 26, borderRadius: 7, background: "#EBE6D9", color: "#8A9A8E", flexShrink: 0, textDecoration: "none" }}>
                              <Icon name="link" size={13} />
                            </a>
                          )}
                        </div>
                      )}
                    </td>
                    <td style={styles.td}>{editingId !== p.id && <span style={styles.tag}>{p.category || "—"}</span>}</td>
                    <td style={styles.td}>{editingId !== p.id && <span style={styles.tag}>{p.region || "—"}</span>}</td>
                    <td style={{ ...styles.td, textAlign: "center" }}>
                      {editingId !== p.id && (
                        <select style={{ padding: "5px 8px", borderRadius: 7, border: "1px solid #DDD6C6", background: "#fff", fontSize: 12.5, cursor: "pointer", fontWeight: group ? 600 : 400, color: groupColor }}
                          value={group} onChange={(e) => setGroupForPage(p.id, e.target.value)}>
                          <option value="">—</option>
                          <option value="A">A 組</option>
                          <option value="B">B 組</option>
                          <option value="C">C 組</option>
                        </select>
                      )}
                    </td>
                    <td style={{ ...styles.td, textAlign: "right", fontFamily: "'Space Grotesk', sans-serif" }}>
                      {latest ? latest.count.toLocaleString() : "—"}
                    </td>
                    <td style={{ ...styles.td, textAlign: "right", whiteSpace: "nowrap" }}>
                      {editingId === p.id ? (
                        <button style={{ ...styles.iconBtn, color: "#7B8F77" }} onClick={commitEdit} title="儲存"><Icon name="save" size={15} /></button>
                      ) : (
                        <>
                          <button style={styles.iconBtn} onClick={() => movePage(p.id, -1)} disabled={idx === 0} title="上移" aria-label="上移">▲</button>
                          <button style={styles.iconBtn} onClick={() => movePage(p.id, 1)} disabled={idx === filtered.length - 1} title="下移" aria-label="下移">▼</button>
                          <button style={{ ...styles.iconBtn, color: isHidden ? "#B08968" : "#7A7568" }} onClick={() => toggleHidden(p.id)} title={isHidden ? "取消隱藏" : "隱藏"}>
                            {isHidden ? "👁" : "🙈"}
                          </button>
                          <button style={styles.iconBtn} onClick={() => startEdit(p)} title="編輯"><Icon name="edit" size={15} /></button>
                          <button style={{ ...styles.iconBtn, color: "#C08081" }} onClick={() => requestDeletePage(p.id)} title="移除"><Icon name="trash" size={15} /></button>
                        </>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ============================================================ Input view ============================================================ */
function InputView({ pages, posts, savePosts, fanRecords, saveFanRecords, month, setMonth, showToast }) {
  const [tab, setTab] = useState("posts"); // posts | fans
  const [selectedPageId, setSelectedPageId] = useState(pages[0]?.id || "");
  const [draft, setDraft] = useState({ url: "", views: "", likes: "", comments: "", shares: "", source: "original", format: "image", star: false, tags: [], date: "" });
  const urlRef = useRef(null);

  // editing an existing post
  const [editingPostId, setEditingPostId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);

  // fan-count tab draft
  const [fanPageId, setFanPageId] = useState(pages[0]?.id || "");
  const [fanDate, setFanDate] = useState(todayStr());
  const [fanCount, setFanCount] = useState("");
  const fanInputRef = useRef(null);

  useEffect(() => {
    if (!selectedPageId && pages.length) setSelectedPageId(pages[0].id);
    if (!fanPageId && pages.length) setFanPageId(pages[0].id);
  }, [pages, selectedPageId, fanPageId]);

  useEffect(() => {
    if (!draft.date) setDraft((d) => ({ ...d, date: `${month}-01` }));
  }, [month]);

  const monthPosts = useMemo(
    () => posts.filter((p) => p.month === month && p.pageId === selectedPageId).slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.seq ?? 0) - (a.seq ?? 0)),
    [posts, month, selectedPageId]
  );

  const resetDraft = () => setDraft({ url: "", views: "", likes: "", comments: "", shares: "", source: draft.source, format: draft.format, star: false, tags: [], date: draft.date });

  const addPost = () => {
    if (!selectedPageId) {
      showToast("請先選擇粉絲團");
      return;
    }
    const views = Number(draft.views) || 0;
    const likes = Number(draft.likes) || 0;
    const comments = Number(draft.comments) || 0;
    const shares = Number(draft.shares) || 0;
    const entry = {
      id: uid(),
      pageId: selectedPageId,
      url: draft.url.trim(),
      views,
      likes,
      comments,
      shares,
      source: draft.source,
      format: draft.format,
      type: draft.format, // keep legacy type field in sync for charts/reports
      star: !!draft.star,
      tags: draft.tags || [],
      createdAt: Date.now(),
      seq: posts.length,
      date: draft.date || `${month}-01`,
      month,
    };
    savePosts([...posts, entry]);
    resetDraft();
    urlRef.current?.focus();
  };

  const removePost = (id) => savePosts(posts.filter((p) => p.id !== id));

  const [pendingDeletePostId, setPendingDeletePostId] = useState(null);
  const requestDeletePost = (id) => setPendingDeletePostId(id);
  const confirmDeletePost = () => {
    removePost(pendingDeletePostId);
    setPendingDeletePostId(null);
  };

  const startEditPost = (p) => {
    setEditingPostId(p.id);
    setEditDraft({
      url: p.url || "",
      views: p.views || "",
      likes: p.likes || "",
      comments: p.comments || "",
      shares: p.shares || "",
      source: p.source || "original",
      format: p.format || p.type || "image",
      star: !!p.star,
      tags: p.tags || [],
      date: p.date,
    });
  };

  const cancelEditPost = () => {
    setEditingPostId(null);
    setEditDraft(null);
  };

  const commitEditPost = () => {
    if (!editingPostId || !editDraft) return;
    const updated = {
      url: editDraft.url.trim(),
      views: Number(editDraft.views) || 0,
      likes: Number(editDraft.likes) || 0,
      comments: Number(editDraft.comments) || 0,
      shares: Number(editDraft.shares) || 0,
      source: editDraft.source,
      format: editDraft.format,
      type: editDraft.format,
      star: !!editDraft.star,
      tags: editDraft.tags || [],
      date: editDraft.date,
    };
    savePosts(posts.map((p) => (p.id === editingPostId ? { ...p, ...updated, month: updated.date.slice(0, 7) } : p)));
    showToast("已更新貼文數據");
    setEditingPostId(null);
    setEditDraft(null);
  };

  const fanEntriesThisMonth = useMemo(
    () => entriesInMonth(fanRecords, fanPageId, month),
    [fanRecords, fanPageId, month]
  );
  const totalFanEntriesThisMonth = useMemo(
    () => pages.reduce((sum, p) => sum + entriesInMonth(fanRecords, p.id, month).length, 0),
    [fanRecords, pages, month]
  );

  const addFanEntry = () => {
    if (!fanPageId) {
      showToast("請先選擇粉絲團");
      return;
    }
    if (fanCount === "" || isNaN(Number(fanCount))) {
      showToast("請輸入粉絲人數");
      return;
    }
    const entry = { id: uid(), date: fanDate || todayStr(), count: Number(fanCount) };
    const existing = fanRecords[fanPageId] || [];
    const next = { ...fanRecords, [fanPageId]: [...existing, entry] };
    saveFanRecords(next);
    setFanCount("");
    fanInputRef.current?.focus();
  };

  const removeFanEntry = (pageId, entryId) => {
    const next = { ...fanRecords, [pageId]: (fanRecords[pageId] || []).filter((e) => e.id !== entryId) };
    saveFanRecords(next);
  };

  const selectedPage = pages.find((p) => p.id === selectedPageId);
  const fanPage = pages.find((p) => p.id === fanPageId);

  return (
    <div style={styles.viewWrap}>
      <Header title="本月輸入" subtitle="記錄各粉絲團的貼文互動數與粉絲人數">
        <MonthSwitcher month={month} setMonth={setMonth} />
      </Header>

      {/* Edit Post Modal */}
      {editingPostId && editDraft && (

              <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                <Icon name="edit" size={17} />
                <span style={{ fontFamily: "'Noto Serif TC', serif", fontWeight: 700, fontSize: 17 }}>修改貼文紀錄</span>
              </div>
              <button style={styles.iconBtn} onClick={cancelEditPost}><Icon name="x" size={18} /></button>
            </div>
            <div style={styles.modalBody}>
              {/* Row 1: 日期 / 類型 / 形式 */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14, marginBottom: 14 }}>
                <Field label="日期">
                  <input type="date" style={styles.input} value={editDraft.date} onChange={(e) => setEditDraft({ ...editDraft, date: e.target.value })} />
                </Field>
                <Field label="類型">
                  <select style={styles.input} value={editDraft.source} onChange={(e) => setEditDraft({ ...editDraft, source: e.target.value })}>
                    {POST_SOURCES.map((t) => <option key={t.value} value={t.value}>{t.label}</option>)}
                  </select>
                </Field>
                <Field label="形式">
                  <select style={styles.input} value={editDraft.format} onChange={(e) => setEditDraft({ ...editDraft, format: e.target.value })}>
                    {POST_FORMATS.map((t) => <option key={t.value} value={t.value}>{t.label}</option>)}
                  </select>
                </Field>
              </div>
              {/* Row 2: 貼文連結 */}
              <Field label="貼文連結" style={{ marginBottom: 14 }}>
                <input style={styles.input} value={editDraft.url} placeholder="貼上貼文網址（選填）" onChange={(e) => setEditDraft({ ...editDraft, url: e.target.value })} />
              </Field>
              {/* Row 3: 內容 chips */}
              <Field label="內容（可複選）" style={{ marginBottom: 14 }}>
                <div style={{ display: "flex", gap: 7, flexWrap: "wrap", paddingTop: 2 }}>
                  {POST_CONTENT_TAGS.map((tag) => {
                    const active = (editDraft.tags || []).includes(tag);
                    return (
                      <button key={tag} type="button"
                        onClick={() => {
                          const curr = editDraft.tags || [];
                          setEditDraft({ ...editDraft, tags: active ? curr.filter((t) => t !== tag) : [...curr, tag] });
                        }}
                        style={{ padding: "5px 12px", borderRadius: 8, border: "1px solid", fontSize: 13, cursor: "pointer", fontFamily: "'Noto Sans TC', sans-serif", fontWeight: active ? 600 : 400, background: active ? "#8A9A8E" : "#fff", color: active ? "#fff" : "#7A7568", borderColor: active ? "#8A9A8E" : "#DDD6C6", whiteSpace: "nowrap", transition: "all 0.12s" }}

              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, marginBottom: 14 }}>

                  <input type="number" style={styles.input} value={editDraft.likes} onChange={(e) => setEditDraft({ ...editDraft, likes: e.target.value })} />

                <Field label="留言數">

              </button>
            </div>
          </div>
        </div>
      )}

      {pendingDeletePostId && (

function TypeTag({ type }) {
  const t = POST_TYPES.find((x) => x.value === type) || POST_TYPES[3];
  return (
    <span style={styles.typeTag}>
      <Icon name={t.icon} size={13} />
      {t.label}
    </span>
  );
}

function SourceTag({ source }) {
  const s = POST_SOURCES.find((x) => x.value === source);
  if (!s) return <span style={{ color: "#A6A096", fontSize: 12 }}>—</span>;
  const isRepost = source === "repost";
  return (
    <span style={{
      ...styles.typeTag,
      background: isRepost ? "#EDE4D6" : "#DDE5E2",
      color: isRepost ? "#8A5E3C" : "#3D6A63",
    }}>
      {s.label}
    </span>
  );
}

function FormatTag({ format }) {
  const formatColors = {
    image: { bg: "#E8EBF0", text: "#4A5A70" },
    video: { bg: "#EDE4D6", text: "#7A4A2A" },
    reels: { bg: "#E2DDE8", text: "#5A4070" },
    live:  { bg: "#F5E6E6", text: "#A04040" },
    other: { bg: "#EBE6D9", text: "#7A7568" },
    static: { bg: "#E8EBF0", text: "#4A5A70" },
    reel:   { bg: "#E2DDE8", text: "#5A4070" },
  };
  const f = POST_FORMATS.find((x) => x.value === format) || { label: format || "—" };
  const c = formatColors[format] || { bg: "#EBE6D9", text: "#7A7568" };
  return (
    <span style={{ ...styles.typeTag, background: c.bg, color: c.text }}>
      {f.label}
    </span>
  );
}

/* ============================================================ Report view ============================================================ */
function ReportView({ pages, posts, fanRecords, groupRecords, month, setMonth, showToast }) {
  const monthPosts = useMemo(() => posts.filter((p) => p.month === month), [posts, month]);
  const pageMap = useMemo(() => {
    const m = {};
    pages.forEach((p) => (m[p.id] = p));
    return m;
  }, [pages]);

  // Group assignment for the current month
  const monthGroups = useMemo(() => groupRecords[month] || {}, [groupRecords, month]);
  const getGroup = (pageId) => monthGroups[pageId] || "";

  // Pages filtered by group
  const pagesByGroup = useMemo(() => {
    const groups = { A: [], B: [], C: [], "": [] };
    pages.forEach((p) => {
      const g = monthGroups[p.id] || "";
      if (groups[g]) groups[g].push(p);
    });
    return groups;
  }, [pages, monthGroups]);

  const groupCounts = { A: pagesByGroup.A.length, B: pagesByGroup.B.length, C: pagesByGroup.C.length };
  const hasGroupData = Object.values(monthGroups).some((g) => g);

  // Active group tab: "" = all, "A"/"B"/"C"
  const [activeGroup, setActiveGroup] = useState("");

  const topLiked = useMemo(
    () => [...monthPosts].sort((a, b) => b.likes - a.likes).slice(0, 10),
    [monthPosts]
  );
  const topEngaged = useMemo(
    () => [...monthPosts].sort((a, b) => engagement(b) - engagement(a)).slice(0, 10),
    [monthPosts]
  );

  const fanGrowth = useMemo(() => {
    return pages
      .map((p) => {
        const entries = entriesInMonth(fanRecords, p.id, month)
          .sort((a, b) => (a.date || "").localeCompare(b.date || "") || ((a.seq ?? 0) - (b.seq ?? 0)));
        if (entries.length === 0) return null;
        const first = entries[0];
        const last = entries[entries.length - 1];
        const cur = last.count;
        const diff = entries.length > 1 ? last.count - first.count : null;
        const pct = diff != null && first.count > 0 ? (diff / first.count) * 100 : null;
        return { page: p, cur, curDate: last.date, firstDate: first.date, firstCount: first.count, diff, pct, group: getGroup(p.id) };
      })
      .filter((r) => r !== null)
      .sort((a, b) => (b.diff ?? -Infinity) - (a.diff ?? -Infinity));
  }, [pages, fanRecords, month, monthGroups]);

  // Fan growth filtered by active group
  const fanGrowthFiltered = useMemo(() =>
    activeGroup ? fanGrowth.filter((r) => r.group === activeGroup) : fanGrowth,
    [fanGrowth, activeGroup]
  );

  // Posts filtered by active group
  const monthPostsFiltered = useMemo(() => {
    if (!activeGroup) return monthPosts;
    const groupPageIds = new Set(pagesByGroup[activeGroup]?.map((p) => p.id) || []);
    return monthPosts.filter((p) => groupPageIds.has(p.pageId));
  }, [monthPosts, activeGroup, pagesByGroup]);

  // 點子王 posts filtered by active group
  const starPostsFiltered = useMemo(() =>
    monthPostsFiltered.filter((p) => p.star),
    [monthPostsFiltered]
  );

  // All posts for this group sorted by engagement (no limit)
  const postsEngagedFiltered = useMemo(
    () => [...monthPostsFiltered].sort((a, b) => engagement(b) - engagement(a)),
    [monthPostsFiltered]
  );

  const totals = useMemo(() => {
    const totalFans = fanGrowth.reduce((s, r) => s + (r.cur || 0), 0);
    const totalGrowth = fanGrowth.reduce((s, r) => s + (r.diff || 0), 0);
    return { totalFans, totalGrowth, postCount: monthPosts.length };
  }, [fanGrowth, monthPosts]);

  // Per-page content tag distribution for the content analysis table
  const contentDist = useMemo(() => {
    return pages.map((p) => {
      const pagePosts = monthPosts.filter((post) => post.pageId === p.id);
      const tagCounts = {};
      POST_CONTENT_TAGS.forEach((t) => { tagCounts[t] = 0; });
      let untagged = 0;
      pagePosts.forEach((post) => {
        const tags = post.tags || [];
        if (tags.length === 0) { untagged++; } else { tags.forEach((t) => { if (tagCounts[t] != null) tagCounts[t]++; }); }
      });
      return { page: p, total: pagePosts.length, tagCounts, untagged, group: getGroup(p.id) };
    }).filter((r) => r.total > 0);
  }, [pages, monthPosts, monthGroups]);

  /* ---------------- AI analysis prompt generator ---------------- */
  const [promptPageIds, setPromptPageIds] = useState([]);
  const [promptQuery, setPromptQuery] = useState("");
  const [generatedPrompt, setGeneratedPrompt] = useState("");
  const [copied, setCopied] = useState(false);

  const promptFilteredPages = useMemo(() => {
    const q = promptQuery.trim();
    if (!q) return pages;
    return pages.filter((p) => p.name.includes(q) || (p.category || "").includes(q) || (p.region || "").includes(q));
  }, [pages, promptQuery]);

  const togglePromptPage = (id) => {
    setPromptPageIds((ids) => (ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id]));
  };

  const buildPrompt = () => {
    const targetPages = promptPageIds.length > 0 ? pages.filter((p) => promptPageIds.includes(p.id)) : pages;
    const targetIds = new Set(targetPages.map((p) => p.id));
    const relevantPosts = monthPosts.filter((p) => targetIds.has(p.pageId));

    if (relevantPosts.length === 0) {
      showToast("所選範圍內這個月沒有貼文資料，無法產生分析提示詞");
      return;
    }

    const lines = [];
    lines.push(`你是一位社群媒體經營顧問，請根據以下 ${monthLabel(month)} 的 Facebook 粉絲團貼文數據，分析這個月的貼文表現。`);
    lines.push("");
    lines.push(`分析對象：${targetPages.map((p) => p.name).join("、")}`);
    lines.push(`資料範圍：${monthLabel(month)}，共 ${relevantPosts.length} 篇貼文`);
    lines.push("");
    lines.push("請特別分析：");
    lines.push("1. 哪一種貼文類型（靜態貼文／影片／Reels／其他）整體互動率（讚+留言+分享）或觀看數表現最好？");
    lines.push("2. 表現最好的前幾篇貼文有什麼共同特徵（例如內容主題、發文時間、貼文類型）？推測可能的原因。");
    lines.push("3. 如果同時有觀看數與互動數資料，請比較「高觀看但低互動」與「高互動」的貼文差異，並說明可能原因。");
    lines.push("4. 若我有提供貼文連結，請你假設能讀取該連結的網友留言內容，分析留言的情緒傾向（正面/負面/中性）與常見討論主題，並說明這些留言對品牌經營的意義；若無法直接讀取網址內容，請提醒我這點限制。");
    lines.push("5. 給予下個月內容企劃的具體建議（例如該增加哪種類型的貼文、發文時間或主題方向）。");
    lines.push("");
    lines.push("=== 原始貼文資料 ===");
    lines.push("（互動總計 = 讚+留言+分享；觀看數僅影片/Reels類型才有，且未計入互動總計，僅供參考）");
    lines.push("");

    targetPages.forEach((page) => {
      const pagePosts = relevantPosts.filter((p) => p.pageId === page.id).sort((a, b) => (a.date || "").localeCompare(b.date || "") || ((a.seq ?? 0) - (b.seq ?? 0)));
      if (pagePosts.length === 0) return;
      lines.push(`【${page.name}】（共 ${pagePosts.length} 篇）`);
      pagePosts.forEach((p, i) => {
        const sourceLabel = POST_SOURCES.find((t) => t.value === p.source)?.label || "";
        const formatLabel = POST_FORMATS.find((t) => t.value === (p.format || p.type))?.label || (p.format || p.type || "");
        const parts = [
          `${i + 1}. 日期:${p.date}`,
          sourceLabel && `類型:${sourceLabel}`,
          formatLabel && `形式:${formatLabel}`,
          `讚:${p.likes}`,
          `留言:${p.comments}`,
          `分享:${p.shares}`,
          `互動總計:${engagement(p)}`,
        ];
        if (p.views) parts.push(`觀看數:${p.views}（僅供參考）`);
        if (p.url) parts.push(`連結:${p.url}`);
        lines.push("   " + parts.filter(Boolean).join("，"));
      });
      lines.push("");
    });

    setGeneratedPrompt(lines.join("\n"));
    setCopied(false);
  };

  const copyPrompt = async () => {
    try {
      await navigator.clipboard.writeText(generatedPrompt);
      setCopied(true);
      showToast("已複製到剪貼簿");
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      showToast("複製失敗，請手動選取文字複製");
    }
  };

  const exportExcel = useCallback(async () => {
    showToast("匯出中…");
    try {
      const wb = XLSX.utils.book_new();

      // Helper: fan growth row
      const toGrowthRow = (r) => ({
        粉絲團: r.page.name,
        競賽組別: r.group || "未參加",
        粉絲團網址: r.page.url || "",
        法人集團: r.page.category || "",
        地區: r.page.region || "",
        最新粉絲數: r.cur ?? "",
        最新量測日期: r.curDate ?? "",
        最舊粉絲數: r.firstCount ?? "",
        最舊量測日期: r.firstDate ?? "",
        增減人數: r.diff != null ? r.diff : "僅一筆",
        增減百分比: r.pct != null ? `${r.pct.toFixed(2)}%` : "",
        本月發文篇數: monthPosts.filter((p) => p.pageId === r.page.id).length || 0,
      });

      // Helper: post row
      const toPostRow = (p, i) => ({
        排名: i + 1,
        點子王: p.star ? "⭐" : "",
        粉絲團: pageMap[p.pageId]?.name || "",
        競賽組別: getGroup(p.pageId) || "未參加",
        粉絲團網址: pageMap[p.pageId]?.url || "",
        法人集團: pageMap[p.pageId]?.category || "",
        地區: pageMap[p.pageId]?.region || "",
        日期: p.date,
        類型: POST_SOURCES.find((t) => t.value === p.source)?.label || (p.source || ""),
        形式: POST_FORMATS.find((t) => t.value === (p.format || p.type))?.label || (p.format || p.type || ""),
        內容標籤: (p.tags || []).join("、"),
        讚數: p.likes,
        留言數: p.comments,
        分享數: p.shares,
        互動總計: engagement(p),
        觀看數僅供參考: p.views || "",
        貼文連結: p.url,
      });

      // Sheet 1: 全體粉絲成長排名（含組別欄）
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fanGrowth.map(toGrowthRow)), "粉絲成長排名_全體");

      // Sheets 2-4: A/B/C 分組粉絲成長
      ["A", "B", "C"].forEach((g) => {
        const rows = fanGrowth.filter((r) => r.group === g).map(toGrowthRow);
        if (rows.length > 0)
          XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), `粉絲成長排名_${g}組`);
      });

      // Sheet 5: 全體貼文互動排名（含組別欄，全部排序不限10）
      const allPostsEngaged = [...monthPosts].sort((a, b) => engagement(b) - engagement(a));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allPostsEngaged.map(toPostRow)), "互動排名_全體");

      // Sheets 6-8: A/B/C 分組貼文互動排名（全部）
      ["A", "B", "C"].forEach((g) => {
        const groupPageIds = new Set(pagesByGroup[g]?.map((p) => p.id) || []);
        const rows = [...monthPosts]
          .filter((p) => groupPageIds.has(p.pageId))
          .sort((a, b) => engagement(b) - engagement(a))
          .map(toPostRow);
        if (rows.length > 0)
          XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), `互動排名_${g}組`);
      });

      // Sheet 9: 全部貼文紀錄
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(monthPosts.map((p, i) => toPostRow(p, i))), "全部貼文紀錄");

      XLSX.writeFile(wb, `粉絲團月報表_${month}.xlsx`);
      showToast("已匯出 Excel");
    } catch (e) {
      console.error(e);
      showToast("匯出失敗，請稍後再試");
    }
  }, [fanGrowth, monthPosts, pageMap, pagesByGroup, month, showToast, monthGroups]);

  return (
    <div style={styles.viewWrap}>
      <Header title="月報表" subtitle="當月各項監測指標總覽">
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>

      {!hasGroupData && (

function PageNameCell({ page }) {
  if (!page) return <span>（已移除）</span>;
  if (!page.url) return <span style={{ fontWeight: 500 }}>{page.name}</span>;
  return (
    <a href={page.url} target="_blank" rel="noreferrer" style={{ ...styles.link, color: "#3A3A38", fontWeight: 500, textDecoration: "none" }}>
      {page.name}
      <Icon name="link" size={12} className="" />
    </a>
  );
}

function PostRankTable({ posts, pageMap, metric, metricLabel, showGroup, getGroup, collapsible }) {
  const [expanded, setExpanded] = useState(false);
  const groupColors = { A: "#3D6A63", B: "#8A5E3C", C: "#5E4A7A" };
  const groupBgs = { A: "#DDE5E2", B: "#EDE4D6", C: "#E2DDE8" };

  if (posts.length === 0) {
    return (
      <div style={{ ...styles.card, padding: 0, overflow: "hidden" }}>
        <EmptyState text="本月還沒有貼文紀錄。" />
      </div>
    );
  }

  const COLLAPSE_THRESHOLD = 10;
  const canCollapse = collapsible && posts.length > COLLAPSE_THRESHOLD;
  const visiblePosts = canCollapse && !expanded ? posts.slice(0, COLLAPSE_THRESHOLD) : posts;
  return (
    <div style={{ ...styles.card, padding: 0, overflow: "hidden" }}>
      <table style={styles.table}>
        <thead>
          <tr>
            <th style={styles.th}>排名</th>
            <th style={styles.th}>粉絲團</th>
            {showGroup && <th style={{ ...styles.th, textAlign: "center", width: 72 }}>組別</th>}
            <th style={styles.th}>日期</th>
            <th style={styles.th}>類型</th>
            <th style={styles.th}>形式</th>
            <th style={styles.th}>連結</th>
            <th style={{ ...styles.th, textAlign: "right" }}>讚</th>
            <th style={{ ...styles.th, textAlign: "right" }}>留言</th>
            <th style={{ ...styles.th, textAlign: "right" }}>分享</th>
            <th style={{ ...styles.th, textAlign: "right" }}>觀看數<br /><span style={styles.thSubLabel}>僅供參考</span></th>
            <th style={{ ...styles.th, textAlign: "right" }}>{metricLabel}<br /><span style={styles.thSubLabel}>讚+留言+分享</span></th>
          </tr>
        </thead>
        <tbody>
          {visiblePosts.map((p, i) => {
            const g = getGroup ? getGroup(p.pageId) : "";
            return (
              <tr key={p.id} style={styles.tr}>
                <td style={styles.td}>{i === 0 ? <Icon name="crown" size={15} /> : i + 1}</td>
                <td style={styles.td}>
                  <PageNameCell page={pageMap[p.pageId]} />
                </td>
                {showGroup && (
                  <td style={{ ...styles.td, textAlign: "center" }}>
                    {g ? (
                      <span style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 24, height: 24, borderRadius: 6, background: groupBgs[g], color: groupColors[g], fontSize: 11, fontWeight: 700 }}>{g}</span>
                    ) : <span style={{ color: "#D0CAC0" }}>—</span>}
                  </td>
                )}
                <td style={styles.td}>{p.date}</td>
                <td style={styles.td}><SourceTag source={p.source} /></td>
                <td style={styles.td}><FormatTag format={p.format || p.type} /></td>
                <td style={styles.td}>
                  {p.url ? (
                    <a href={p.url} target="_blank" rel="noreferrer" style={styles.link}>
                      <Icon name="link" size={13} /> 查看
                    </a>
                  ) : (
                    <span style={{ color: "#A6A096" }}>—</span>
                  )}
                </td>
                <td style={{ ...styles.td, textAlign: "right", fontFamily: "'Space Grotesk', sans-serif" }}>{p.likes}</td>
                <td style={{ ...styles.td, textAlign: "right", fontFamily: "'Space Grotesk', sans-serif" }}>{p.comments}</td>
                <td style={{ ...styles.td, textAlign: "right", fontFamily: "'Space Grotesk', sans-serif" }}>{p.shares}</td>
                <td style={{ ...styles.td, textAlign: "right", fontFamily: "'Space Grotesk', sans-serif", color: p.views ? "#A18A4C" : "#A6A096", fontWeight: p.views ? 600 : 400 }}>
                  {p.views ? p.views.toLocaleString() : "—"}
                </td>
                <td style={{ ...styles.td, textAlign: "right", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600 }}>
                  {typeof metric === "function" ? metric(p) : p[metric]}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      {canCollapse && (
        <button
          onClick={() => setExpanded((v) => !v)}
          style={{
            width: "100%", padding: "11px", border: "none", background: "#F3F0EA",
            borderTop: "1px solid #E6E1D6", cursor: "pointer", fontSize: 13,
            color: "#7A7568", fontFamily: "'Noto Sans TC', sans-serif",
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
          }}
        >
          {expanded
            ? `▲ 收合（只顯示前 ${COLLAPSE_THRESHOLD} 筆）`
            : `▼ 展開全部（還有 ${posts.length - COLLAPSE_THRESHOLD} 筆，共 ${posts.length} 篇）`}
        </button>
      )}
    </div>
  );
}

/* ---------------- Reusable line chart with PNG export ---------------- */
const CHART_PALETTE = ["#8A9A8E", "#B08968", "#5C6B73", "#C08081", "#A18A68", "#7B8F77", "#9A8AA6", "#6E8A9A"];

function downloadSvgAsPng(svgEl, filename, title) {
  const serializer = new XMLSerializer();
  const svgString = serializer.serializeToString(svgEl);
  const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  const scale = 2; // export at 2x for sharper image

  const svgW = svgEl.width?.baseVal?.value || svgEl.getBoundingClientRect().width;
  const svgH = svgEl.height?.baseVal?.value || svgEl.getBoundingClientRect().height;

  // Reserve space at the top for the title if provided
  const titleH = title ? 44 : 0;
  const titleFontSize = 14;

  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = svgW * scale;
    canvas.height = (svgH + titleH) * scale;
    const ctx = canvas.getContext("2d");

    // Background
    ctx.fillStyle = "#FBF9F4";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.scale(scale, scale);

    // Draw title
    if (title) {
      ctx.fillStyle = "#3A3A38";
      ctx.font = `600 ${titleFontSize}px 'Noto Sans TC', 'PingFang TC', sans-serif`;
      ctx.fillText(title, 18, 28);
      // Thin separator line
      ctx.strokeStyle = "#E6E1D6";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, titleH - 6);
      ctx.lineTo(svgW, titleH - 6);
      ctx.stroke();
    }

    // Draw chart SVG below title
    ctx.drawImage(img, 0, titleH);
    URL.revokeObjectURL(url);

    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }, "image/png");
  };
  img.src = url;
}

function formatChartNum(v) {
  if (v == null) return "";
  if (v >= 100000) return (v / 10000).toFixed(1) + "萬";
  return v.toLocaleString();
}

function LineChartCard({ title, months, series, onDownloadName, unit }) {
  const svgRef = useRef(null);
  const maxVal = useMemo(() => {
    let max = 0;
    series.forEach((s) => s.points.forEach((v) => { if (typeof v === "number" && v > max) max = v; }));
    return max || 1;
  }, [series]);

  const leftMargin = 64;
  const width = Math.max(months.length * 100 + leftMargin, 480);
  const height = 300;
  const chartTop = 24;
  const chartBottom = 230;
  const chartH = chartBottom - chartTop;

  const yTicks = [0, 0.25, 0.5, 0.75, 1];

  return (
    <div style={styles.card}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: "#7A7568", fontWeight: 500 }}>{title}{unit ? `（單位：${unit}）` : ""}</div>
        <button
          style={styles.secondaryBtn}
          onClick={() => svgRef.current && downloadSvgAsPng(svgRef.current, onDownloadName, `${title}${unit ? `（單位：${unit}）` : ""}`)}
          disabled={series.length === 0}
        >
          <Icon name="download" size={15} />
          下載圖表
        </button>
      </div>
      {series.length === 0 ? (
        <EmptyState text="請先在上方選擇至少一家粉絲團。" />
      ) : (
        <div style={{ overflowX: "auto" }}>
          <svg ref={svgRef} width={width} height={height} style={{ display: "block", background: "#FBF9F4" }}>
            {yTicks.map((t, i) => {
              const y = chartBottom - t * chartH;
              const val = Math.round(maxVal * t);
              return (
                <g key={i}>
                  <line x1={leftMargin} x2={width} y1={y} y2={y} stroke="#E6E1D6" strokeWidth={1} />
                  <text x={leftMargin - 10} y={y + 4} textAnchor="end" fontSize={11} fill="#9C9684" fontFamily="'Space Grotesk', sans-serif">
                    {formatChartNum(val)}
                  </text>
                </g>
              );
            })}
            {series.map((s) => {
              const points = months.map((m, i) => {
                const v = s.points[i];
                const x = leftMargin + 50 + i * 100;
                const y = typeof v === "number" ? chartBottom - (v / maxVal) * chartH : null;
                return { x, y, v };
              });
              const validPoints = points.filter((p) => p.y != null);
              const path = validPoints.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
              return (
                <g key={s.id}>
                  <path d={path} fill="none" stroke={s.color} strokeWidth={2} />
                  {validPoints.map((p, i) => (
                    <g key={i}>
                      <circle cx={p.x} cy={p.y} r={3.5} fill={s.color} />
                      <text x={p.x} y={p.y - 9} textAnchor="middle" fontSize={10.5} fill={s.color} fontWeight={600} fontFamily="'Space Grotesk', sans-serif">
                        {formatChartNum(p.v)}
                      </text>
                    </g>
                  ))}
                </g>
              );
            })}
            {months.map((m, i) => (
              <text key={m} x={leftMargin + 50 + i * 100} y={chartBottom + 24} textAnchor="middle" fontSize={11} fill="#7A7568" fontFamily="'Space Grotesk', sans-serif">
                {m}
              </text>
            ))}
          </svg>
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 12 }}>
            {series.map((s) => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12 }}>
                <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, display: "inline-block" }} />
                {s.label}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- Horizontal bar chart (ranking) with PNG export ---------------- */
function BarChartCard({ title, items, onDownloadName, unit, allowNegative }) {
  const svgRef = useRef(null);
  const absMax = Math.max(...items.map((it) => Math.abs(it.value)), 1);

  const leftMargin = 220;
  const rightMargin = allowNegative ? 140 : 100;
  const rowHeight = allowNegative ? 42 : 34;
  const width = 820;
  const height = items.length * rowHeight + 30;
  const barAreaWidth = width - leftMargin - rightMargin;
  // For charts with negative values, zero line sits at the centre of the bar area
  const zeroX = allowNegative ? leftMargin + barAreaWidth / 2 : leftMargin;

  return (
    <div style={styles.card}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: "#7A7568", fontWeight: 500 }}>{title}{unit ? `（單位：${unit}）` : ""}</div>
        <button
          style={styles.secondaryBtn}
          onClick={() => svgRef.current && downloadSvgAsPng(svgRef.current, onDownloadName, `${title}${unit ? `（單位：${unit}）` : ""}`)}
          disabled={items.length === 0}
        >
          <Icon name="download" size={15} />
          下載圖表
        </button>
      </div>
      {items.length === 0 ? (
        <EmptyState text="目前選定範圍內還沒有資料。" />
      ) : (
        <div style={{ overflowX: "auto" }}>
          <svg ref={svgRef} width={width} height={height} style={{ display: "block", background: "#FBF9F4" }}>
            {allowNegative && (
              <line x1={zeroX} x2={zeroX} y1={0} y2={height} stroke="#DDD6C6" strokeWidth={1} strokeDasharray="4 3" />
            )}
            {items.map((it, i) => {
              const y = 12 + i * rowHeight;
              const isNeg = it.value < 0;
              const barW = (Math.abs(it.value) / absMax) * (allowNegative ? barAreaWidth / 2 : barAreaWidth);
              const barX = allowNegative ? (isNeg ? zeroX - barW : zeroX) : leftMargin;
              const color = allowNegative
                ? (isNeg ? "#C08081" : it.value === 0 ? "#D8D2C4" : i === 0 ? "#B08968" : "#8A9A8E")
                : (i === 0 ? "#B08968" : "#8A9A8E");
              const labelX = allowNegative
                ? (isNeg ? zeroX - barW - 6 : zeroX + barW + 6)
                : leftMargin + barW + 8;
              const labelAnchor = allowNegative && isNeg ? "end" : "start";
              const valueStr = allowNegative && it.value > 0 ? `+${formatChartNum(it.value)}` : formatChartNum(it.value);
              return (
                <g key={it.id}>
                  <text x={leftMargin - 12} y={y + rowHeight / 2 - (it.subLabel ? 6 : 0)} textAnchor="end" fontSize={12} fill="#3A3A38">
                    {it.label.length > 16 ? it.label.slice(0, 16) + "…" : it.label}
                  </text>
                  {it.subLabel && (
                    <text x={leftMargin - 12} y={y + rowHeight / 2 + 10} textAnchor="end" fontSize={10} fill="#A6A096">
                      {it.subLabel}
                    </text>
                  )}
                  <rect x={barX} y={y + 6} width={Math.max(barW, 2)} height={rowHeight - 16} rx={4} fill={color} />
                  <text x={labelX} y={y + rowHeight / 2 + 4} textAnchor={labelAnchor} fontSize={12} fill={isNeg ? "#C08081" : "#5C5847"} fontWeight={600} fontFamily="'Space Grotesk', sans-serif">
                    {valueStr}
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      )}
    </div>
  );
}

function TrendView({ pages, fanRecords, posts, groupRecords }) {
  const allMonths = useMemo(() => {
    const set = new Set(posts.map((p) => p.month));
    Object.values(fanRecords).forEach((entries) => {
      (entries || []).forEach((e) => set.add((e.date || "").slice(0, 7)));
    });
    set.delete("");
    return [...set].sort();
  }, [fanRecords, posts]);

  const [rangeStart, setRangeStart] = useState("");
  const [rangeEnd, setRangeEnd] = useState("");

  useEffect(() => {
    if (allMonths.length > 0) {
      if (!rangeStart) setRangeStart(allMonths[0]);
      if (!rangeEnd) setRangeEnd(allMonths[allMonths.length - 1]);
    }
  }, [allMonths]);

  const months = useMemo(() => {
    if (!rangeStart || !rangeEnd) return allMonths;
    return allMonths.filter((m) => m >= rangeStart && m <= rangeEnd);
  }, [allMonths, rangeStart, rangeEnd]);

  const [selectedIds, setSelectedIds] = useState(() => pages.slice(0, 5).map((p) => p.id));
  const [postMetric, setPostMetric] = useState("views");
  const [pickerQuery, setPickerQuery] = useState("");
  const [activeGroupFilter, setActiveGroupFilter] = useState(""); // "" | "A" | "B" | "C"

  // User explicitly picks which month's group assignments to use for the quick-filter
  // (independent of the chart date range — you may want to compare trends but filter by this month's groups)
  const [groupRefMonth, setGroupRefMonth] = useState(nowMonth);

  // Months that have any group assignments set — used to populate the group-ref-month picker
  const monthsWithGroupData = useMemo(() => {
    const months = Object.keys(groupRecords).filter((m) => {
      const mg = groupRecords[m] || {};
      return Object.values(mg).some((g) => g);
    });
    return months.sort();
  }, [groupRecords]);

  // IDs of pages belonging to a given group in the reference month
  const pageIdsInGroup = useCallback((group) => {
    if (!group || !groupRefMonth) return pages.map((p) => p.id);
    const monthGroups = groupRecords[groupRefMonth] || {};
    return pages.filter((p) => monthGroups[p.id] === group).map((p) => p.id);
  }, [pages, groupRecords, groupRefMonth]);

  // Whether any group assignments exist for the reference month
  const hasGroupData = useMemo(() => {
    if (!groupRefMonth) return false;
    const mg = groupRecords[groupRefMonth] || {};
    return Object.values(mg).some((g) => g);
  }, [groupRecords, groupRefMonth]);

  // Group counts for the reference month
  const groupCounts = useMemo(() => {
    const mg = groupRecords[groupRefMonth] || {};
    const counts = { A: 0, B: 0, C: 0 };
    Object.values(mg).forEach((g) => { if (counts[g] !== undefined) counts[g]++; });
    return counts;
  }, [groupRecords, groupRefMonth]);

  const applyGroupFilter = (group) => {
    setActiveGroupFilter(group);
    if (!group) return; // keep current selection when clearing filter
    setSelectedIds(pageIdsInGroup(group));
  };

  useEffect(() => {
    setSelectedIds((ids) => ids.filter((id) => pages.some((p) => p.id === id)));
  }, [pages]);

  const toggle = (id) => {
    setSelectedIds((ids) => (ids.includes(id) ? ids.filter((x) => x !== id) : [...ids, id]));
  };

  const filteredPageOptions = useMemo(() => {
    const q = pickerQuery.trim();
    if (!q) return pages;
    return pages.filter((p) => p.name.includes(q) || (p.category || "").includes(q) || (p.region || "").includes(q));
  }, [pages, pickerQuery]);

  const fanValueFor = useCallback((pageId, m) => {
    const entry = latestInMonth(fanRecords, pageId, m);
    return entry ? entry.count : null;
  }, [fanRecords]);

  const fanSeries = useMemo(() => {
    return selectedIds.map((id, i) => {
      const page = pages.find((p) => p.id === id);
      return {
        id,
        label: page?.name || "（已移除）",
        color: CHART_PALETTE[i % CHART_PALETTE.length],
        points: months.map((m) => fanValueFor(id, m)),
      };
    });
  }, [selectedIds, pages, months, fanValueFor]);

  // sum of the selected metric, per page per month, within the selected date range
  const postSeries = useMemo(() => {
    return selectedIds.map((id, i) => {
      const page = pages.find((p) => p.id === id);
      return {
        id,
        label: page?.name || "（已移除）",
        color: CHART_PALETTE[i % CHART_PALETTE.length],
        points: months.map((m) => {
          const relevant = posts.filter((p) => p.pageId === id && p.month === m);
          if (relevant.length === 0) return null;
          if (postMetric === "postCount") return relevant.length;
          if (postMetric === "engagement") return relevant.reduce((sum, p) => sum + engagement(p), 0);
          return relevant.reduce((sum, p) => sum + (Number(p[postMetric]) || 0), 0);
        }),
      };
    });
  }, [selectedIds, pages, months, posts, postMetric]);

  // When the selected range covers exactly one month, show a per-dealer bar chart instead of a line chart
  // (a trend line across a single point isn't meaningful — a ranking bar chart is more useful).
  const singleMonth = months.length === 1;

  const fanBarItems = useMemo(() => {
    if (!singleMonth) return [];
    return fanSeries
      .filter((s) => typeof s.points[0] === "number")
      .map((s) => ({ id: s.id, label: s.label, value: s.points[0] }))
      .sort((a, b) => b.value - a.value);
  }, [fanSeries, singleMonth]);

  const postBarItems = useMemo(() => {
    if (!singleMonth) return [];
    return postSeries
      .filter((s) => typeof s.points[0] === "number")
      .map((s) => ({ id: s.id, label: s.label, value: s.points[0] }))
      .sort((a, b) => b.value - a.value);
  }, [postSeries, singleMonth]);

  //粉絲成長數圖表：選定區間內，每家粉絲團「最新一筆 - 最舊一筆」的淨增長
  // 適用於單月（7/1-7/31）或跨月（6/1-7/31）兩種情況
  const fanGrowthItems = useMemo(() => {
    if (months.length === 0 || !rangeStart || !rangeEnd) return [];
    const rangeStartDate = `${rangeStart}-01`;
    // rangeEnd last day: just compare by YYYY-MM prefix
    return selectedIds.map((id) => {
      const page = pages.find((p) => p.id === id);
      // All entries within the selected month range
      const allEntries = (fanRecords[id] || [])
        .filter((e) => {
          const m = (e.date || "").slice(0, 7);
          return m >= rangeStart && m <= rangeEnd;
        })
        .sort((a, b) => (a.date || "").localeCompare(b.date || "") || ((a.seq ?? 0) - (b.seq ?? 0)));
      if (allEntries.length < 1) return null;
      const oldest = allEntries[0].count;
      const newest = allEntries[allEntries.length - 1].count;
      const growth = newest - oldest;
      return {
        id,
        label: page?.name || "（已移除）",
        value: growth,
        oldest,
        newest,
      };
    })
      .filter((x) => x !== null)
      .sort((a, b) => b.value - a.value);
  }, [selectedIds, pages, fanRecords, months, rangeStart, rangeEnd]);

  // Top 10 most-engaged posts for the range's end month (mirrors 月報表's monthly TOP10), across all pages
  const topEngagedMonth = rangeEnd || (allMonths.length ? allMonths[allMonths.length - 1] : "");
  const top10Engaged = useMemo(() => {
    const pageMap = {};
    pages.forEach((p) => (pageMap[p.id] = p));
    return posts
      .filter((p) => p.month === topEngagedMonth)
      .map((p) => ({
        id: p.id,
        label: `${pageMap[p.pageId]?.name || "（已移除）"} · ${p.date?.slice(5) || ""}`,
        value: engagement(p),
      }))
      .sort((a, b) => b.value - a.value)
      .slice(0, 10);
  }, [posts, pages, topEngagedMonth]);

  return (
    <div style={styles.viewWrap}>
      <Header title="趨勢總覽" subtitle="跨月份比較粉絲人數與貼文數據變化" />

      {pages.length === 0 ? (
        <div style={styles.card}><EmptyState text="尚無粉絲團，請先新增。" /></div>
      ) : allMonths.length === 0 ? (
        <div style={styles.card}><EmptyState text="尚無任何月份的資料，先到「本月輸入」記錄看看。" /></div>
      ) : (
        <>
          <div style={styles.card}>
            <div className="fbm-form-grid" style={{ ...styles.formGrid, gridTemplateColumns: "1fr 1fr 2fr" }}>
              <Field label="起始月份">
                <select style={styles.input} value={rangeStart} onChange={(e) => setRangeStart(e.target.value)}>
                  {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
                </select>
              </Field>
              <Field label="結束月份">
                <select style={styles.input} value={rangeEnd} onChange={(e) => setRangeEnd(e.target.value)}>
                  {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
                </select>
              </Field>
              <div style={{ display: "flex", alignItems: "flex-end" }}>
                <div style={{ fontSize: 12.5, color: "#9C9684" }}>
                  目前顯示範圍：{months.length > 0 ? `${monthLabel(months[0])} ～ ${monthLabel(months[months.length - 1])}（共 ${months.length} 個月）` : "無資料"}
                </div>
              </div>
            </div>
          </div>

          <div style={styles.card}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 10 }}>
              <div style={{ fontSize: 13, color: "#7A7568" }}>
                選擇要比較的粉絲團（可複選，已選 {selectedIds.length} / {pages.length} 家）
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button style={styles.secondaryBtn} onClick={() => setSelectedIds(filteredPageOptions.map((p) => p.id))}>全選</button>
                <button style={styles.secondaryBtn} onClick={() => setSelectedIds([])}>全取消</button>
              </div>

            <div style={{ marginBottom: 14, padding: "12px 14px", background: "#F3F0EA", borderRadius: 10 }}>
              <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: hasGroupData ? 10 : 0 }}>
                <div style={{ ...styles.filterLabel, marginBottom: 0 }}>依競賽組別快速選取</div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
