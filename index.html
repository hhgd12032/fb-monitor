          <BarChartCard
            title={`粉絲成長數排名（${rangeStart === rangeEnd ? monthLabel(rangeStart) : `${monthLabel(rangeStart)} ～ ${monthLabel(rangeEnd)}`}，區間最新 − 最舊）`}
            items={fanGrowthItems.map((it) => ({
              ...it,
              subLabel: it.oldest != null && it.newest != null
                ? `${it.oldest.toLocaleString()} → ${it.newest.toLocaleString()} 人`
                : "",
            }))}
            onDownloadName={`粉絲成長數_${rangeStart}_${rangeEnd}.png`}
            unit="人"
            allowNegative
          />

          <div style={styles.card}>
            <div style={styles.filterLabel}>貼文數據指標</div>
            <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
              {POST_METRICS.map((m) => (
                <button
                  key={m.value}
                  style={{ ...styles.chipBtn, ...(postMetric === m.value ? styles.chipBtnActive : {}) }}
                  onClick={() => setPostMetric(m.value)}
                >
                  {m.label}
                </button>
              ))}
            </div>
          </div>

          {singleMonth ? (
            <BarChartCard
              title={`貼文${POST_METRICS.find((m) => m.value === postMetric)?.label}（${months[0] ? monthLabel(months[0]) : "—"}，依粉絲團排名）`}
              items={postBarItems}
              onDownloadName={`貼文${POST_METRICS.find((m) => m.value === postMetric)?.label}_${months[0]}.png`}
              unit={POST_METRICS.find((m) => m.value === postMetric)?.unit}
            />
          ) : (
            <LineChartCard
              title={`貼文${POST_METRICS.find((m) => m.value === postMetric)?.label}趨勢（每月總和，所選粉絲團）`}
              months={months}
              series={postSeries}
              onDownloadName={`貼文${POST_METRICS.find((m) => m.value === postMetric)?.label}趨勢_${rangeStart}_${rangeEnd}.png`}
              unit={POST_METRICS.find((m) => m.value === postMetric)?.unit}
            />
          )}

          <BarChartCard
            title={`本月最高互動貼文 TOP 10（${topEngagedMonth ? monthLabel(topEngagedMonth) : "—"}，所有粉絲團，讚+留言+分享）`}
            items={top10Engaged}
            onDownloadName={`最高互動貼文TOP10_${topEngagedMonth}.png`}
            unit="互動數"
          />

          <ContentDistChartSection pages={pages} posts={posts} allMonths={allMonths} />
          <PostDetailChartSection pages={pages} posts={posts} allMonths={allMonths} />
        </>
      )}
    </div>
  );
}

/* ---------------- Content distribution stacked bar chart (per page, per month) ---------------- */
const TAG_COLORS = {
  "公告":   "#8A9A8E",
  "促銷":   "#B08968",
  "交車":   "#5C6B73",
  "小知識": "#A18A4C",
  "創意":   "#9A8AA6",
  "新車宣傳":"#7B8F77",
  "其他":   "#C4B8A4",
  "未標記": "#DDD6C6",
};

function ContentDistChartSection({ pages, posts, allMonths }) {
  const [distMonth, setDistMonth] = useState(allMonths[allMonths.length - 1] || "");
  const svgRef = useRef(null);

  useEffect(() => {
    if (!distMonth && allMonths.length) setDistMonth(allMonths[allMonths.length - 1]);
  }, [allMonths, distMonth]);

  const distData = useMemo(() => {
    const monthPosts = posts.filter((p) => p.month === distMonth);
    return pages.map((page) => {
      const pagePosts = monthPosts.filter((p) => p.pageId === page.id);
      if (pagePosts.length === 0) return null;
      const tagCounts = {};
      POST_CONTENT_TAGS.forEach((t) => { tagCounts[t] = 0; });
      let untagged = 0;
      pagePosts.forEach((p) => {
        const tags = p.tags || [];
        if (tags.length === 0) untagged++;
        else tags.forEach((t) => { if (tagCounts[t] != null) tagCounts[t]++; });
      });
      return { page, total: pagePosts.length, tagCounts, untagged };
    }).filter(Boolean).sort((a, b) => b.total - a.total);
  }, [pages, posts, distMonth]);

  const allTags = [...POST_CONTENT_TAGS, "未標記"];
  const leftMargin = 210;
  const rightMargin = 60;
  const rowH = 36;
  const width = 820;
  const barAreaW = width - leftMargin - rightMargin;
  const maxTotal = Math.max(...distData.map((r) => r.total), 1);
  const svgH = distData.length * rowH + 40;

  const title = `貼文內容分佈（${distMonth ? monthLabel(distMonth) : "—"}，依粉絲團）`;

  return (
    <>
      <SectionTitle icon="chart" title="貼文內容分佈（單月，依粉絲團）" />
      <div style={styles.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 13, color: "#7A7568" }}>月份：</span>
            <select style={{ ...styles.input, width: "auto" }} value={distMonth} onChange={(e) => setDistMonth(e.target.value)}>
              {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
            </select>
          </div>
          <button style={styles.secondaryBtn} onClick={() => svgRef.current && downloadSvgAsPng(svgRef.current, `貼文內容分佈_${distMonth}.png`, title)} disabled={distData.length === 0}>
            <Icon name="download" size={15} /> 下載圖表
          </button>
        </div>

        {/* Legend */}
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
          {allTags.map((tag) => (
            <div key={tag} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 12, color: "#5C5847" }}>
              <span style={{ width: 12, height: 12, borderRadius: 3, background: TAG_COLORS[tag], display: "inline-block", flexShrink: 0 }} />
              {tag}
            </div>
          ))}
        </div>

        {distData.length === 0 ? (
          <EmptyState text="這個月份尚無貼文紀錄。" />
        ) : (
          <div style={{ overflowX: "auto" }}>
            <svg ref={svgRef} width={width} height={svgH} style={{ display: "block", background: "#FBF9F4" }}>
              {/* X-axis ticks */}
              {[0, 0.25, 0.5, 0.75, 1].map((pct) => {
                const x = leftMargin + pct * barAreaW;
                const val = Math.round(pct * maxTotal);
                return (
                  <g key={pct}>
                    <line x1={x} x2={x} y1={0} y2={svgH - 20} stroke="#E6E1D6" strokeWidth={1} />
                    <text x={x} y={svgH - 6} textAnchor="middle" fontSize={10} fill="#A6A096">{val}</text>
                  </g>
                );
              })}
              {distData.map((r, i) => {
                const y = 10 + i * rowH;
                let xCursor = leftMargin;
                const segments = allTags.map((tag) => {
                  const count = tag === "未標記" ? r.untagged : (r.tagCounts[tag] || 0);
                  const w = (count / maxTotal) * barAreaW;
                  return { tag, count, w };
                }).filter((s) => s.count > 0);

                return (
                  <g key={r.page.id}>
                    <text x={leftMargin - 10} y={y + rowH / 2 + 4} textAnchor="end" fontSize={12} fill="#3A3A38">
                      {r.page.name.length > 16 ? r.page.name.slice(0, 16) + "…" : r.page.name}
                    </text>
                    {segments.map((s) => {
                      const rx = xCursor;
                      xCursor += s.w;
                      return (
                        <g key={s.tag}>
                          <rect x={rx} y={y + 6} width={Math.max(s.w, 1)} height={rowH - 14} fill={TAG_COLORS[s.tag]} />
                          {s.w > 22 && (
                            <text x={rx + s.w / 2} y={y + rowH / 2 + 4} textAnchor="middle" fontSize={10} fill="#fff" fontWeight={600}>{s.count}</text>
                          )}
                        </g>
                      );
                    })}
                    <text x={xCursor + 6} y={y + rowH / 2 + 4} fontSize={11} fill="#7A7568" fontFamily="'Space Grotesk', sans-serif">
                      {r.total}篇
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>
        )}
      </div>
    </>
  );
}

/* ---------------- Single-page single-month post detail chart (date-level) ---------------- */
function PostDetailChartSection({ pages, posts, allMonths }) {
  const [detailPageId, setDetailPageId] = useState(pages[0]?.id || "");
  const [detailMonth, setDetailMonth] = useState(allMonths[allMonths.length - 1] || "");
  const [detailMetric, setDetailMetric] = useState("engagement");
  const svgRef = useRef(null);

  useEffect(() => {
    if (!detailPageId && pages.length) setDetailPageId(pages[0].id);
  }, [pages, detailPageId]);

  useEffect(() => {
    if (!detailMonth && allMonths.length) setDetailMonth(allMonths[allMonths.length - 1]);
  }, [allMonths, detailMonth]);

  const detailPosts = useMemo(() => {
    return posts
      .filter((p) => p.pageId === detailPageId && p.month === detailMonth)
      .sort((a, b) => (a.date || "").localeCompare(b.date || "") || ((a.seq ?? 0) - (b.seq ?? 0)));
  }, [posts, detailPageId, detailMonth]);

  const detailPage = pages.find((p) => p.id === detailPageId);
  const metricInfo = POST_METRICS.find((m) => m.value === detailMetric) || POST_METRICS[1];

  const leftMargin = 64;
  const pointGap = 110;
  const width = Math.max(detailPosts.length * pointGap + leftMargin + 60, 480);
  const height = 320;
  const chartTop = 24;
  const chartBottom = 240;
  const chartH = chartBottom - chartTop;

  const values = detailPosts.map((p) => {
    if (detailMetric === "postCount") return 1;
    if (detailMetric === "engagement") return engagement(p);
    return Number(p[detailMetric]) || 0;
  });
  const maxVal = Math.max(...values, 1);
  const yTicks = [0, 0.25, 0.5, 0.75, 1];

  return (
    <>
      <SectionTitle icon="spark" title="單月貼文明細（依日期排列，每篇貼文獨立顯示）" />
      <div style={styles.card}>
        <div className="fbm-form-grid" style={{ ...styles.formGrid, gridTemplateColumns: "1fr 1fr 2fr" }}>
          <Field label="粉絲團">
            <select style={styles.input} value={detailPageId} onChange={(e) => setDetailPageId(e.target.value)}>
              {pages.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label="月份">
            <select style={styles.input} value={detailMonth} onChange={(e) => setDetailMonth(e.target.value)}>
              {allMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
            </select>
          </Field>
          <Field label="指標">
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {POST_METRICS.filter((m) => m.value !== "postCount").map((m) => (
                <button
                  key={m.value}
                  style={{ ...styles.chipBtn, ...(detailMetric === m.value ? styles.chipBtnActive : {}), padding: "5px 11px", fontSize: 12 }}
                  onClick={() => setDetailMetric(m.value)}
                >
                  {m.label}
                </button>
              ))}
            </div>
          </Field>
        </div>
      </div>

      <div style={styles.card}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontSize: 13, color: "#7A7568", fontWeight: 500 }}>
            {detailPage?.name || "—"} · {detailMonth ? monthLabel(detailMonth) : "—"} · {metricInfo.label}
            （單位：{metricInfo.unit}，共 {detailPosts.length} 篇貼文）
          </div>
          <button
            style={styles.secondaryBtn}
            onClick={() => svgRef.current && downloadSvgAsPng(
              svgRef.current,
              `${detailPage?.name || "粉絲團"}_${detailMonth}_${metricInfo.label}明細.png`,
              `${detailPage?.name || "—"} · ${detailMonth ? monthLabel(detailMonth) : "—"} · ${metricInfo.label}（${metricInfo.unit}）`
            )}
            disabled={detailPosts.length === 0}
          >
            <Icon name="download" size={15} />
            下載圖表
          </button>
        </div>

        {detailPosts.length === 0 ? (
          <EmptyState text="這個粉絲團在所選月份還沒有貼文紀錄。" />
        ) : (
          <div style={{ overflowX: "auto" }}>
            <svg ref={svgRef} width={width} height={height} style={{ display: "block", background: "#FBF9F4" }}>
              {yTicks.map((t, i) => {
                const y = chartBottom - t * chartH;
                const val = Math.round(maxVal * t);
                return (
                  <g key={i}>
                    <line x1={leftMargin} x2={width} y1={y} y2={y} stroke="#E6E1D6" strokeWidth={1} />
                    <text x={leftMargin - 10} y={y + 4} textAnchor="end" fontSize={11} fill="#9C9684" fontFamily="'Space Grotesk', sans-serif">
                      {formatChartNum(val)}
                    </text>
                  </g>
                );
              })}
              {(() => {
                const points = detailPosts.map((p, i) => {
                  const v = values[i];
                  const x = leftMargin + 55 + i * pointGap;
                  const y = chartBottom - (v / maxVal) * chartH;
                  return { x, y, v, post: p };
                });
                const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
                return (
                  <g>
                    <path d={path} fill="none" stroke="#8A9A8E" strokeWidth={2} />
                    {points.map((p, i) => (
                      <g key={i}>
                        <circle cx={p.x} cy={p.y} r={4.5} fill="#8A9A8E" />
                        <text x={p.x} y={p.y - 12} textAnchor="middle" fontSize={11} fill="#5C6B73" fontWeight={600} fontFamily="'Space Grotesk', sans-serif">
                          {formatChartNum(p.v)}
                        </text>
                        <text x={p.x} y={chartBottom + 22} textAnchor="middle" fontSize={11} fill="#7A7568" fontFamily="'Space Grotesk', sans-serif">
                          {p.post.date?.slice(5)}
                        </text>
                        <text x={p.x} y={chartBottom + 38} textAnchor="middle" fontSize={10} fill="#A6A096">
                          {POST_TYPES.find((t) => t.value === p.post.type)?.label}
                        </text>
                      </g>
                    ))}
                  </g>
                );
              })()}
            </svg>
            <div style={styles.hint}>X軸為貼文發布日期（月-日），每個點代表一篇獨立貼文；同一天若有多篇貼文，會依序並排顯示。</div>
          </div>
        )}
      </div>
    </>
  );
}

/* ============================================================ Settings & Backup ============================================================ */
function SettingsView({ pages, fanRecords, posts, groupRecords, savePages, saveFanRecords, savePosts, saveGroupRecords, showToast }) {
  const [pendingRestore, setPendingRestore] = useState(null);
  const [restoreError, setRestoreError] = useState("");
  const restoreInputRef = useRef(null);

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify({
      app: "fbmonitor", version: 1, exportedAt: new Date().toISOString(),
      pages, fanRecords, posts, groupRecords,
    }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `粉絲團監測站_完整備份_${nowMonth()}_${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("已匯出完整備份");
  };

  const handleRestoreFile = async (file) => {
    setRestoreError("");
    try {
      const data = JSON.parse(await file.text());
      if (!data || !Array.isArray(data.pages) || typeof data.fanRecords !== "object" || !Array.isArray(data.posts)) {
        setRestoreError("這個檔案的格式不像是本系統的備份檔，請確認檔案是否正確。");
        return;
      }
      setPendingRestore(data);
    } catch (e) {
      setRestoreError("讀取失敗，請確認檔案是有效的 JSON 備份檔。");
    }
  };

  const confirmRestore = () => {
    if (!pendingRestore) return;
    savePages(pendingRestore.pages || []);
    saveFanRecords(pendingRestore.fanRecords || {});
    savePosts(pendingRestore.posts || []);
    saveGroupRecords(pendingRestore.groupRecords || {});
    showToast("已從備份還原所有資料");
    setPendingRestore(null);
  };

  const stats = useMemo(() => ({
    pages: pages.length,
    posts: posts.length,
    fanEntries: Object.values(fanRecords).reduce((s, arr) => s + (arr || []).length, 0),
    groupMonths: Object.keys(groupRecords).filter((m) => Object.values(groupRecords[m] || {}).some((g) => g)).length,
  }), [pages, posts, fanRecords, groupRecords]);

  return (
    <div style={styles.viewWrap}>
      <Header title="設定與備份" subtitle="管理整個系統的資料備份與還原" />

      {pendingRestore && (
        <ConfirmDialog
          title="確認還原備份"
          message={`這份備份包含 ${(pendingRestore.pages || []).length} 家粉絲團、${(pendingRestore.posts || []).length} 筆貼文紀錄。還原會整批覆蓋目前所有資料，無法復原，請確認。`}
          confirmLabel="確認覆蓋並還原"
          onConfirm={confirmRestore}
          onCancel={() => setPendingRestore(null)}
        />
      )}

      <SectionTitle icon="chart" title="目前資料量" />
      <div style={styles.statRow}>
        <StatCard icon="list" label="追蹤粉絲團" value={stats.pages.toLocaleString()} />
        <StatCard icon="spark" label="貼文紀錄筆數" value={stats.posts.toLocaleString()} />
        <StatCard icon="users" label="粉絲數量測紀錄" value={stats.fanEntries.toLocaleString()} />
        <StatCard icon="trend" label="已設定分組月份" value={`${stats.groupMonths} 個月`} />
      </div>

      <SectionTitle icon="save" title="完整資料備份" />
      <div style={styles.card}>
        <p style={{ fontSize: 13.5, color: "#7A7568", lineHeight: 1.7, marginTop: 0 }}>
          「匯出完整備份」會把所有粉絲團清單、貼文紀錄、粉絲數量測、競賽分組設定打包成一個 JSON 檔案下載。這份備份可以在任何裝置上用「從備份還原」功能完整還原，也適合在 Firebase 出現問題時作為緊急備援。
        </p>
        <p style={{ fontSize: 13, color: "#A6A096", lineHeight: 1.6, marginBottom: 20 }}>
          建議每個月月底輸入完資料後匯出一次，存到 Google Drive 或其他地方保存。
        </p>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <button style={styles.primaryBtn} onClick={exportBackup}>
            <Icon name="download" size={16} />
            匯出完整備份（JSON）
          </button>
          <button style={styles.secondaryBtn} onClick={() => restoreInputRef.current?.click()}>
            <Icon name="trend" size={16} />
            從備份還原
          </button>
          <input ref={restoreInputRef} type="file" accept=".json" style={{ display: "none" }}
            onChange={(e) => e.target.files?.[0] && handleRestoreFile(e.target.files[0])} />
        </div>
        {restoreError && <div style={{ ...styles.errorBox, marginTop: 14 }}>{restoreError}</div>}
      </div>

      <SectionTitle icon="link" title="系統資訊" />
      <div style={styles.card}>
        <table style={{ ...styles.table, fontSize: 13.5 }}>
          <tbody>
            {[
              ["資料儲存位置", "Firebase Firestore（雲端）"],
              ["同步方式", "所有人開啟同一個網址即可共用同一份資料"],
              ["瀏覽器相容性", "建議使用 Chrome、Edge、Safari 最新版"],
              ["手機使用", "支援，點選左上角漢堡按鈕開啟選單"],
            ].map(([label, value]) => (
              <tr key={label} style={styles.tr}>
                <td style={{ ...styles.td, color: "#9C9684", width: 160 }}>{label}</td>
                <td style={styles.td}>{value}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

  return <div style={styles.emptyState}>{text}</div>;

        <div style={styles.modalBody}>
          <p style={{ fontSize: 13.5, color: "#5C5847", lineHeight: 1.7, margin: 0 }}>{message}</p>
        </div>
        <div style={styles.modalFooter}>
          <button style={styles.secondaryBtn} onClick={onCancel}>取消</button>
